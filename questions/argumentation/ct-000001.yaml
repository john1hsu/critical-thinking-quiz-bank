topic: Principle of charity
topic_type: Principle
true_statement: Dana argues the launch should wait because the onboarding flow has known defects. Lee replies, "So you want to delay until the product is perfect?" Lee's reply breaks the principle of charity.
false_statement: Dana argues the launch should wait because the onboarding flow has known defects. Lee replies, "So you want to delay until the product is perfect?" Lee's reply follows the principle of charity.
explanation: Charity asks you to keep a speaker's qualifications and reconstruct the most plausible version of their reasoning before criticising it. Lee turns a specific, checkable claim about defects into an extreme demand for perfection, which is the distortion charity warns against.
