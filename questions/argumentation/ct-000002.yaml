topic: Principle of charity
topic_type: Principle
true_statement: Lewiński suggests applying charity only under real interpretive doubt, and favouring the critic in critical settings such as reviews and trials.
false_statement: Lewiński suggests applying charity only under real interpretive doubt, and favouring the arguer in critical settings such as reviews and trials.
explanation: His 'paradox of charity' notes that being charitable to one side of a dispute can be uncharitable to the other. So he limits charity to genuine ambiguity and, where the point is to test a claim, tilts toward the critic rather than the arguer.
