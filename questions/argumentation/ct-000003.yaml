true_statement: The philosopher N. L. Wilson coined the term "principle of charity" in 1959, and Donald Davidson later made it central to radical interpretation.
false_statement: The philosopher Donald Davidson coined the term "principle of charity" in 1959, and N. L. Wilson later made it central to radical interpretation.
explanation: Wilson introduced the term in 1959. Quine, Lewis, Dennett and above all Davidson then reshaped it; Davidson argued we can only understand a speaker by assuming their beliefs are mostly true and coherent.
