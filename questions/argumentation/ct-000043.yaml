true_statement: A buyer argues the team should switch suppliers because the current one missed three delivery dates this quarter, "since suppliers who miss dates repeatedly usually keep missing them." In Toulmin's layout, that last clause is the warrant.
false_statement: A buyer argues the team should switch suppliers because the current one missed three delivery dates this quarter, "since suppliers who miss dates repeatedly usually keep missing them." In Toulmin's layout, that last clause is the data.
explanation: 'The missed dates are the data; the general rule licensing the step from those dates to the claim is the warrant. Telling data from warrant is the commonest stumbling block: data are the specific facts, the warrant is the bridge that says why they count.'
