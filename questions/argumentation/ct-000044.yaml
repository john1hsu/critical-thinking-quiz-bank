topic: Toulmin model of argument
topic_type: Framework
true_statement: When a colleague's argument rests on an unstated warrant, spelling that warrant out is usually where the real disagreement surfaces.
false_statement: When a colleague's argument rests on an unstated warrant, re-checking the data is usually where the real disagreement surfaces.
explanation: Warrants are often left implicit, and that is where most disputes actually lie. Making the warrant explicit lets you ask whether it holds and what backs it, rather than arguing past each other about facts both sides accept.
