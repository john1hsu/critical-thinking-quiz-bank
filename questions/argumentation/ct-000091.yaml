true_statement: Reviewing a proposal to change vendors, a director checks whether its author carried the burden of proof for the change and answered finance's cost objection. She is judging the argument as a procedure, the dialectical lens.
false_statement: Reviewing a proposal to change vendors, a director checks whether its author carried the burden of proof for the change and answered finance's cost objection. She is judging the argument as a product, the logical lens.
explanation: In Wenzel's three lenses, burden of proof and replying to objections concern whether a disagreement was handled by fair rules, the dialectical view. The product lens asks whether the reasons themselves are good; the process lens asks whether it persuades this audience.
