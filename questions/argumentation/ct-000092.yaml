true_statement: On Dutilh Novaes's view, when two colleagues' interests barely conflict, their argument should stay largely cooperative rather than combative.
false_statement: On Dutilh Novaes's view, when two colleagues' interests barely conflict, their argument should still be fully combative, since opposition is built into all argument.
explanation: She proposes that adversariality be proportional to the real conflict of interests between the parties. The false version pushes Govier's point about minimal opposition much further than either holds.
