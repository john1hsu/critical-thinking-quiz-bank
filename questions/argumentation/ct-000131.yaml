true_statement: Johnson's "dialectical tier" holds that a complete argument must also answer the objections it faces, not just give reasons for its conclusion.
false_statement: Johnson's "dialectical tier" holds that a complete argument must also be restated in a valid deductive form, not just give reasons for its conclusion.
explanation: 'The dialectical tier adds a second layer to an argument: dealing with known objections and alternative positions. Informal logic deliberately avoids making deductive validity its main test, and the tier has itself been disputed by Govier and others.'
