true_statement: Informal logic grew from Ralph Johnson's finding at Windsor in the late 1960s that students taught symbolic logic could not apply it to real arguments.
false_statement: Informal logic grew from Ralph Johnson's finding at Windsor in the late 1960s that students taught to analyse real arguments could not handle symbolic logic proofs.
explanation: The gap ran from formal training to everyday use, so Johnson started an "Applied Logic" course built on media examples, later joined by Blair. Their handouts became the 1977 textbook Logical Self-Defense.
