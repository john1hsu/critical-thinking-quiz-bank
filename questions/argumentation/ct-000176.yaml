id: ct-000176
area: argumentation
kind: scenario
topic: Argumentation schemes
topic_type: Framework
true_statement: A team accepts the night supervisor's report that the loading dock flooded overnight, because she was there and saw it. The team is reasoning from a position to know.
false_statement: A team accepts the night supervisor's report that the loading dock flooded overnight, because she was there and saw it. The team is reasoning from expert opinion.
explanation: The supervisor's authority comes from access to the facts, not from expertise in a field. The expert-opinion scheme specifically requires the source to be an expert, which is what separates it from the broader position-to-know scheme.
