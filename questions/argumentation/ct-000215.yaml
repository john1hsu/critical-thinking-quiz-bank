true_statement: A colleague proposes trimming the travel budget by 10%. A manager rebuts her by arguing at length that banning all travel would wreck client relationships. In pragma-dialectical terms, the rebuttal breaks the standpoint rule.
false_statement: A colleague proposes trimming the travel budget by 10%. A manager rebuts her by arguing at length that banning all travel would wreck client relationships. In pragma-dialectical terms, the rebuttal breaks the freedom rule.
explanation: 'The standpoint rule says to attack only positions the other side actually holds, and here a trim has become a ban: a straw man. The freedom rule covers moves that stop someone from advancing or questioning a standpoint at all, such as personal attacks.'
