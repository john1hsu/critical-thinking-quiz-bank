id: ct-000216
area: argumentation
kind: counter
topic: Pragma-dialectics
topic_type: Framework
true_statement: When filling in a premise someone left unstated, pragma-dialectics starts from the logical minimum that would make their step valid, rather than the strongest claim they might hold.
false_statement: When filling in a premise someone left unstated, pragma-dialectics starts from the strongest general claim the arguer might hold, rather than the logical minimum that would make their step valid.
explanation: Beginning with the minimum avoids pinning on the arguer a sweeping premise they never committed to, which would itself break the rule against misattributing unstated premises. Context can then refine it.
