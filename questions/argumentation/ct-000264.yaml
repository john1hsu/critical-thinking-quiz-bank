true_statement: Mapping a colleague's case that a supplier can be trusted, you find its main reason, "the supplier's self-audit is accurate", is itself supported by "the supplier can be trusted". The arrows form a loop, so the support is circular.
false_statement: Mapping a colleague's case that a supplier can be trusted, you find its main reason, "the supplier's self-audit is accurate", is itself supported by "the supplier can be trusted". The arrows show two independent reasons, so the support is strong.
explanation: When the conclusion turns up as support for its own reason, the diagram closes into a loop, the visual signature of begging the question. Independent reasons would each lead up to the conclusion without depending on it; the useful next step is an outside check that could break the loop.
