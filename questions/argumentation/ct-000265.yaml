area: argumentation
kind: counter
topic: Argument mapping
topic_type: Technique
true_statement: While mapping an argument, if a key term in the conclusion appears in none of the premises, treat that gap as a cue to add the unstated premise, in brackets.
false_statement: While mapping an argument, if a key term in the conclusion appears in none of the premises, treat that gap as a cue to delete the term, since a map should hold only claims stated outright.
explanation: The rule of thumb is that every key term in the conclusion should show up in some premise; a missing term usually signals a hidden assumption the argument relies on. Deleting the term changes the claim instead of exposing what it rests on.
