true_statement: In an experiment comparing the two formats, reading an argument as a map rather than as prose improved students' recall of it but not their comprehension.
false_statement: In an experiment comparing the two formats, reading an argument as a map rather than as prose improved students' comprehension of it but not their recall.
explanation: The map helped memory for the argument but did not deepen understanding, one reason the evidence for mapping is rated mixed. Gains reported elsewhere are real but hard to separate from intensive teaching and feedback.
