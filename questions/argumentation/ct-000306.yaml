id: ct-000306
area: argumentation
kind: scenario
topic: Argument from expert opinion
topic_type: ArgumentScheme
true_statement: A team asks the company's in-house tax specialist whether a new expense type is deductible. She says yes, cites the rule she relied on, and no other specialist disagrees. Relying on her is a reasonable argument from expert opinion.
false_statement: A team asks the company's in-house tax specialist whether a new expense type is deductible. She says yes, cites the rule she relied on, and no other specialist disagrees. Relying on her is the ad verecundiam fallacy.
explanation: The claim sits inside her field, her basis is stated, and no expert disagrees, so the critical questions raise no doubt and the presumption stands. Ad verecundiam is a misuse of the scheme that fails one of its requirements; most appeals to authority are not fallacious.
