topic: Argument from expert opinion
topic_type: ArgumentScheme
true_statement: A structural engineer says a floor can carry heavy archive shelving, but she has looked only at the original plans. The question to press is what evidence her view rests on, since the plans may not match what was built.
false_statement: A structural engineer says a floor can carry heavy archive shelving, but she has looked only at the original plans. The question to press is whether floor loads fall within her field, since the plans may not match what was built.
explanation: 'Floor loading is squarely a structural engineer''s field, so the field question is already answered. The open weakness is backup evidence: an opinion formed from drawings rather than the actual structure needs its basis checked.'
