topic: Argument from expert opinion
topic_type: ArgumentScheme
true_statement: John Locke introduced the label "argumentum ad verecundiam" in his 1690 Essay Concerning Human Understanding, but he did not call it a fallacy; later textbook writers did.
false_statement: John Locke introduced the label "argumentum ad verecundiam" in his 1690 Essay Concerning Human Understanding and branded it a fallacy; later textbook writers softened it.
explanation: Locke listed it as one way people win assent, and his wording about eminence and modesty points to deference to social rank rather than expertise. The fallacy label was added by later textbooks, and Walton's scheme later recast expert appeals as reasonable but defeasible.
