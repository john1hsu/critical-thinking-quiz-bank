true_statement: Two managers agree the logs show a four-hour slowdown last week but argue over whether it counts as an "outage" under the vendor contract. In stasis terms, their dispute sits at definition.
false_statement: Two managers agree the logs show a four-hour slowdown last week but argue over whether it counts as an "outage" under the vendor contract. In stasis terms, their dispute sits at conjecture.
explanation: Conjecture is a dispute about whether something happened; here the facts are conceded and only the label is contested, which is the stasis of definition. Spotting that tells the meeting to argue about the contract wording, not the logs.
