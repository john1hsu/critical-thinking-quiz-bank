topic: Stasis theory
topic_type: Framework
true_statement: To use stasis theory in a stalled meeting, walk through fact, definition, quality and policy in order, note which are agreed, and stop at the first real disagreement.
false_statement: To use stasis theory in a stalled meeting, walk through fact, definition, quality and policy in order, and stop at the first question both sides already agree on.
explanation: Agreed stases are common ground to bank, not the place to argue. The point of the walk-through is to find the first question where one side's claim meets the other's denial, because that is where the debate must happen.
