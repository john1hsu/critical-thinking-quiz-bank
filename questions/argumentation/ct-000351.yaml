true_statement: Stasis theory is credited to Hermagoras of Temnos, a Greek rhetorician of the second century BC whose own writings are lost.
false_statement: Stasis theory is credited to Hermogenes, a Greek rhetorician of the second century BC whose own writings are lost.
explanation: Hermagoras founded the doctrine and his system has to be reconstructed from Cicero, Quintilian and others. Hermogenes is a later theorist, of the second century AD, who reworked the scheme rather than introduced it.
