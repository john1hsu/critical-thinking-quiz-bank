id: ct-000391
area: argumentation
kind: scenario
topic: Argument from analogy
topic_type: ArgumentScheme
true_statement: A manager argues the sales team can move to a four-day week because it worked for the similar support team. A colleague replies that engineering tried the same change and missed two release dates. Her reply is a counter-analogy.
false_statement: A manager argues the sales team can move to a four-day week because it worked for the similar support team. A colleague replies that engineering tried the same change and missed two release dates. Her reply points to a relevant difference between sales and support.
explanation: A counter-analogy brings in a third case that resembles the source but turned out the other way. Pointing to a relevant difference would instead attack the sales-support comparison itself, for example by noting that sales closes deals in Friday meetings.
