id: ct-000392
area: argumentation
kind: counter
topic: Argument from analogy
topic_type: ArgumentScheme
true_statement: To test an analogy, ask what in the source case actually produced the outcome, then check whether that factor is also present in the target case.
false_statement: To test an analogy, count how many features the two cases share overall, since the sheer number of shared features is the central test of a good analogy.
explanation: Many shared features can be irrelevant to the conclusion, which is how faulty analogies arise. The stronger test links the outcome to its cause in the source and asks whether nothing in the target blocks that link.
