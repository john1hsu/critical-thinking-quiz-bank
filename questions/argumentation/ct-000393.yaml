topic: Argument from analogy
topic_type: ArgumentScheme
true_statement: In Mary Hesse's layout of an analogy, features not yet known to match or differ between the two cases make up the neutral analogy.
false_statement: In Mary Hesse's layout of an analogy, features not yet known to match or differ between the two cases make up the negative analogy.
explanation: 'Hesse sorts features into three groups: known similarities (positive), known differences (negative), and the still-unknown ones (neutral). An argument from analogy projects something from the source into that unknown territory in the target.'
