id: ct-000430
area: argumentation
kind: scenario
topic: Argument from consequences
topic_type: ArgumentScheme
true_statement: Asked whether last quarter's sales report is accurate, a director insists it must be, since admitting errors would rattle investors. Used to settle a question of fact, that is the fallacy of appeal to consequences.
false_statement: Asked whether last quarter's sales report is accurate, a director insists it must be, since admitting errors would rattle investors. Used to settle a question of fact, that is a reasonable argument from consequences.
explanation: Consequences can be good reasons for deciding what to do, but they have no bearing on whether a report is true. The tell is the shift from "is it accurate?" to "what would be convenient?"
