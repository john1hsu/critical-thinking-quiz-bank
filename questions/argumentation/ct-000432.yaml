id: ct-000432
area: argumentation
kind: definition
topic: Argument from consequences
topic_type: ArgumentScheme
true_statement: An argument from negative consequences becomes an argument from threat when the speaker is committed to bringing about the bad outcome; a mere warning lacks that commitment.
false_statement: An argument from negative consequences becomes an argument from threat when the bad outcome is severe, whoever would bring it about; a mere warning concerns only mild outcomes.
explanation: What turns a warning into a threat is who causes the harm, not how big it is. Warning that heavy drinking risks early death is prudential; a professor promising a bad grade for defending a view is a threat.
