true_statement: When a borderline case meets a rule, ask whether it sits in the rule's clear core or its penumbra, and if in the penumbra, whether the rule's purpose reaches it.
false_statement: When a borderline case meets a rule, ask whether it sits in the rule's clear core or its penumbra, and if in the penumbra, settle it by the rule's literal words alone.
explanation: Hart's park example shows that the words settle core cases, like an ordinary car, but not penumbral ones, like a bicycle. There the words run out, so the useful question is why the rule exists and whether that reason applies.
