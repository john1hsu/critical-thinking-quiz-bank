topic: Legal reasoning
topic_type: Field
true_statement: On Edward Levi's account of reasoning by example, legal rules change as they are used, because each new judgment of similarity between cases reshapes the rule.
false_statement: On Edward Levi's account of reasoning by example, legal rules stay fixed as they are used, because each new case is matched against the rule as first announced.
explanation: Levi's three steps are seeing a similarity, announcing the rule implicit in the first case, and applying it to the second. Since the announced rule depends on which similarities are judged relevant, it shifts with each new case.
