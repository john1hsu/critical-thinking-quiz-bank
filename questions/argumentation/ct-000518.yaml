topic: Plain language
topic_type: Technique
true_statement: An editor cuts every sentence in a leave policy to under fifteen words and declares the policy now unambiguous. That doesn't follow, because a short, easy-to-read sentence can still be read two ways.
false_statement: An editor cuts every sentence in a leave policy to under fifteen words and declares the policy now unambiguous. That follows, because a short, easy-to-read sentence can't be read two ways.
explanation: Length isn't what creates amphiboly; a trailing modifier or an "and/or" can sit in a short sentence. That is why plain-language guidance pairs drafting rules with testing on real readers.
