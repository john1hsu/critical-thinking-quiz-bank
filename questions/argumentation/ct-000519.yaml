topic: Plain language
topic_type: Technique
true_statement: Masson and Waldron (1994) found that plain-language redrafting of contracts improved non-experts' comprehension, yet comprehension stayed very low because readers misunderstood legal concepts that clashed with their beliefs.
false_statement: Masson and Waldron (1994) found that plain-language redrafting of contracts improved non-experts' comprehension to near-perfect levels, once simpler words removed the legal concepts that clashed with their beliefs.
explanation: Simpler words and sentences helped reliably, but conceptual difficulty remained. Plain language fixes structural and word-level ambiguity, not misunderstood ideas, which is why its evidence status is mixed.
