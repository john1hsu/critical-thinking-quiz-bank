id: ct-000004
area: cognitive-biases
kind: scenario
topic: Anchoring effect
topic_type: CognitiveBias
true_statement: In a salary negotiation the employer names a figure first, and the final settlement lands much closer to it than an independent valuation would. That pull toward the first number is the anchoring effect.
false_statement: In a salary negotiation the employer names a figure first, and the final settlement lands much closer to it than an independent valuation would. That pull toward the first number is the framing effect.
explanation: Anchoring is the drift of a numerical judgment toward a number seen or considered first, and an opening offer is a classic anchor. Framing concerns how the same information is described, not which number came first.
