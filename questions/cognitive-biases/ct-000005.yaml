id: ct-000005
area: cognitive-biases
kind: counter
topic: Anchoring effect
topic_type: CognitiveBias
true_statement: To blunt anchoring in a team estimate, collect each person's estimate independently before anyone discusses a number.
false_statement: To blunt anchoring in a team estimate, have the most experienced person state a number first so others can adjust from it.
explanation: Anyone's first stated number becomes an anchor that the others adjust from too little. Expertise doesn't protect against anchoring (judges in sentencing studies were not immune), so independent estimates gathered before discussion are the safer design.
