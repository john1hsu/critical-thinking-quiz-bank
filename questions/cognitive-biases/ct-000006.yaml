id: ct-000006
area: cognitive-biases
kind: evidence
topic: Anchoring effect
topic_type: CognitiveBias
true_statement: Röseler and colleagues' 2025 preregistered studies found that limiting the time to adjust did not strengthen anchoring, undercutting the insufficient-adjustment account.
false_statement: Röseler and colleagues' 2025 preregistered studies found that limiting the time to adjust strengthened anchoring, confirming the insufficient-adjustment account.
explanation: If people anchor because they stop adjusting too soon, less time should mean more anchoring; it didn't. The challenge is to the mechanism, not the effect itself, which replicates well in classic numerical estimates.
