id: ct-000058
area: cognitive-biases
kind: scenario
topic: Bias blind spot
topic_type: CognitiveBias
true_statement: A procurement lead who used to work at one bidder asks herself whether she is favouring them, feels no pull either way, and concludes she is objective. Her check is a weak test, because most biases operate outside awareness.
false_statement: A procurement lead who used to work at one bidder asks herself whether she is favouring them, feels no pull either way, and concludes she is objective. Her check is a sound test, because people can feel their own biases when they look for them.
explanation: 'Looking inward and finding no feeling of unfairness is the introspection illusion that drives the bias blind spot. A better test is the external one she would apply to others: does her conclusion favour her ties, and does it depart from what a neutral reviewer would expect?'
