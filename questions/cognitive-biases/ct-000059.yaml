topic: Bias blind spot
topic_type: CognitiveBias
true_statement: In lab studies, teaching people that bias works without awareness, so introspection can't detect it, removed the bias blind spot, while simple warnings about bias did little.
false_statement: In lab studies, simple warnings that people are prone to bias removed the bias blind spot, while teaching them that bias works without awareness did little.
explanation: 'The effective lesson targets the mechanism: it undercuts the belief that feeling fair means being fair. A generic warning leaves that belief intact, so people agree bias exists but still exempt themselves.'
