id: ct-000094
area: cognitive-biases
kind: scenario
topic: Overconfidence effect
topic_type: CognitiveBias
true_statement: Over two years, a project manager's "90% sure" ranges for delivery dates contained the actual date only about half the time. That pattern is overprecision.
false_statement: Over two years, a project manager's "90% sure" ranges for delivery dates contained the actual date only about half the time. That pattern is overplacement.
explanation: Too-narrow ranges for the stated confidence mean being too sure your beliefs are accurate, which is overprecision. Overplacement is rating yourself above others, which this track record says nothing about.
