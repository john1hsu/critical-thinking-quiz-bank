id: ct-000095
area: cognitive-biases
kind: counter
topic: Overconfidence effect
topic_type: CognitiveBias
true_statement: Rather than asking for one 90% range, splitting the possible values into bins and having the forecaster assign a probability to each (SPIES) brings hit rates much closer to the stated confidence.
false_statement: Rather than asking for one 90% range, splitting the possible values into bins and having the forecaster assign a probability to each (SPIES) pushes hit rates further below the stated confidence.
explanation: Forcing a judgment about every part of the range makes people give weight to outcomes they would have left out. In Haran and colleagues' work, SPIES nearly hit its 90% target and later intervals were wider too.
