topic: Overconfidence effect
topic_type: CognitiveBias
true_statement: Moore and Healy found that on hard quizzes people overestimate their own score yet place themselves below others, and on easy quizzes they do the reverse.
false_statement: Moore and Healy found that on hard quizzes people underestimate their own score yet place themselves above others, and on easy quizzes they do the reverse.
explanation: 'Their account is regression: estimates blend a prior with a noisy signal, and since people know even less about others, those estimates regress further. That produces opposite errors on easy and hard tasks.'
