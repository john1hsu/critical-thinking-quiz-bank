id: ct-000139
area: cognitive-biases
kind: scenario
topic: Confirmation bias
topic_type: CognitiveBias
true_statement: Sure her new pricing page lifted sales, a manager cites the weeks sales rose and three happy customer emails, but never checks sales in regions that kept the old page. That is confirmation bias.
false_statement: Sure her new pricing page lifted sales, a manager cites the weeks sales rose and three happy customer emails, but never checks sales in regions that kept the old page. That is belief perseverance.
explanation: She only runs checks that could agree with her, so her confidence grows without the idea ever being at risk. Belief perseverance is holding on to a belief after its supporting evidence has been discredited, which hasn't happened here.
