id: ct-000140
area: cognitive-biases
kind: counter
topic: Confirmation bias
topic_type: CognitiveBias
true_statement: To check a hunch about why a metric moved, write down at least one rival explanation and ask how likely each piece of evidence would be under each one.
false_statement: To check a hunch about why a metric moved, list every piece of evidence that fits the hunch and ask how strongly each one supports it.
explanation: Evidence that would look the same whether you're right or wrong shouldn't raise your confidence. Comparing explanations side by side exposes that; collecting fits for one idea is the bias itself.
