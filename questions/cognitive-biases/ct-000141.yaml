topic: Confirmation bias
topic_type: CognitiveBias
true_statement: Guess and Coppock's three large survey experiments found no evidence that counter-attitudinal information makes people dig in harder, even under conditions designed to favour backlash.
false_statement: Guess and Coppock's three large survey experiments found strong evidence that counter-attitudinal information makes people dig in harder, especially under conditions designed to favour backlash.
explanation: The core tendency to favour congenial information is well supported, but the stronger "backfire" claim attached to it has not held up. Presenting contrary evidence is not usually counterproductive.
