id: ct-000182
area: cognitive-biases
kind: scenario
topic: Belief bias
topic_type: CognitiveBias
true_statement: A reviewer passes a logically flawed argument because she likes its conclusion, then catches the identical flaw when the same structure argues for a conclusion she rejects. That is belief bias.
false_statement: A reviewer passes a logically flawed argument because she likes its conclusion, then catches the identical flaw when the same structure argues for a conclusion she rejects. That is confirmation bias.
explanation: 'The tell is a validity judgment that flips with the conclusion while the form stays the same: belief is standing in for logic. Confirmation bias concerns how people seek and weigh evidence for a view, not how they judge whether a conclusion follows.'
