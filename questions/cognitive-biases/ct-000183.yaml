id: ct-000183
area: cognitive-biases
kind: counter
topic: Belief bias
topic_type: CognitiveBias
true_statement: To resist belief bias, work forward from the premises to see what follows before looking at the conclusion, rather than starting from the conclusion and scanning the premises for support.
false_statement: To resist belief bias, start from the conclusion and scan the premises for support, rather than working forward from the premises before looking at the conclusion.
explanation: In think-aloud protocols, people who began with the conclusion showed the most belief bias and forward reasoners the least. Starting from the conclusion invites you to judge it by whether you agree.
