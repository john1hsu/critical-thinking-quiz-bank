area: cognitive-biases
kind: evidence
topic: Belief bias
topic_type: CognitiveBias
true_statement: In a 2005 study, forcing people to answer quickly increased belief bias and cut logically correct answers, which was read as support for dual-process theory.
false_statement: In a 2005 study, forcing people to answer quickly reduced belief bias and raised logically correct answers, which was read as evidence against dual-process theory.
explanation: On the dual-process account, fast intuition produces belief-based answers and slower analysis is needed to override them, so time pressure should make the bias worse, and it did. The false version reverses the direction of the effect.
