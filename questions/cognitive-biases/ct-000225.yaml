kind: mechanism
topic: Cognitive bias
topic_type: Concept
true_statement: Error management theory holds that when false alarms and misses carried unequal costs over evolutionary history, selection favoured leaning toward the cheaper error.
false_statement: Error management theory holds that when false alarms and misses carried unequal costs over evolutionary history, selection favoured leaning toward the costlier error.
explanation: Like a smoke detector tuned to sound too often rather than miss a fire, some biases trade frequent cheap mistakes for fewer expensive ones. On this view they are design features, not defects.
