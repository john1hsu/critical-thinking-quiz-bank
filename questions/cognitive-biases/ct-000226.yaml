true_statement: In the Many Labs 2 replication project (2018), median effect sizes shrank from d = 0.60 in the original studies to d = 0.15 in the replications.
false_statement: In the Many Labs 2 replication project (2018), median effect sizes shrank only slightly, from d = 0.60 in the original studies to d = 0.45 in the replications.
explanation: Only about half of 28 effects replicated, and typical effects ended up roughly a quarter of their original size. That is why the size of any single bias should be checked study by study.
