topic: Framing effect
topic_type: CognitiveBias
true_statement: 'Two versions of a staff memo urge joining a new training scheme: one stresses what staff gain by joining, the other what they lose by not joining. Testing which version persuades more is a study of goal framing.'
false_statement: 'Two versions of a staff memo urge joining a new training scheme: one stresses what staff gain by joining, the other what they lose by not joining. Testing which version persuades more is a study of attribute framing.'
explanation: The tell is a persuasive message contrasting the benefits of acting with the costs of not acting, which is goal framing in Levin and colleagues' typology. Attribute framing instead describes a single feature positively or negatively, such as a 90% success rate versus a 10% failure rate.
