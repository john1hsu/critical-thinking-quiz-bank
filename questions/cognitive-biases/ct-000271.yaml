id: ct-000271
area: cognitive-biases
kind: counter
topic: Framing effect
topic_type: CognitiveBias
true_statement: Before approving an option described as a gain, restate it as the equivalent loss; if your preference flips, the wording rather than the outcomes was doing the work.
false_statement: Before approving an option described as a gain, restate it as the equivalent loss; if your preference flips, the loss version shows your real preference and should win.
explanation: 'Restating in the opposite frame exposes whether wording is driving the choice. It does not say which preference is right: Tversky and Kahneman cautioned that even once a reversal is exposed, it is not always clear which preference to keep.'
