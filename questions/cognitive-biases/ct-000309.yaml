id: ct-000309
area: cognitive-biases
kind: scenario
topic: Hindsight bias
topic_type: CognitiveBias
true_statement: After a supplier collapses, a review board calls the warning signs obvious and faults the buyer, though in the file at the time those signs were one item among dozens. That is hindsight bias.
false_statement: After a supplier collapses, a review board calls the warning signs obvious and faults the buyer, though in the file at the time those signs were one item among dozens. That is the overconfidence effect.
explanation: Knowing the outcome makes the signs that led to it look decisive, so the board judges the past as more foreseeable than it was. Overconfidence is excess confidence in one's own judgments going forward; here the error is grading an earlier decision by its outcome.
