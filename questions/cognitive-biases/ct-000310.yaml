id: ct-000310
area: cognitive-biases
kind: counter
topic: Hindsight bias
topic_type: CognitiveBias
true_statement: To keep a project retrospective fair, have people write down their forecasts and reasons before the outcome is known, then review against that record rather than memory.
false_statement: To keep a project retrospective fair, have people write down their forecasts and reasons once the outcome is known, while memories are fresh, then review against that record.
explanation: Once the outcome is known, people misremember their earlier predictions as closer to it, so any record made afterwards is already tilted. Only a record made beforehand shows what was actually expected and knowable at the time.
