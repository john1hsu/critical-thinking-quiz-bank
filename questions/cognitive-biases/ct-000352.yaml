id: ct-000352
area: cognitive-biases
kind: scenario
topic: Insensitivity to sample size
topic_type: CognitiveBias
true_statement: A product lead treats 4 of 5 testers preferring design A as stronger evidence that most users prefer it than 12 of 20 testers preferring it would be. That reflects insensitivity to sample size.
false_statement: A product lead treats 4 of 5 testers preferring design A as stronger evidence that most users prefer it than 12 of 20 testers preferring it would be. That reflects base-rate neglect.
explanation: The lead is swayed by the more striking proportion (80% vs 60%) and ignores that 20 cases carry more weight than 5, the hallmark of sample-size neglect. Base-rate neglect would mean ignoring how common a category is beforehand, which plays no part here.
