id: ct-000354
area: cognitive-biases
kind: evidence
topic: Insensitivity to sample size
topic_type: CognitiveBias
true_statement: Sedlmeier and Gigerenzer argued that people do grasp that bigger samples give more trustworthy estimates, and mainly fail when they must judge how variable many samples will be.
false_statement: Sedlmeier and Gigerenzer argued that people do grasp how variable many samples will be, and mainly fail when they must judge whether bigger samples give more trustworthy estimates.
explanation: Their review split tasks into accuracy judgments, which people handle fairly well, and sampling-distribution judgments like the hospital problem, where performance sits near chance. That split is why the bias is contested rather than a blanket failure.
