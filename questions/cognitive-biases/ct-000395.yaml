topic: Fundamental attribution error
topic_type: CognitiveBias
true_statement: To curb the fundamental attribution error in performance reviews, put the situational information in plain view, such as showing a fund's returns against the market in one clear figure.
false_statement: To curb the fundamental attribution error in performance reviews, keep situational information in the background, since putting it in plain view tends to make reviewers overcorrect.
explanation: In Scopelliti and colleagues' studies, the most bias-prone people ignored situational numbers that were available but buried, and the bias vanished once the comparison was shown in one simple figure. Making the situation easy to see is the fix.
