topic: Fundamental attribution error
topic_type: CognitiveBias
true_statement: Mentally busy observers are more prone to the fundamental attribution error, because the quick trait inference still happens while the effortful correction for the situation gets skipped.
false_statement: Mentally busy observers are less prone to the fundamental attribution error, because the effortful trait inference gets skipped while the quick correction for the situation still happens.
explanation: On the characterization-correction account, people first read a trait off the behaviour automatically, then adjust for circumstances only if they have the capacity. Cognitive load knocks out that second step, so judging people while rushed is a warning sign.
