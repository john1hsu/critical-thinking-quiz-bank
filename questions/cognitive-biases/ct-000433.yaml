topic: Sunk cost fallacy
topic_type: CognitiveBias
true_statement: A stalled software rollout will cost more to finish than it can return, yet the IT director argues for more funding because $2 million has already gone into it. That is the sunk cost fallacy.
false_statement: A stalled software rollout will cost more to finish than it can return, yet the IT director argues for more funding because $2 million has already gone into it. That is the framing effect.
explanation: The money already spent is gone whichever way the decision goes, so only remaining costs and benefits should count. Letting the past outlay drive further investment is the sunk cost fallacy; a framing effect would hinge on how the same options are worded.
