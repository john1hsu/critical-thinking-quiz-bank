topic: Sunk cost fallacy
topic_type: CognitiveBias
true_statement: In Arkes and Blumer's 1985 studies, students who had taken economics showed the sunk cost effect about as much as those who had not.
false_statement: In Arkes and Blumer's 1985 studies, students who had taken economics showed a much weaker sunk cost effect than those who had not.
explanation: Knowing the textbook rule that sunk costs are irrelevant did not protect people, and a later meta-analysis likewise found no benefit from economic familiarity. That is why changing how the decision is posed works better than simply teaching the rule.
