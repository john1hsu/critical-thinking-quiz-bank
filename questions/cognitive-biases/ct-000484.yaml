topic: Planning fallacy
topic_type: CognitiveBias
true_statement: A team lead sizes each step of a reporting migration and promises three weeks, though the last two migrations took seven, because each had a "one-off" problem that won't recur. That is the planning fallacy.
false_statement: A team lead sizes each step of a reporting migration and promises three weeks, though the last two migrations took seven, because each had a "one-off" problem that won't recur. That is overprecision.
explanation: The tell is knowing past jobs overran yet explaining the overruns away as special and forecasting from the plan's steps alone. Overprecision is about too-narrow confidence ranges; the lead gave no range at all.
