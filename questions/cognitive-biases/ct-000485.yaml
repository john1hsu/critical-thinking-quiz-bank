area: cognitive-biases
kind: counter
topic: Planning fallacy
topic_type: CognitiveBias
true_statement: Planning backward from the deadline rather than forward from today led people in a 2016 study to predict later finishes, with no significant optimistic bias.
false_statement: Planning backward from the deadline rather than forward from today led people in a 2016 study to predict earlier finishes, with an even larger optimistic bias.
explanation: Backward planners gave later, and on average unbiased, completion estimates, while forward planners again underestimated. The study left the mechanism unclear, so treat it as a useful tactic rather than a full explanation.
