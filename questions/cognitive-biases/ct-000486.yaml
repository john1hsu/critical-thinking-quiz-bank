id: ct-000486
area: cognitive-biases
kind: evidence
topic: Planning fallacy
topic_type: CognitiveBias
true_statement: Roy and Christenfeld (2007) argued that people underestimate how long future tasks will take partly because they misremember past tasks as having taken less time than they did.
false_statement: Roy and Christenfeld (2007) argued that people underestimate how long future tasks will take partly because they misremember past tasks as having taken more time than they did.
explanation: If memory shrinks past durations, even a forecaster who consults the past starts from too-short figures. That challenges the idea that the error comes only from neglecting the past; checking recorded durations, not recollections, addresses it.
