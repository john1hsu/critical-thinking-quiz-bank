area: cognitive-biases
kind: scenario
topic: Status quo bias
topic_type: CognitiveBias
true_statement: Renewing a software contract, a team judges two rival vendors against "what we have now", shrugging off the incumbent's known flaws while dwelling on the rivals' switching risks. That is status quo bias.
false_statement: Renewing a software contract, a team judges two rival vendors against "what we have now", shrugging off the incumbent's known flaws while dwelling on the rivals' switching risks. That is the endowment effect.
explanation: The pull here is toward the current option over a change, with alternatives judged by their risks and the incumbent's costs left unexamined. The endowment effect is the related tendency to value an object more because you own it.
