id: ct-000524
area: cognitive-biases
kind: counter
topic: Status quo bias
topic_type: CognitiveBias
true_statement: To check a decision for status quo bias, list every option, including the current one, without marking which is the incumbent, and score them all on the same criteria.
false_statement: To check a decision for status quo bias, list the alternatives and score each one against the current option as the baseline, so the incumbent sets the standard.
explanation: Labelling one option as the status quo is exactly what tilts choices toward it in the classic experiments. A neutral listing removes that label, while using the incumbent as the baseline builds the bias into the comparison.
