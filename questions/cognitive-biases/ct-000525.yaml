area: cognitive-biases
kind: evidence
topic: Status quo bias
topic_type: CognitiveBias
true_statement: A 2021 preregistered replication found status quo bias in budget, investment and job-choice problems but not in a car-colour choice, and its authors advised against calling the bias pervasive.
false_statement: A 2021 preregistered replication found status quo bias in all four problems, car colour included, and its authors concluded the bias is pervasive across choices.
explanation: The bias reappeared at original-sized or larger effects in three scenarios but largely vanished in the fourth. Together with the wide spread in default effects, that is why its evidence is rated mixed rather than robust.
