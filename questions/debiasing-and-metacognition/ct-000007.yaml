id: ct-000007
area: debiasing-and-metacognition
kind: scenario
topic: Consider the opposite
topic_type: Technique
true_statement: Asked to list twelve reasons her forecast could be wrong, an analyst runs dry after four and decides the forecast must be right. That backfire fits the ease-of-retrieval effect.
false_statement: Asked to list twelve reasons her forecast could be wrong, an analyst runs dry after four and decides the forecast must be right. That backfire fits the anchoring effect.
explanation: When counter-reasons are hard to produce, people read the difficulty itself as evidence that their view is right. That metacognitive ease-of-retrieval effect is why asking for many alternatives can make consider-the-opposite backfire.
