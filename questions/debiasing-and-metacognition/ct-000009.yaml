true_statement: A 2020 survey experiment with UK public managers found that a brief, low-cost consider-the-opposite prompt reduced anchoring.
false_statement: A 2020 survey experiment with UK public managers found that a brief, low-cost consider-the-opposite prompt had no effect on anchoring.
explanation: Nagtegaal and colleagues replicated two anchoring experiments with 1,221 public managers and employees and found the prompt helped, though the size of the benefit seemed to depend on context and they called for field tests.
