topic: Actively open-minded thinking
topic_type: Disposition
true_statement: A director says she is always happy to hear objections to her rollout plan, but she never looks for evidence against it unless someone brings it to her. By Baron's standard, she falls short of actively open-minded thinking.
false_statement: A director says she is always happy to hear objections to her rollout plan, but she never looks for evidence against it unless someone brings it to her. By Baron's standard, she meets the bar for actively open-minded thinking.
explanation: 'The word "actively" is the point: being willing to listen isn''t enough. AOT means going out to search for alternatives and for reasons you might be wrong, in proportion to how much the question matters.'
