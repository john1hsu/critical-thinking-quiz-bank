true_statement: In Haran and colleagues' 2013 experiments, higher-AOT people were more accurate mainly because they chose to gather more information; with the amount of information fixed, AOT no longer predicted performance.
false_statement: In Haran and colleagues' 2013 experiments, higher-AOT people were more accurate mainly because they weighed the same information more skilfully; with the amount of information fixed, AOT still predicted performance.
explanation: 'The benefit ran through search: open-minded people looked longer before estimating, which improved accuracy and calibration. The practical cue is to treat the urge to stop early as a prompt to look once more.'
