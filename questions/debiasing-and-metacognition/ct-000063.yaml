topic: Actively open-minded thinking
topic_type: Disposition
true_statement: Scores on actively open-minded thinking scales do not reliably predict myside bias, which Stanovich and Toplak call a paradox for the construct.
false_statement: Scores on actively open-minded thinking scales reliably predict lower myside bias, which Stanovich and Toplak count as the construct's strongest validation.
explanation: You might expect open-minded people to judge evidence more evenly across sides, but the scales don't track that. Together with mostly correlational data, this is why AOT's evidence is rated mixed.
