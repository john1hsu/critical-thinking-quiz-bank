kind: scenario
topic: Debiasing training games
topic_type: Technique
true_statement: An HR lead declares a bias-training video a success because staff aced a quiz on bias definitions straight afterwards. That is weak evidence the training reduced biased judgments.
false_statement: An HR lead declares a bias-training video a success because staff aced a quiz on bias definitions straight afterwards. That is strong evidence the training reduced biased judgments.
explanation: Knowing definitions and judging less biasedly are different outcomes. In the 2015 experiments the video taught definitions better than the game yet reduced bias less, so the test should use fresh judgment items and a delayed recheck.
