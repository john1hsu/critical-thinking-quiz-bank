true_statement: Because transfer to real decisions is the weakest link in debiasing training, games are best paired with procedures such as requiring disconfirming evidence in written analyses.
false_statement: Because transfer to real decisions is the strongest link in debiasing training, games can replace procedures such as requiring disconfirming evidence in written analyses.
explanation: A 2021 review found good retention but far transfer tested only once, so real-life improvement isn't yet shown. Building the check into the process doesn't depend on what people remember from training.
