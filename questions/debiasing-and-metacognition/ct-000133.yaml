topic: Deliberate reflection
topic_type: Technique
true_statement: An outage looks just like last month's, so an engineer's first thought is the same bad deploy. She lists the findings that fit and don't fit, then assumes she's wrong and tests two other causes the same way. That is deliberate reflection.
false_statement: An outage looks just like last month's, so an engineer's first thought is the same bad deploy. She lists the findings that fit and don't fit, then assumes she's wrong and tests two other causes the same way. That is a premortem.
explanation: Deliberate reflection checks a first impression already formed about something that has happened, weighing alternatives against the same evidence. A premortem imagines a future plan has failed and asks why, before committing to it.
