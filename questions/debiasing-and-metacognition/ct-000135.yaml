true_statement: In a 2019 dermatology study, a brief deliberate-reflection task raised students' diagnostic accuracy but did not improve their calibration, so they stayed overconfident.
false_statement: In a 2019 dermatology study, a brief deliberate-reflection task improved students' calibration so they were no longer overconfident, but did not raise their diagnostic accuracy.
explanation: Reflection fixed more answers without bringing confidence into line with accuracy. Getting more right and knowing how sure to be are separate outcomes, and the technique helped only the first.
