true_statement: A hiring panel keeps favouring candidates who resemble its first strong interviewee, so the chair has everyone score each candidate on the same questions before any discussion and averages the scores. That fix changes the task, not the people.
false_statement: A hiring panel keeps favouring candidates who resemble its first strong interviewee, so the chair has everyone score each candidate on the same questions before any discussion and averages the scores. That fix changes the people, not the task.
explanation: Structured scoring and averaging independent ratings redesign the environment, so they work without anyone noticing their own bias. Training the panel about confirmation bias would be the person-side fix.
