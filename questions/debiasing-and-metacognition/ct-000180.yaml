true_statement: If a team's forecasting errors come from missing statistical knowledge rather than low effort, paying bonuses for accuracy is unlikely to fix them.
false_statement: If a team's forecasting errors come from missing statistical knowledge rather than low effort, paying bonuses for accuracy is the most direct fix.
explanation: 'Incentives help with errors caused by too little effort, but they can make people think harder without thinking better. Diagnose the cause first: missing knowledge calls for training or a better procedure.'
