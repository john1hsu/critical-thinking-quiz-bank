true_statement: A 2025 meta-analysis of 41 randomised trials of educational debiasing found a small average benefit over controls, with Hedges' g of about 0.26.
false_statement: A 2025 meta-analysis of 41 randomised trials of educational debiasing found a large average benefit over controls, with Hedges' g of about 0.86.
explanation: The pooled effect was small, every included study was rated at unclear or high risk of bias, and lasting transfer to real decisions wasn't shown. The false version inflates the effect more than threefold.
