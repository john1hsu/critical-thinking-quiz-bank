topic: Taking the outside view
topic_type: Technique
true_statement: Before committing to a three-month estimate for a software migration, a manager looks up how long the organisation's last ten migrations took and starts from that figure. That is taking the outside view.
false_statement: Before committing to a three-month estimate for a software migration, a manager looks up how long the organisation's last ten migrations took and starts from that figure. That is taking the inside view.
explanation: Starting from how a class of similar cases turned out, before the plan's own details, is the outside view. The inside view builds the forecast from this project's steps and scenarios, which tends to yield bold, optimistic estimates.
