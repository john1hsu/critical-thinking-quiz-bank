topic: Taking the outside view
topic_type: Technique
true_statement: An editor expects a book to sell 12,000 copies, similar books average 4,000, and her impressions have predictability of about 0.6. The outside-view correction gives a forecast of about 8,800 copies.
false_statement: An editor expects a book to sell 12,000 copies, similar books average 4,000, and her impressions have predictability of about 0.6. The outside-view correction gives a forecast of about 7,200 copies.
explanation: 'Start at the class average and move toward the case estimate in proportion to predictability: 4,000 + 0.6 × 8,000 = 8,800. The false figure moves only 0.4 of the way, as if predictability were weighted the wrong way round.'
