true_statement: In geopolitical forecasting tournaments, citing comparison classes was the reasoning habit most strongly tied to better scores, though that particular link was only correlational.
false_statement: In geopolitical forecasting tournaments, citing comparison classes was the reasoning habit most strongly tied to better scores, a causal link established by randomly assigning the habit.
explanation: The short training module on base rates was tested in randomised comparisons, but the link between citing comparison classes and accuracy came from observing forecasters. Keep the two claims apart when weighing the evidence.
