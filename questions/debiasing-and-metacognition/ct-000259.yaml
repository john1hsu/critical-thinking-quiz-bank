id: ct-000259
area: debiasing-and-metacognition
kind: counter
topic: Logical necessity instructions
topic_type: Technique
true_statement: When auditing a report's reasoning, record whether you agree with each conclusion in a separate column from whether it must follow from the premises, so your view of its truth doesn't leak into the validity call.
false_statement: When auditing a report's reasoning, first record whether you agree with each conclusion, then count an argument as valid only if you do, so the validity call rests on conclusions you trust.
explanation: Validity asks only whether the premises guarantee the conclusion, and a valid argument can have a false conclusion. Making agreement a condition of validity is exactly the belief bias the technique is meant to block.
