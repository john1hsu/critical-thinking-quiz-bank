id: ct-000300
area: debiasing-and-metacognition
kind: scenario
topic: Statistical reasoning training
topic_type: Technique
true_statement: A sales manager sees a new hire's first-week sales beat the team average and, recalling that one week is a small sample, expects next week to fall back toward average. That is the sample-size reasoning statistical training aims to instil.
false_statement: A sales manager sees a new hire's first-week sales beat the team average and, recalling that one week is a small sample, expects next week to fall back toward average. That is the representativeness heuristic at work.
explanation: Discounting a result because the sample is small is the law of large numbers, the rule Fong, Krantz and Nisbett trained. The representativeness heuristic would do the opposite, reading the one strong week as a faithful picture of the hire's ability.
