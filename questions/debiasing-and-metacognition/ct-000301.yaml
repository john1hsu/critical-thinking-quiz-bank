id: ct-000301
area: debiasing-and-metacognition
kind: counter
topic: Statistical reasoning training
topic_type: Technique
true_statement: After teaching a team the conjunction rule, add a prompt at the point of decision, such as "is one option a subset of the other?", because trainees apply the rule far more often when told to.
false_statement: After teaching a team the conjunction rule, a prompt at the point of decision, such as "is one option a subset of the other?", adds little, because trainees apply the rule about as often unprompted.
explanation: 'Training effects depend heavily on prompts: in a 2022 replication, error rates were clearly lower when people were told to apply what they had learned than when they were not. Unprompted transfer happens, but it is smaller, so a checklist or reminder does real work.'
