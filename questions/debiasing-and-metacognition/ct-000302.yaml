true_statement: Fisk and Pidgeon (1997) found extension-rule training cut conjunction errors, yet judgments still tracked the less likely component event, suggesting training shifts a compromise rather than replacing the heuristic.
false_statement: Fisk and Pidgeon (1997) found extension-rule training cut conjunction errors by replacing the similarity heuristic outright, so judgments no longer tracked the less likely component event.
explanation: The trained rule competes with the intuitive one instead of overwriting it, which is why errors fall but rarely vanish. That residual pull is part of why the technique's evidence is rated mixed.
