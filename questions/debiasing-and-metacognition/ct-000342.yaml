topic: Correcting erroneous perceptions of randomness
topic_type: Technique
true_statement: Before each bid decision, a sales team writes down its reasoning, then combs the notes for words like "due" and "our system" and checks each claim. That is the thought-catching core of correcting erroneous perceptions of randomness.
false_statement: Before each bid decision, a sales team writes down its reasoning, then combs the notes for words like "due" and "our system" and checks each claim. That is statistical reasoning training.
explanation: The deciding feature is that the team catches and checks its own faulty thoughts as it decides, which is what the Laval correction technique does. Statistical reasoning training teaches abstract rules with worked examples in advance; it does not target specific thoughts during the decision.
