true_statement: Halfway through a long report, an analyst realises she can't restate its main argument in her own words, so she goes back and rereads the methods section. In Nelson and Narens's terms, the realising is monitoring and the rereading is control.
false_statement: Halfway through a long report, an analyst realises she can't restate its main argument in her own words, so she goes back and rereads the methods section. In Nelson and Narens's terms, the realising is control and the rereading is monitoring.
explanation: Monitoring is information flowing up from the thinking to the meta level, such as noticing you don't understand. Control flows down as a change in what you do, such as rereading or stopping. The false version reverses the two directions.
