true_statement: To judge how good a colleague's metacognition is, check whether her confidence separates her right calls from her wrong ones, not how confident she is overall.
false_statement: To judge how good a colleague's metacognition is, check how confident she is overall, not whether her confidence separates her right calls from her wrong ones.
explanation: Overall confidence is metacognitive bias; metacognitive skill is sensitivity, how well confidence tracks being right. A person can be modest and poorly tuned, or bold and well tuned, so average confidence alone says little.
