topic: Metacognition
topic_type: Concept
true_statement: John Flavell framed metacognition as a research field in 1979, drawing on studies where young children who said they had memorized a list often could not recall it.
false_statement: Thomas Nelson framed metacognition as a research field in 1979, drawing on studies where young children who said they had memorized a list often could not recall it.
explanation: Flavell, a developmental psychologist, coined the field from his work with children who misjudged their own memory and understanding. Nelson and Narens came later, in 1990, with the object-level and meta-level framework.
