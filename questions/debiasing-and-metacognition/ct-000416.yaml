id: ct-000416
area: debiasing-and-metacognition
kind: counter
topic: Numeracy
topic_type: Disposition
true_statement: When presenting risk figures to a mixed audience, cut nonessential numbers and make higher numbers stand for better outcomes, which helps less numerate readers.
false_statement: When presenting risk figures to a mixed audience, include every available number so nothing is hidden, which helps less numerate readers most.
explanation: Studies of risk communication found that low-numerate readers did better when figures were trimmed to what matters, ordered by relevance and aligned so bigger means better. Extra numbers add load without adding understanding for them.
