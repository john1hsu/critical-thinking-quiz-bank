true_statement: In a 2020 study of the affect heuristic, numeracy's link with weaker risk-benefit coupling vanished after controlling for abstract reasoning, while cognitive reflection remained a predictor.
false_statement: In a 2020 study of the affect heuristic, cognitive reflection's link with weaker risk-benefit coupling vanished after controlling for abstract reasoning, while numeracy remained a predictor.
explanation: The result suggests numeracy may be standing in for general reasoning ability rather than causing the effect itself. Along with mostly correlational evidence, that is why claims that numeracy debiases are rated mixed.
