topic: Cost-benefit reasoning training
topic_type: Technique
true_statement: 'Asked what an economist would advise about a non-refundable workshop that has turned out useless, a trainee says, "Waste not, want not: attend, or the fee is wasted." That is a common lay theory, not the economist''s rule.'
false_statement: 'Asked what an economist would advise about a non-refundable workshop that has turned out useless, a trainee says, "Waste not, want not: attend, or the fee is wasted." That is the sunk cost principle economists endorse.'
explanation: The fee is gone whichever way the trainee chooses, so the sunk cost principle says to ignore it and judge the day on its remaining value. Untrained students mostly believed economists would back "waste not, want not", and correcting that belief is part of the training.
