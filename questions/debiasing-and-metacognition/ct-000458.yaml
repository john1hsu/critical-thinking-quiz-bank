id: ct-000458
area: debiasing-and-metacognition
kind: counter
topic: Cost-benefit reasoning training
topic_type: Technique
true_statement: When training staff to ignore sunk costs, mix in cases where continuing is the right call, so they don't come away with a blanket "always quit" rule.
false_statement: When training staff to ignore sunk costs, use only cases where quitting is the right call, so they don't come away with a blanket "always quit" rule.
explanation: Pairing sunk cost problems with extra cost problems, where continuing is correct, forces learners to weigh what each option still costs and returns. A diet of quit-only examples teaches exactly the blanket rule it aims to avoid.
