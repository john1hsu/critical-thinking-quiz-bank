topic: Cost-benefit reasoning training
topic_type: Technique
true_statement: In Larrick, Morgan and Nisbett's 1990 training study, students taught the sunk cost rule only with money examples applied it fully to problems about time and effort too.
false_statement: In Larrick, Morgan and Nisbett's 1990 training study, students taught the sunk cost rule only with money examples applied it to money problems but not to problems about time and effort.
explanation: Both the financial-only and the non-financial-only training groups beat controls on every kind of problem, showing domain-general transfer. That transfer is what makes abstract rule training promising, unlike generic economics coursework.
