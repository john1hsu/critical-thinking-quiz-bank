true_statement: A team lead objects to making the weekly status meeting fortnightly, and also objects to making it twice weekly, but can't say why weekly is best beyond habit. By the reversal test, her original objection deserves less weight.
false_statement: A team lead objects to making the weekly status meeting fortnightly, and also objects to making it twice weekly, but can't say why weekly is best beyond habit. By the reversal test, her original objection deserves more weight.
explanation: Rejecting change in both directions implies the current value is a rare optimum, which needs a reason. With only habit behind it, the double rejection points to status quo bias rather than confirming that weekly is ideal.
