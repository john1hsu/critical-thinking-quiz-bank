id: ct-000503
area: debiasing-and-metacognition
kind: counter
topic: Reversal test
topic_type: Technique
true_statement: If you reject a change in both directions, real transition costs of switching are a legitimate reason the current value may be best, and can meet the reversal test's burden.
false_statement: If you reject a change in both directions, the fact that it's how things have always been done is a legitimate reason the current value may be best, and can meet the reversal test's burden.
explanation: Bostrom and Ord accept grounds such as transition costs, long adaptation to stable conditions, or risks of change. "We've always done it this way" is exactly the habit the test is built to expose, not a reason that answers it.
