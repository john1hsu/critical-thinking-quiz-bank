topic: Reversal test
topic_type: Technique
true_statement: Nebel argued in 2015 that preferring the status quo can be rational, because there is reason to preserve existing things of value even when replacements would be just as good.
false_statement: Nebel argued in 2015 that preferring the status quo is never rational, because there is no reason to preserve existing things of value when replacements would be just as good.
explanation: On Nebel's view a person can reject change in both directions without being biased, which limits what the reversal test shows. He still treats the test as a fallible guide, part of why its status is contested.
