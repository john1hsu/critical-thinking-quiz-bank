area: debiasing-and-metacognition
kind: scenario
topic: Source-monitoring framework
topic_type: Framework
true_statement: A day after skimming a vendor's list of made-up sample consultant names, a manager rates one of them a well-known industry expert, because the name feels familiar. Familiarity whose source has faded being taken for fame is the false fame effect.
false_statement: A day after skimming a vendor's list of made-up sample consultant names, a manager rates one of them a well-known industry expert, because the name feels familiar. Familiarity whose source has faded being taken for fame is the illusory truth effect.
explanation: The judgment is about whether a name is famous, and it rests on familiarity whose real origin, yesterday's list, has slipped away. The illusory truth effect is the neighbouring error of rating repeated statements as more likely true.
