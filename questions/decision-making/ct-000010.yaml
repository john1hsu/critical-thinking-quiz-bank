topic: Judgment and decision making
topic_type: Field
true_statement: A consultant designs simple rules of thumb to help busy managers come closer to what expected utility theory would recommend. In JDM terms, those rules are a prescriptive model.
false_statement: A consultant designs simple rules of thumb to help busy managers come closer to what expected utility theory would recommend. In JDM terms, those rules are a descriptive model.
explanation: JDM separates normative models (the standard), descriptive models (what people actually do) and prescriptive models (practical designs that help real people get closer to the standard). Tools built to improve decisions are prescriptive.
