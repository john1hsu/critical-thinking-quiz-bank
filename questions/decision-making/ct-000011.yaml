true_statement: Ward Edwards's 1954 Psychological Bulletin review, "The theory of decision making", is widely treated as the founding text of judgment and decision making.
false_statement: Daniel Kahneman's 1954 Psychological Bulletin review, "The theory of decision making", is widely treated as the founding text of judgment and decision making.
explanation: Edwards introduced psychologists to the economic theory of choice in 1954 and later named 'behavioral decision theory'. Kahneman was among those who took up Edwards's Bayesian paradigm afterwards.
