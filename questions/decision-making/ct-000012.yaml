true_statement: Einhorn and Hogarth warned that an apparent bias may reflect the wrong normative benchmark rather than a flawed mind, since rival normative systems exist.
false_statement: Einhorn and Hogarth argued that because only one normative system exists, any departure from it reveals a flawed mind rather than the wrong benchmark.
explanation: Optimal models depend on assumptions about the environment and time horizon, and more than one normative system is available. So before calling a choice biased, check that the benchmark fits the situation.
