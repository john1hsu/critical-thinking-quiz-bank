true_statement: Before signing off on a warehouse move, a manager tells the team, "It's a year from now and the move was a disaster. Each of you write down why." She is running a premortem.
false_statement: Before signing off on a warehouse move, a manager tells the team, "It's a year from now and the move was a disaster. Each of you write down why." She is running a postmortem.
explanation: 'The tell is timing plus certainty: the failure is declared as having happened while the plan can still change. A postmortem analyses a failure that really occurred, after the fact.'
