area: decision-making
kind: counter
topic: Premortem
topic_type: Technique
true_statement: In a premortem, having each person list failure reasons alone before any discussion protects minority views from being swamped by the group.
false_statement: In a premortem, having the group call out failure reasons together before anyone writes alone protects minority views from being swamped.
explanation: Independent writing comes first so that quieter or dissenting members commit their concerns before the room converges. Open discussion first invites the conformity the technique is meant to counter.
