topic: Devil's advocacy
topic_type: Technique
true_statement: To test a plan to outsource payroll, a CFO has one subgroup draft a full rival plan built on opposite assumptions and then stages a debate between the two plans. That is dialectical inquiry.
false_statement: To test a plan to outsource payroll, a CFO has one subgroup draft a full rival plan built on opposite assumptions and then stages a debate between the two plans. That is devil's advocacy.
explanation: The tell is a complete counter-plan from opposite assumptions. Devil's advocacy instead critiques the existing plan's assumptions and evidence without necessarily building a developed alternative.
