true_statement: When a team does have a member who sincerely doubts the plan, Nemeth's research suggests protecting that real dissenter rather than relying on an assigned devil's advocate.
false_statement: When a team does have a member who sincerely doubts the plan, Nemeth's research suggests relying on an assigned devil's advocate rather than that real dissenter.
explanation: Groups discount a role-played objection because they know it lacks conviction, so it prompts less rethinking. Assigned advocacy is the substitute for when no genuine dissent exists.
