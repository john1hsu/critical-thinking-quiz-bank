true_statement: Before a board meeting, the chief of staff quietly keeps a critical consultant's report off the agenda so the CEO's plan isn't "distracted." In Janis's groupthink model, she is acting as a mindguard.
false_statement: Before a board meeting, the chief of staff quietly keeps a critical consultant's report off the agenda so the CEO's plan isn't "distracted." In Janis's groupthink model, she is showing the illusion of invulnerability.
explanation: A mindguard screens unwelcome information out of the group, one of Janis's pressure-toward-uniformity symptoms. The illusion of invulnerability is the group overrating itself, an excess optimism rather than an act of filtering.
