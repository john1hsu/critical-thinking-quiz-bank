area: decision-making
kind: scenario
topic: Key assumptions check
topic_type: Technique
true_statement: Before approving a hiring plan, a team writes out its conclusion, lists every premise it rests on (budget holds, attrition stays low, the market stays tight), challenges each, and notes signs that would show one has failed. That is a key assumptions check.
false_statement: Before approving a hiring plan, a team writes out its conclusion, lists every premise it rests on (budget holds, attrition stays low, the market stays tight), challenges each, and notes signs that would show one has failed. That is a premortem.
explanation: The tell is the list of premises tested one by one, ending with warning signs to watch. A premortem instead imagines the plan has already failed and asks people to explain why.
