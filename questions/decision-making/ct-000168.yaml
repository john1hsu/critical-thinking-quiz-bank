id: ct-000168
area: decision-making
kind: counter
topic: Key assumptions check
topic_type: Technique
true_statement: A key assumptions check run only by the people who own the conclusion can simply re-endorse it, so it works better paired with challenge from outside the team.
false_statement: A key assumptions check run only by the people who own the conclusion is the most reliable form, since owners know the premises best and outside challenge adds little.
explanation: Mind-sets absorb new information instead of being revised, and owners are the least likely to see their own hidden premises. Heuer pairs explicit assumptions with outside challenge for that reason.
