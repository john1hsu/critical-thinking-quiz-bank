true_statement: When briefing a manager on whether a supplier will miss deliveries, give a probability such as "about 30%" rather than a word like "possible", since verbal phrases convey uncertainty poorly.
false_statement: When briefing a manager on whether a supplier will miss deliveries, use a word like "possible" rather than a probability such as "about 30%", since verbal phrases convey uncertainty more reliably.
explanation: Listeners read words like "possible" or "likely" very differently, so the same phrase can mean 10% to one person and 60% to another. A number, or at least a sharp verbal standard, makes the judgment checkable.
