true_statement: A 2014 study scoring years of strategic forecasts by a Canadian government assessment unit found the analysts' main error was underconfidence, especially on harder questions.
false_statement: A 2014 study scoring years of strategic forecasts by a Canadian government assessment unit found the analysts' main error was overconfidence, especially on harder questions.
explanation: Discrimination and calibration were both good, and the forecasts were if anything too cautious, so recalibrating them to be more extreme improved accuracy. The false version assumes the more familiar overconfidence pattern.
