true_statement: Richards Heuer argued in 1999 that many analytic failures come from the mind's built-in limits rather than from a lack of information.
false_statement: Sherman Kent argued in 1999 that many analytic failures come from the mind's built-in limits rather than from a lack of information.
explanation: Heuer's Psychology of Intelligence Analysis brought cognitive psychology into analytic training. Kent, the earlier founding figure, fought bureaucratic and ideological bias but wrote little about cognitive limits.
