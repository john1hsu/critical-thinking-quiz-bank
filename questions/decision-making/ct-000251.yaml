topic: Reversible and irreversible decisions
topic_type: Concept
true_statement: In Gilbert and Ebert's 2002 studies, students who could not exchange a photograph they had chosen came to like it more than students who could, though forecasters predicted no difference.
false_statement: In Gilbert and Ebert's 2002 studies, students who could exchange a photograph they had chosen came to like it more than students who could not, just as forecasters predicted.
explanation: Keeping a choice open tended to lower satisfaction, the opposite of what people expect, which is why the finding is framed as an affective forecasting error. The samples were small and low-stakes, so the effect is rated mixed rather than robust.
