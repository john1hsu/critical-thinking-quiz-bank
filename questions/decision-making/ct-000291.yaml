true_statement: Before drafting a five-year plan, a strategy team sketches several different ways its market could look by the end of the period, to widen the options it considers. In the Tradecraft Primer's grouping, that is an imaginative technique.
false_statement: Before drafting a five-year plan, a strategy team sketches several different ways its market could look by the end of the period, to widen the options it considers. In the Tradecraft Primer's grouping, that is a contrarian technique.
explanation: Alternative futures analysis widens the space of possibilities, which is what the imaginative group is for. Contrarian techniques such as devil's advocacy or Team A/Team B instead attack a prevailing view, and here no single view is being challenged.
