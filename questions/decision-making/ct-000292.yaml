true_statement: Mandel and Tetlock advise pairing structured techniques with tracking how accurate the resulting judgments turn out, since warnings against overconfidence alone can tip analysts into underconfidence.
false_statement: Mandel and Tetlock advise pairing structured techniques with repeated warnings against overconfidence, since those warnings alone reliably bring analysts' confidence into line with their accuracy.
explanation: Structure on paper does not show that judgments got better; only scoring them against outcomes, plus corrections such as recalibration and averaging, does. The false version recommends the very warning the critics say can overshoot into underconfidence.
