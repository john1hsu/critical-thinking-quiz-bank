area: decision-making
kind: scenario
topic: Analysis of competing hypotheses
topic_type: Technique
true_statement: 'A finance team weighs three explanations for falling margins: supplier price rises, a mispriced discount, and a currency swing. "Quarterly costs beat budget" fits all three. In an ACH matrix that item carries little weight, because it doesn''t discriminate between them.'
false_statement: 'A finance team weighs three explanations for falling margins: supplier price rises, a mispriced discount, and a currency swing. "Quarterly costs beat budget" fits all three. In an ACH matrix that item carries heavy weight, because it is consistent with every hypothesis.'
explanation: 'Heuer''s key idea is diagnosticity: evidence consistent with every hypothesis, like a fever that fits many illnesses, cannot tell you which is true. Being consistent with everything is exactly what makes an item useless for choosing, not strong.'
