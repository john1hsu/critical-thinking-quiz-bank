true_statement: A 2004 MITRE experiment found ACH reduced confirmation bias only among participants without professional analysis experience, and it did not reduce anchoring on initial beliefs.
false_statement: A 2004 MITRE experiment found ACH reduced confirmation bias only among experienced professional analysts, and it did not reduce anchoring on initial beliefs.
explanation: The benefit appeared only for the non-professionals, which led the authors to call ACH not yet a robust debiasing method. That limited, uneven result is part of why ACH's evidence status is contested.
