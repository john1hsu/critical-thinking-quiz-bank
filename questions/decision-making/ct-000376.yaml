true_statement: Choosing project-tracking software, a team lead first asks the team what the tool must achieve, such as fewer missed hand-offs, then uses those aims to invent options and score every one. That is value-focused thinking.
false_statement: Choosing project-tracking software, a team lead first asks the team what the tool must achieve, such as fewer missed hand-offs, then uses those aims to invent options and score every one. That is alternative-focused thinking.
explanation: 'The order gives it away: objectives come first and drive both the search and the scoring. Alternative-focused thinking starts from the options already on the table and only then asks what should separate them.'
