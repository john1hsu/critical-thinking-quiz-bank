true_statement: In value-focused thinking, means objectives are best used to prompt new options, while fundamental objectives serve as the criteria for scoring them.
false_statement: In value-focused thinking, fundamental objectives are best used to prompt new options, while means objectives serve as the criteria for scoring them.
explanation: Means objectives matter only because they serve deeper ends, so each one hints at a way to do better and sparks alternatives. Scoring should rest on the fundamental ends themselves; ask "why does this matter?" to tell the two apart.
