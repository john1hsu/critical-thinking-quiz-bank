true_statement: Tired of arguing case by case over which client dinners are "reasonable", a firm announces a fixed cap of $60 per person. It has replaced a standard with a bright-line rule.
false_statement: Tired of arguing case by case over which client dinners are "reasonable", a firm announces a fixed cap of $60 per person. It has replaced a bright-line rule with a standard.
explanation: '"Reasonable" is an open standard that gets its content only when someone judges each claim; a dollar cap fixed in advance is a sharp, easily checked criterion. The false version reverses which one the firm started with.'
