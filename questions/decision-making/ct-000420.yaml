true_statement: In Kaplow's economic analysis, rules cost more to write but less to apply, while standards are cheap to write but costly to interpret and adjudicate case by case.
false_statement: In Kaplow's economic analysis, standards cost more to write but less to apply, while rules are cheap to write but costly to interpret and adjudicate case by case.
explanation: 'Kaplow framed the choice as a matter of timing: a rule front-loads the work of deciding, so each later case is quick to settle, while a standard defers that work to each case. Frequent, similar cases therefore favour rules.'
