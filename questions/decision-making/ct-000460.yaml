true_statement: A planner argues that switching the retirement plan from opt-in to automatic enrollment, with the same terms, can't change much, since anyone who values the plan will join anyway. Automatic-enrollment field evidence shows this reasoning fails.
false_statement: A planner argues that switching the retirement plan from opt-in to automatic enrollment, with the same terms, can't change much, since anyone who values the plan will join anyway. Automatic-enrollment field evidence shows this reasoning holds.
explanation: When a large employer made enrollment automatic without changing terms, participation rose substantially and new hires tended to keep the defaults, which the authors put down to inertia and reading the default as advice. The planner's model assumes attention and willpower people don't reliably have.
