true_statement: A 2016 project replicating 18 laboratory experiments from two top economics journals found a significant effect in the original direction for 11 of them, about 61%.
false_statement: A 2016 project replicating 18 laboratory experiments from two top economics journals found a significant effect in the original direction for 7 of them, about 39%.
explanation: Eleven of 18 replicated, with effects averaging about two-thirds of the originals' size, so the field's lab base held up better than many psychology findings. Smaller replicated effects are still a reminder that originals tend to be inflated.
