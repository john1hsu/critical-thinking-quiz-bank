true_statement: Maier and colleagues argued in 2022 that once publication bias is corrected for, the evidence for nudges in general is not convincing, though some individual nudges may still work.
false_statement: Maier and colleagues argued in 2022 that once publication bias is corrected for, the evidence for nudges in general grows stronger, though some individual nudges may still fail.
explanation: Correcting for publication bias removes the inflation from unpublished null results, and here it left the general case for nudging unconvincing. The policy branch of the field is therefore more disputed than its laboratory findings.
