id: ct-000499
area: decision-making
kind: scenario
topic: Expected utility theory
topic_type: Framework
true_statement: A $9,000 service contract covers a machine with a 10% chance of a $60,000 breakdown, an expected loss of $6,000. For a small firm where that hit would threaten payroll, buying the contract can still maximise expected utility.
false_statement: A $9,000 service contract covers a machine with a 10% chance of a $60,000 breakdown, an expected loss of $6,000. For a small firm where that hit would threaten payroll, expected utility theory says to skip it, since its price exceeds the expected loss.
explanation: Expected utility weighs what outcomes are worth to this chooser, not their cash value, and a payroll-threatening loss costs far more than six times the pain of a $9,000 bill. Skipping it is what a pure expected-money calculation says, as with Bernoulli's insured merchant.
