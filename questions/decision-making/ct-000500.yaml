topic: Expected utility theory
topic_type: Framework
true_statement: If your preference between two risky options flips when you change an outcome they both share, you are violating the independence axiom and should ask which of your judgments to trust.
false_statement: If your preference between two risky options flips when you change an outcome they both share, you are violating the transitivity axiom and should ask which of your judgments to trust.
explanation: Independence says that mixing options with a common outcome shouldn't reverse their ranking, which is what Allais-type flips break. Transitivity concerns chains of preference, such as preferring A to B and B to C but C to A.
