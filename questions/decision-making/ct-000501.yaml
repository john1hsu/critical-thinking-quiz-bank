topic: Expected utility theory
topic_type: Framework
true_statement: Starmer's 2000 review concluded that expected utility theory is likely to mislead as a description of choice in important contexts, though it fitted a substantial minority of individual subjects as well as any rival.
false_statement: Starmer's 2000 review concluded that expected utility theory is likely to mislead as a description of choice in important contexts, and that it fitted no individual subjects as well as its rivals did.
explanation: Starmer recommended rank-dependent models such as cumulative prospect theory as the descriptive default, yet some individuals were still best described by expected utility. The theory's descriptive record is poor overall but not uniformly so.
