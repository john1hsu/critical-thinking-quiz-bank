topic: Prospect theory
topic_type: Framework
true_statement: A project is $200,000 over budget; leaders can stop now or spend $150,000 on a fix with a 50% chance of recovering the overrun. While both options are judged against the original budget, prospect theory predicts they'll lean toward the gamble.
false_statement: A project is $200,000 over budget; leaders can stop now or spend $150,000 on a fix with a 50% chance of recovering the overrun. While both options are judged against the original budget, prospect theory predicts they'll lean toward stopping.
explanation: Measured from the original budget, both options are losses, and the value function's convexity for losses makes a gamble attractive. Reframed from today's position as a new coin-flip bet, most people turn cautious, though the numbers are identical.
