true_statement: A 2020 replication re-ran the original 1979 prospect theory problems with 4,098 people in 19 countries and found that 94% of the items replicated, though some effects were weaker.
false_statement: A 2020 replication re-ran the original 1979 prospect theory problems with 4,098 people in 19 countries and found that only 54% of the items replicated, with most effects much weaker.
explanation: The core choice patterns held up across languages and countries, which is strong support for the descriptive model. The weakening and the small samples behind the 1992 parameters still mean its exact numbers shouldn't be treated as constants.
