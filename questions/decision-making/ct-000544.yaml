true_statement: Gal and Rucker's 2018 review argued that the evidence does not show losses to be generally more impactful than equivalent gains, and called for a more contextual account of loss aversion.
false_statement: Gal and Rucker's 2018 review argued that the evidence shows losses to be generally about twice as impactful as equivalent gains, settling the case for loss aversion.
explanation: The review challenges prospect theory's most cited component, suggesting its popularity owes partly to the persistence of established beliefs. So the "losses loom twice as large" figure is contested, not settled.
