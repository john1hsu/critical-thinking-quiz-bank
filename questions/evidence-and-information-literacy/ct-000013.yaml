kind: scenario
topic: Lateral reading
topic_type: Technique
true_statement: Asked to vet a polished .org "policy institute" report, an analyst opens new tabs and searches who funds the institute before reading the report closely. That is lateral reading.
false_statement: Asked to vet a polished .org "policy institute" report, an analyst opens new tabs and searches who funds the institute before reading the report closely. That is vertical reading.
explanation: Lateral reading judges a source by leaving it and checking what independent sources say about who is behind it. Vertical reading stays on the page and judges it by its own design, citations and About section.
