area: evidence-and-information-literacy
kind: counter
topic: Lateral reading
topic_type: Technique
true_statement: A site's domain ending, logo, footnotes and About page are easy to fake, so they are weak evidence that an unfamiliar source is credible.
false_statement: A site's domain ending, logo, footnotes and About page are hard to fake, so they are strong evidence that an unfamiliar source is credible.
explanation: Checklists built only on a page's own features can give false security, because those features are cheap to imitate. What independent sources say about the publisher is far more informative.
