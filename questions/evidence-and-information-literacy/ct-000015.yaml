true_statement: In Wineburg and McGrew's study of live website evaluation, professional fact checkers judged sources more accurately than PhD historians and Stanford students.
false_statement: In Wineburg and McGrew's study of live website evaluation, PhD historians judged sources more accurately than professional fact checkers and Stanford students.
explanation: The fact checkers left unfamiliar pages quickly and searched about the source, while most historians and students read vertically. Two historians who did read laterally performed like the fact checkers, pointing to strategy rather than expertise.
