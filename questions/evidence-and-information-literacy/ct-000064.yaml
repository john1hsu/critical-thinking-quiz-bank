true_statement: Before a product recall is announced, a company sends staff a short video warning that misleading posts will follow and showing a silly fake example of a false either-or claim. That is prebunking.
false_statement: Before a product recall is announced, a company sends staff a short video warning that misleading posts will follow and showing a silly fake example of a false either-or claim. That is debunking.
explanation: 'The tell is timing and content: it comes before exposure and teaches the technique with a weakened example. Debunking is the after-the-fact counterpart, correcting a specific false claim people have already met.'
