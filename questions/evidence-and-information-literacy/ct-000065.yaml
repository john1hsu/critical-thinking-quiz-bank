kind: counter
topic: Prebunking
topic_type: Technique
true_statement: When testing whether a prebunk works, measure people's judgments of true items as well as false ones, since an intervention that just makes people say "fake" more can lower trust in true information.
false_statement: When testing whether a prebunk works, measuring people's judgments of false items alone is enough, since an intervention that makes people say "fake" more can only improve their accuracy.
explanation: Blanket scepticism can look like success if you only score false items. Checking true items too shows whether people got better at discernment or simply more suspicious of everything.
