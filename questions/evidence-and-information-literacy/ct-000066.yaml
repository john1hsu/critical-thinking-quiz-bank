true_statement: A 2023 reanalysis of inoculation-game experiments concluded the games mostly made players more sceptical of all news, rather than better at telling true from false.
false_statement: A 2023 reanalysis of inoculation-game experiments concluded the games mostly made players better at telling true from false, rather than more sceptical of all news.
explanation: Modirrousta-Galian and Higham used signal-detection (ROC) analysis and found a shift in response bias, not improved discernment. The critique targets games such as Bad News; the 2022 video studies did report better discernment.
