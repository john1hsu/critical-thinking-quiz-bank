true_statement: A staffer posts a colleague's genuine, private performance review on a team chat to embarrass her. In Wardle and Derakhshan's typology, that is malinformation.
false_statement: A staffer posts a colleague's genuine, private performance review on a team chat to embarrass her. In Wardle and Derakhshan's typology, that is disinformation.
explanation: The document is real, so it is not false information at all; what makes it harmful is the intent behind sharing it. Disinformation requires false content created or spread to deceive or harm.
