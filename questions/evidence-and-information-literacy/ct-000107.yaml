kind: counter
topic: Misinformation and disinformation
topic_type: Phenomenon
true_statement: When correcting an office rumour, lead with the accurate account and offer a plausible alternative explanation, since a bare retraction tends to leave the rumour still shaping people's reasoning.
false_statement: When correcting an office rumour, issue a bare retraction that simply says the rumour is false, since offering an alternative explanation tends to leave the rumour still shaping people's reasoning.
explanation: The continued influence effect means a retracted claim can keep steering reasoning, partly because the retraction leaves a gap in the story. Filling that gap with a credible account helps the correction stick.
