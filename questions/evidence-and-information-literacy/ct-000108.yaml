true_statement: Vosoughi, Roy and Aral (2018) found automated accounts spread true and false stories at similar rates, so false news outpaced true news mainly through human sharing.
false_statement: Vosoughi, Roy and Aral (2018) found automated accounts spread false stories far more than true ones, so false news outpaced true news mainly through bot activity.
explanation: Because bots amplified both kinds equally, the gap came from people, and false stories tended to be more novel. Altay and colleagues caution that such results depend on how misinformation is defined and sampled.
