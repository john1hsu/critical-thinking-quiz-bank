true_statement: A neighbour forwards a dramatic photo captioned as last night's storm damage downtown. Of the SIFT moves, the one this problem calls for most is tracing the image back to its original context.
false_statement: A neighbour forwards a dramatic photo captioned as last night's storm damage downtown. Of the SIFT moves, the one this problem calls for most is investigating the source's expertise and agenda.
explanation: The doubt is about a reused image, and a viral image mainly needs tracing to see where and when it first appeared. Investigating the source fits best when the problem is an unfamiliar website, not a picture that may have been lifted from elsewhere.
