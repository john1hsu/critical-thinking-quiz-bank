true_statement: If you feel eager to forward a post because it confirms what you already think, SIFT says to treat that pull as a cue to stop before reacting or sharing.
false_statement: If you feel eager to forward a post because it confirms what you already think, SIFT treats that agreement as a sign the post is sound enough to share without checking.
explanation: The Stop move asks you to pause before reading deeply or sharing, and a strong emotional pull is exactly the signal to slow down. Agreeing with a claim says nothing about whether its source or framing holds up.
