area: evidence-and-information-literacy
kind: scenario
topic: Primary and secondary sources
topic_type: Concept
true_statement: An analyst studying how trade newsletters covered remote work in 2020 cites a 2020 newsletter's summary of a productivity survey. For her question, the newsletter is a primary source.
false_statement: An analyst studying how trade newsletters covered remote work in 2020 cites a 2020 newsletter's summary of a productivity survey. For her question, the newsletter is a secondary source.
explanation: Primary or secondary is a relationship to the research question, not a fixed property of the document. The newsletter would be secondary for a question about productivity, but here the coverage itself is what she is studying.
