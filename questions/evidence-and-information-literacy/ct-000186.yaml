id: ct-000186
area: evidence-and-information-literacy
kind: counter
topic: Primary and secondary sources
topic_type: Concept
true_statement: When several articles agree on a statistic, check whether they all trace back to the same original report, since echoes of one source are not independent confirmation.
false_statement: When several articles agree on a statistic, count each as independent confirmation, even if they all trace back to the same original report.
explanation: Agreement only adds weight when the accounts are independent; copies of one study are worth only what that study is worth. Going upstream shows whether you have one source or many.
