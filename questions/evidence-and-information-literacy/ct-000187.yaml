true_statement: A 2009 BMJ study of one biomedical claim's citation network used "invention" for a hypothesis being cited until it was treated as fact.
false_statement: A 2009 BMJ study of one biomedical claim's citation network used "amplification" for a hypothesis being cited until it was treated as fact.
explanation: 'The study named three distortions: bias against refuting papers, amplification by papers with no data of their own, and invention, where a hypothesis hardened into fact. Checking the primary data would have revealed a weaker case.'
