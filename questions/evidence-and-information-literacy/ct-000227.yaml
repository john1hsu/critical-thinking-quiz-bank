topic: 'Information Disorder: Toward an Interdisciplinary Framework'
topic_type: Work
true_statement: Someone fabricates a memo announcing a regional office closure to stir up anger. A worried employee forwards it to colleagues in good faith. In Wardle and Derakhshan's framework, her forward is misinformation.
false_statement: Someone fabricates a memo announcing a regional office closure to stir up anger. A worried employee forwards it to colleagues in good faith. In Wardle and Derakhshan's framework, her forward is disinformation.
explanation: 'The memo is false either way, but intent decides the label at each phase: its creator meant harm (disinformation), while she shared it believing it true (misinformation). The same message can change category as different agents pass it on.'
