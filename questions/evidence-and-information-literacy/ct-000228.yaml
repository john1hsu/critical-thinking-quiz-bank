topic: 'Information Disorder: Toward an Interdisciplinary Framework'
topic_type: Work
true_statement: Before calling a misleading post "disinformation", ask what shows the sharer meant harm, since intent is hard to establish and the same story can shift categories as it is reshared.
false_statement: Before calling a misleading post "disinformation", check only whether its content is false, since falsity alone settles which category it belongs to.
explanation: In the framework, intent separates disinformation from misinformation, yet motives are hard to measure and irony lets creators deny them. Treat the labels as prompts for questions rather than verdicts.
