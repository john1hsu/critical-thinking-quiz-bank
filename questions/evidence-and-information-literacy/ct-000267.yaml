area: evidence-and-information-literacy
kind: counter
topic: Source credibility
topic_type: Concept
true_statement: 'When a vendor''s own engineer vouches for its product''s uptime, ask two separate questions: is she in a position to know, and does she have reasons to shade the truth? Her expertise answers only the first.'
false_statement: 'When a vendor''s own engineer vouches for its product''s uptime, ask two separate questions: is she in a position to know, and does she have reasons to shade the truth? Her expertise answers both.'
explanation: Credibility splits into expertise or access and trustworthiness or interests, and a source can score high on one and low on the other. A well-informed insider may still have a stake in how the numbers sound.
