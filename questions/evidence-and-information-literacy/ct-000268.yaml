true_statement: In Hovland and Weiss's 1951 experiment, crediting an article to a trusted source rather than an untrusted one shifted how far readers agreed with it, but barely changed how much of its content they learned.
false_statement: In Hovland and Weiss's 1951 experiment, crediting an article to a trusted source rather than an untrusted one barely shifted how far readers agreed with it, but changed how much of its content they learned.
explanation: Identical articles moved opinion far more under high-credibility attributions, while factual quiz scores were almost the same. That is why credibility should adjust confidence, not stand in for checking what a message actually says.
