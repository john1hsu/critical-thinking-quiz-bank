true_statement: Dual-process accounts treat source credibility as a shortcut that sways people most when they cannot or will not weigh the arguments themselves, such as audiences new to a topic.
false_statement: Dual-process accounts treat source credibility as a shortcut that sways people most when they are able and motivated to weigh the arguments themselves, such as audiences expert in a topic.
explanation: 'In the elaboration likelihood model, credibility is a peripheral cue, so it matters most when people lack the knowledge or motivation to judge the content. The meta-analytic pattern fits: the credibility edge was largest for audiences with no prior attitude and little knowledge.'
