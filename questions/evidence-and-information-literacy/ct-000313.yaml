id: ct-000313
area: evidence-and-information-literacy
kind: counter
topic: Suppressed evidence
topic_type: InformalFallacy
true_statement: A supplier comparison that leaves out each firm's logo colours and office address isn't cherry picking, since an omission counts only when the missing information bears on the conclusion.
false_statement: A supplier comparison that leaves out each firm's logo colours and office address is cherry picking, since leaving out any known information about the options counts.
explanation: The duty is to weigh evidence that is relevant and significant, not to list everything known. Before crying cherry picking, ask whether the omitted material would change the decision; logo colours would not.
