topic: Suppressed evidence
topic_type: InformalFallacy
true_statement: Dowden reserves "suppressed evidence" for deliberately leaving out relevant evidence, and calls the same error "incomplete evidence" or "cherry-picking" when the omission is inadvertent.
false_statement: Dowden reserves "suppressed evidence" for inadvertently leaving out relevant evidence, and calls the same error "incomplete evidence" or "cherry-picking" when the omission is deliberate.
explanation: 'In Dowden''s usage the word suppressed signals intent: the arguer knows the evidence and hides it. An honest oversight with the same effect gets the milder labels, so the false version swaps which name goes with which.'
