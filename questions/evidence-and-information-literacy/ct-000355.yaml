topic: Systematic review
topic_type: Method
true_statement: Two engineers each circulate blog posts backing their side on mandatory code review. Fixing the question, the sources to search and the inclusion criteria before gathering any studies is the systematic-review way to settle it.
false_statement: Two engineers each circulate blog posts backing their side on mandatory code review. Pooling both sets of posts and siding with whichever pile is larger is the systematic-review way to settle it.
explanation: Each pile was chosen by someone with a view, so merging and counting them just adds two biased selections. A systematic review removes the chooser's influence by setting the rules for what counts as evidence before looking, then appraising everything that qualifies.
