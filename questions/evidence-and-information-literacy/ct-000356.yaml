topic: Systematic review
topic_type: Method
true_statement: Even a thorough systematic review can inherit publication bias, so when reading one check whether it assessed the risk of bias from missing results.
false_statement: A thorough systematic search removes publication bias, so when reading a systematic review there is no need to check whether it assessed missing results.
explanation: A review can only find what was reported; if unfavourable studies were never published, the best search still misses them. That is why reporting guidelines ask reviewers to assess missing results, and why readers should look for that step.
