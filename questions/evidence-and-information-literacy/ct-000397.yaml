true_statement: A consultant recommends a software platform and is paid a referral fee by its vendor, though nothing suggests the fee swayed her. She still has a conflict of interest, because the term names a risky situation, not proven bias.
false_statement: A consultant recommends a software platform and is paid a referral fee by its vendor, though nothing suggests the fee swayed her. She has no conflict of interest, because the term applies only once bias has been shown.
explanation: 'On Thompson''s definition a conflict is a condition, not conduct: it exists whenever circumstances create a substantial risk of undue influence. Proven bias would be a separate, more serious problem; the conflict is a reason to check, not a verdict.'
