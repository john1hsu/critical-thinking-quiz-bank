true_statement: When an adviser discloses a conflict of interest, don't assume the disclosure makes her advice safe to use, since people tend to discount disclosed advice too little.
false_statement: When an adviser discloses a conflict of interest, you can assume the disclosure makes her advice safe to use, since people tend to discount disclosed advice more than enough.
explanation: In the coin-jar experiments, advisees adjusted for disclosed conflicts only partly, partly because they anchored on the number given, while advisers inflated their advice further. Disclosure is information to act on, not a fix.
