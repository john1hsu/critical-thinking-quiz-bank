true_statement: A 2017 Cochrane review found that industry-sponsored drug and device studies kept their excess of favourable results even among papers rated at low risk of bias.
false_statement: A 2017 Cochrane review found that industry-sponsored drug and device studies lost their excess of favourable results once only papers rated at low risk of bias were counted.
explanation: Standard quality checklists such as randomisation and allocation concealment did not account for the sponsorship effect. So a study passing those checks does not settle whether its funding shaped the result.
