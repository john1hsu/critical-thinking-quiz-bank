true_statement: Rushing through a vendor pitch the night before a budget deadline, a team lead approves it mainly because the deck shows a famous client's logo, without reading the pricing terms. In ELM terms she was persuaded by the peripheral route.
false_statement: Rushing through a vendor pitch the night before a budget deadline, a team lead approves it mainly because the deck shows a famous client's logo, without reading the pricing terms. In ELM terms she was persuaded by the central route.
explanation: The central route means weighing the merits of the arguments, which she skipped; a familiar logo is a simple cue, and time pressure lowered her ability to think it through. A useful check is whether you could restate the pitch's best argument or only name its messenger.
