kind: counter
topic: Deepfake
topic_type: Phenomenon
true_statement: When a video call that looks and sounds like a senior manager asks for an urgent payment, the robust check is to call the manager back on a known number, not to study the video for glitches.
false_statement: When a video call that looks and sounds like a senior manager asks for an urgent payment, the robust check is to study the video for glitches, not to call the manager back on a known number.
explanation: People are poor at spotting deepfake artefacts, so inspecting the media is unreliable. Verifying the instruction through an independent channel works however convincing the fake is, because it checks provenance rather than appearance.
