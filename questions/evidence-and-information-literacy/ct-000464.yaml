kind: scenario
topic: Deepfake
topic_type: Phenomenon
true_statement: A manager caught on a genuine recording promising a client a refund later waves it away as "probably a deepfake". Using public awareness of deepfakes to deny real evidence is the liar's dividend.
false_statement: A manager caught on a genuine recording promising a client a refund later waves it away as "probably a deepfake". Using public awareness of deepfakes to deny real evidence is the overconfidence effect.
explanation: The tell is a real recording being dismissed by pointing to the possibility of fakes, the reverse risk deepfakes create. The overconfidence effect is about viewers trusting their own detection skill more than their accuracy warrants.
