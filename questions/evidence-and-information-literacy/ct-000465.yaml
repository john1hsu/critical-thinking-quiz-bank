true_statement: In Köbis and colleagues' 2021 experiment, people sorted short videos into real and deepfake correctly only 57.6% of the time, and neither an awareness prompt nor a cash incentive improved that.
false_statement: In Köbis and colleagues' 2021 experiment, people sorted short videos into real and deepfake correctly only 57.6% of the time, but a cash incentive raised that to about 75%.
explanation: Accuracy was barely above chance and stayed there under both an awareness prompt and a financial incentive, while participants overrated their own skill. Trying harder to look closely is not a reliable defence.
