topic: Hierarchy of evidence
topic_type: Framework
true_statement: 'Treat a study design''s rank as a starting point: an observational study with a very large effect or a clear dose-response gradient can be rated up, and a badly run trial rated down.'
false_statement: 'Treat a study design''s rank as fixed: an observational study with a very large effect or a clear dose-response gradient still sits below any trial, however badly the trial was run.'
explanation: Design is only a rough stand-in for risk of bias. Approaches like GRADE adjust certainty for features such as effect size, dose-response, inconsistency and imprecision, rather than reading quality off the design label.
