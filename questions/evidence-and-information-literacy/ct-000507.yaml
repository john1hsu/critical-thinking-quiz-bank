true_statement: For a question about how common something is locally, the 2011 OCEBM Levels rank a current local survey first, whereas for a treatment's benefits a systematic review of randomised trials ranks first.
false_statement: For a question about how common something is locally, the 2011 OCEBM Levels rank a systematic review of randomised trials first, whereas for a treatment's benefits a current local survey ranks first.
explanation: The best design depends on the question being asked. A prevalence question needs up-to-date data from the population in question, while a question about effects needs randomisation to rule out confounding.
