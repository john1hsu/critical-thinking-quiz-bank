id: ct-000016
area: formal-fallacies
kind: scenario
topic: Affirming the consequent
topic_type: FormalFallacy
true_statement: 'A manager reasons: "If the campaign worked, sales would rise. Sales rose, so the campaign worked." This argument affirms the consequent, so it is invalid.'
false_statement: 'A manager reasons: "If the campaign worked, sales would rise. Sales rose, so the campaign worked." This argument is an instance of modus ponens, so it is valid.'
explanation: 'The second premise affirms the ''then'' part and the conclusion returns to the ''if'' part: If P then Q; Q; so P. Modus ponens affirms the antecedent instead. Other causes, such as a seasonal upswing, could have raised sales.'
