topic: Affirming the consequent
topic_type: FormalFallacy
true_statement: The key question to put to an argument that affirms the consequent is what else, besides the stated cause, could make the observed result true.
false_statement: The key question to put to an argument that affirms the consequent is whether the observed result really happened, since that settles the cause.
explanation: The conditional only says the cause is enough for the result, not that it's the only route to it. Even if the result is certain, rival causes stay open, so they must be named and compared.
