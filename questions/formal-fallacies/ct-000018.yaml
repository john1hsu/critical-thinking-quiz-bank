topic: Affirming the consequent
topic_type: FormalFallacy
true_statement: Godden and Zenker attribute much acceptance of affirming the consequent to conditional perfection, the tendency to hear "if" as "if and only if".
false_statement: Godden and Zenker attribute much acceptance of affirming the consequent to belief bias, the tendency to accept any argument whose conclusion seems believable.
explanation: Promises and threats invite reading a one-way conditional as two-way, and under that reading the inference would be valid. Their 2015 review links this pragmatic strengthening to how often people endorse the form.
