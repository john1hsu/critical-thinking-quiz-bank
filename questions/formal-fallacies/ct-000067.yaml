id: ct-000067
area: formal-fallacies
kind: scenario
topic: Illicit major
topic_type: FormalFallacy
true_statement: '"All certified auditors have read the data policy. No interns are certified auditors. So no interns have read the data policy." This syllogism commits the illicit major.'
false_statement: '"All certified auditors have read the data policy. No interns are certified auditors. So no interns have read the data policy." This syllogism commits the illicit minor.'
explanation: 'The overreach is in the conclusion''s predicate, "people who have read the policy": the negative conclusion covers that whole class, but the affirmative premise only placed auditors inside it. An illicit minor would overextend the conclusion''s subject, interns, instead.'
