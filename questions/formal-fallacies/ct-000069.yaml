id: ct-000069
area: formal-fallacies
kind: mechanism
topic: Illicit major
topic_type: FormalFallacy
true_statement: The illicit major usually arises with a negative conclusion and an affirmative major premise, because a negative statement distributes its predicate and an affirmative one does not.
false_statement: The illicit major usually arises with an affirmative conclusion and a negative major premise, because an affirmative statement distributes its predicate and a negative one does not.
explanation: A negative conclusion such as "No S are P" speaks of all of P, while an affirmative premise such as "All M are P" speaks of only some of P. That mismatch is the tell to check for first.
