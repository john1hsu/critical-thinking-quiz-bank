id: ct-000111
area: formal-fallacies
kind: definition
topic: Undistributed middle
topic_type: FormalFallacy
true_statement: Buridan's test for distribution says universal statements distribute their subjects and negative statements distribute their predicates, and no other terms are distributed.
false_statement: Buridan's test for distribution says universal statements distribute their predicates and negative statements distribute their subjects, and no other terms are distributed.
explanation: '"All M are P" speaks of every M, and "S are not M" excludes S from all of M. So the middle term is distributed only as the subject of a universal or the predicate of a negative; check each premise against that rule.'
