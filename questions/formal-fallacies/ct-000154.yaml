true_statement: In Quelhas and Johnson-Laird's 2017 experiments, 80% of conclusions drawn from "or" claims with incompatible options were exclusive, versus 32-44% when the options could both hold.
false_statement: In Quelhas and Johnson-Laird's 2017 experiments, 32-44% of conclusions drawn from "or" claims with incompatible options were exclusive, versus 80% when the options could both hold.
explanation: Background knowledge that two options can't coexist pushed people toward the exclusive "not B" reading; when content allowed both, they drew it far less. The false version reverses the direction of that content effect.
