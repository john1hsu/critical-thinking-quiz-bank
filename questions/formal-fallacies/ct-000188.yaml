id: ct-000188
area: formal-fallacies
kind: scenario
topic: Denying the antecedent
topic_type: FormalFallacy
true_statement: '"If the sprinklers in the warehouse go off, the fire alarm sounds. The sprinklers didn''t go off last night, so the alarm didn''t sound." This argument denies the antecedent and is invalid.'
false_statement: '"If the sprinklers in the warehouse go off, the fire alarm sounds. The sprinklers didn''t go off last night, so the alarm didn''t sound." This argument is a modus tollens and is valid.'
explanation: 'The second premise denies the if-clause, so the alarm could still have sounded for another reason, such as smoke. Modus tollens would deny the then-clause instead: the alarm didn''t sound, so the sprinklers didn''t go off.'
