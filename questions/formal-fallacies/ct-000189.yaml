id: ct-000189
area: formal-fallacies
kind: counter
topic: Denying the antecedent
topic_type: FormalFallacy
true_statement: If a speaker who denies the antecedent really means that P is necessary for Q, restate the premise as "if not P, then not Q"; the argument becomes valid but now rests on that stronger premise, which needs its own support.
false_statement: If a speaker who denies the antecedent really means that P is necessary for Q, restate the premise as "if not P, then not Q"; the argument becomes valid and needs no further support, since that premise was implied all along.
explanation: Making the hidden "only if" explicit fixes the form but moves the whole question onto that premise. Whether P really is the only route to Q is exactly what has to be shown.
