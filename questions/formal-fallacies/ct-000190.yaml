true_statement: A 2019 meta-analysis of 39 conditional-reasoning experiments found that 42% of participants accepted all four conditional inferences, denying the antecedent included.
false_statement: A 2019 meta-analysis of 39 conditional-reasoning experiments found that only 12% of participants accepted all four conditional inferences, denying the antecedent included.
explanation: Accepting all four was the single most common pattern, which fits reading "if" as "if and only if". The false figure makes that biconditional reading look rare.
