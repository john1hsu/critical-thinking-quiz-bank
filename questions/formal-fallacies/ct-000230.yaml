topic: Existential fallacy
topic_type: FormalFallacy
true_statement: '"All expense claims filed late this year will be audited, so some expense claims filed late this year will be audited." On the modern reading, this commits the existential fallacy, since there may be no late claims at all.'
false_statement: '"All expense claims filed late this year will be audited, so some expense claims filed late this year will be audited." On the modern reading, this is a valid subalternation, since a universal always implies its particular.'
explanation: A universal rule says what holds of any late claim, not that one exists; if none is filed late, the premise is true and the conclusion false. Subalternation was valid only under the traditional assumption that the subject class has members.
