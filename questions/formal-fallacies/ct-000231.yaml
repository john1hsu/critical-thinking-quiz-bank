id: ct-000231
area: formal-fallacies
kind: counter
topic: Existential fallacy
topic_type: FormalFallacy
true_statement: If you know at least one employee did beat quota, the repair for an argument that draws "some quota-beaters will be named" from two universal rules is to state that existence premise, which makes it valid.
false_statement: If you know at least one employee did beat quota, an argument that draws "some quota-beaters will be named" from two universal rules stays invalid even once that existence premise is stated.
explanation: The only gap is the unstated claim that the subject class has members, so the argument is better read as an enthymeme than a hopeless fallacy. When membership is uncertain, keep the conclusion universal or conditional instead.
