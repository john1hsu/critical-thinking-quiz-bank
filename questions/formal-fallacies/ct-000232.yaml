topic: Existential fallacy
topic_type: FormalFallacy
true_statement: By the late Middle Ages, logicians worked on the principle that affirmative categorical propositions carry existential import while negative ones do not.
false_statement: By the late Middle Ages, logicians worked on the principle that negative categorical propositions carry existential import while affirmative ones do not.
explanation: That medieval assumption is what made subalternation from "every S is P" to "some S is P" safe. The later Boolean reading dropped it, turning such inferences into the existential fallacy unless an existence premise is added.
