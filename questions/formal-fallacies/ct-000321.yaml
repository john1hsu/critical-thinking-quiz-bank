id: ct-000321
area: formal-fallacies
kind: scenario
topic: Exclusive premises
topic_type: FormalFallacy
true_statement: '"No laptops on the recall list were bought under the old contract. No finance-team laptops are on the recall list. So no finance-team laptops were bought under the old contract." Even if IT confirms the conclusion is true, the argument is invalid.'
false_statement: '"No laptops on the recall list were bought under the old contract. No finance-team laptops are on the recall list. So no finance-team laptops were bought under the old contract." Since IT confirms the conclusion is true, the argument is valid.'
explanation: 'Both premises are negative, so each only says what is shut out of the recall list, and nothing links finance laptops to the old contract. A true conclusion doesn''t make the form valid: both premises would stay true even if every finance laptop came from the old contract.'
