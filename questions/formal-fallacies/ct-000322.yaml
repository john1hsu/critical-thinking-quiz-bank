topic: Exclusive premises
topic_type: FormalFallacy
true_statement: Before charging an argument with exclusive premises, check that it is a categorical syllogism, since in other logical systems an argument with two negative premises can be valid.
false_statement: Before charging an argument with exclusive premises, check whether its conclusion is negative, since two negative premises with a negative conclusion make a valid syllogism.
explanation: 'The rule that one premise must be affirmative belongs to categorical logic, so two negative premises outside a syllogism aren''t automatically fallacious. Inside a syllogism a negative conclusion doesn''t help: any mood starting EE, EO, OE or OO is invalid.'
