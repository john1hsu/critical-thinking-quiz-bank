true_statement: In Khemlani and Johnson-Laird's 2012 meta-analysis, people correctly said that nothing follows from two negative premises only about half the time overall.
false_statement: In Khemlani and Johnson-Laird's 2012 meta-analysis, people correctly said that nothing follows from two negative premises about nine times in ten overall.
explanation: Pooling six experiments, the authors found the correct no-conclusion answer for double-negative pairs about half the time, with wide variation by term order; for some pairs an invalid negative conclusion was chosen about as often as the right answer.
