id: ct-000358
area: formal-fallacies
kind: scenario
topic: Fallacy of four terms
topic_type: FormalFallacy
true_statement: '"Tools that passed the security review are approved for production. The vendor''s plugins passed a security review. So they are approved." If the second review is only the vendor''s own check, the argument commits the fallacy of four terms.'
false_statement: '"Tools that passed the security review are approved for production. The vendor''s plugins passed a security review. So they are approved." If the second review is only the vendor''s own check, the argument commits the undistributed middle.'
explanation: The phrase "security review" names two different reviews, so there are two middle terms that never meet, which is four terms. The undistributed middle has a single middle term that fails to cover its whole class; here the problem is a shift in meaning.
