id: ct-000360
area: formal-fallacies
kind: definition
topic: Fallacy of four terms
topic_type: FormalFallacy
true_statement: When counting terms in a syllogism, two words with one meaning count as one term, and one word used in two senses counts as two.
false_statement: When counting terms in a syllogism, two words with one meaning count as two terms, and one word used in two senses counts as one.
explanation: A term is a meaning, not a word. That is why an argument can show only three words yet carry four terms, and why counting by wording lets the fallacy slip through.
