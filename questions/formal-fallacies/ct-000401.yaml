id: ct-000401
area: formal-fallacies
kind: counter
topic: Quantifier shift fallacy
topic_type: FormalFallacy
true_statement: To expose a quantifier shift, describe a case where each A gets its own B, so the premise holds while no single B serves every A.
false_statement: To expose a quantifier shift, describe a case where one single B serves every A, so the premise holds while the conclusion fails.
explanation: A counterexample needs a true premise with a false conclusion. If one B serves every A, the conclusion is true, so nothing is shown; giving each A a different B, like a different teacher for each class, is what breaks the inference.
