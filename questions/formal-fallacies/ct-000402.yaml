id: ct-000402
area: formal-fallacies
kind: mechanism
topic: Quantifier shift fallacy
topic_type: FormalFallacy
true_statement: Inferring "every x is related to some y" from "some single y is related to every x" is valid; only the step in the other direction is the quantifier shift fallacy.
false_statement: Inferring "some single y is related to every x" from "every x is related to some y" is valid; only the step in the other direction is the quantifier shift fallacy.
explanation: '"Someone loves everyone" guarantees that everyone is loved by someone, but not the reverse. Because one direction is valid and its mirror image is not, the slip is easy to make; check which quantifier comes first in each sentence.'
