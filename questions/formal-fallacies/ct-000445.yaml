id: ct-000445
area: formal-fallacies
kind: scenario
topic: Masked-man fallacy
topic_type: FormalFallacy
true_statement: Pat trusts the new supplier but distrusts the firm that sent last month's late shipment, and concludes they must be two different companies. Inferring non-identity from a difference in attitudes is the masked-man fallacy.
false_statement: Pat trusts the new supplier but distrusts the firm that sent last month's late shipment, and concludes they must be two different companies. Inferring non-identity from a difference in attitudes is the quantifier shift fallacy.
explanation: The tell is using what someone trusts or knows to prove two things are distinct; the firms could be one company under another name. A quantifier shift swaps the order of 'every' and 'some', which nothing here does.
