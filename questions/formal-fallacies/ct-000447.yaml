topic: Masked-man fallacy
topic_type: FormalFallacy
true_statement: The masked-man fallacy takes its name from a veiled-man puzzle credited to Eubulides of the Megarian school in the fourth century BCE.
false_statement: The masked-man fallacy takes its name from a veiled-man puzzle credited to Gottlob Frege in his 1892 work on sense and reference.
explanation: The puzzle of knowing your father but not the masked man who is your father is attributed to Eubulides, alongside the liar and the heap. Frege came much later and supplied a diagnosis, sense versus reference, not the puzzle itself.
