id: ct-000487
area: formal-fallacies
kind: scenario
topic: Illicit minor
topic_type: FormalFallacy
true_statement: '"All incident-response team members are first-aid certified. All incident-response team members are full-time staff. So all full-time staff are first-aid certified." This syllogism commits the illicit minor.'
false_statement: '"All incident-response team members are first-aid certified. All incident-response team members are full-time staff. So all full-time staff are first-aid certified." This syllogism commits the illicit major.'
explanation: The conclusion's subject, "full-time staff", covers every employee there but only part of the class in the premise, where it is the predicate of an affirmative statement. An illicit major would overextend the conclusion's predicate instead.
