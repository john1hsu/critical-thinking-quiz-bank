id: ct-000488
area: formal-fallacies
kind: counter
topic: Illicit minor
topic_type: FormalFallacy
true_statement: '"All pilot-store managers use the new app; all pilot-store managers are regional staff; so all regional staff use it." If there are pilot managers, the most these premises support is that some regional staff use the app.'
false_statement: '"All pilot-store managers use the new app; all pilot-store managers are regional staff; so all regional staff use it." If there are pilot managers, the most these premises support is that most regional staff use the app.'
explanation: The evidence covers only the pilot managers, a part of the regional staff of unknown size, so only a "some" conclusion is earned. Offering that weaker claim is the repair; "most" still outruns what the premises say.
