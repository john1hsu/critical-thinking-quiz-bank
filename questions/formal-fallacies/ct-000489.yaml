topic: Illicit minor
topic_type: FormalFallacy
true_statement: Carveth Read noted that an illicit minor can survive scrutiny when its conclusion happens to be true, since a reader who agrees with it may not notice the invalid form.
false_statement: Carveth Read noted that an illicit minor can survive scrutiny when its conclusion happens to be false, since a reader who rejects it may not notice the invalid form.
explanation: Read's example ends with the true claim that all cooking animals are men, which hides the flawed step. Validity depends on form, so a believable conclusion is no evidence the reasoning is sound.
