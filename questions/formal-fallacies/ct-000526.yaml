id: ct-000526
area: formal-fallacies
kind: scenario
topic: Modal scope fallacy
topic_type: FormalFallacy
true_statement: '"If the release passed every regression test, it cannot contain a regression. It passed every test. So it is impossible for this release to contain a regression." This reasoning commits the modal scope fallacy.'
false_statement: '"If the release passed every regression test, it cannot contain a regression. It passed every test. So it is impossible for this release to contain a regression." This reasoning is a valid modus ponens.'
explanation: 'The "cannot" belongs to the whole if-then link: passing tests that would catch a regression while still containing one is what''s impossible. Modus ponens licenses only "it contains no such regression", not that one was impossible.'
