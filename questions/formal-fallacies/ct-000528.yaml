topic: Modal scope fallacy
topic_type: FormalFallacy
true_statement: Boethius answered the worry that God's foreknowledge makes the future necessary by separating conditional necessity from simple necessity.
false_statement: Peter Abelard answered the worry that God's foreknowledge makes the future necessary by separating conditional necessity from simple necessity.
explanation: Conditional versus simple necessity is Boethius's distinction, which medieval logicians inherited. Abelard later recast the point in his own terms, as the compound versus the divided sense of a modal statement.
