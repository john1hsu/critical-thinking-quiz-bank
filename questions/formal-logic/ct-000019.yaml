id: ct-000019
area: formal-logic
kind: scenario
topic: Deductive reasoning
topic_type: ReasoningMode
true_statement: Because the last five hires from one bootcamp did well, a manager concludes the next one probably will too. Her reasoning is inductive, since the premises make the conclusion probable, not guaranteed.
false_statement: Because the last five hires from one bootcamp did well, a manager concludes the next one probably will too. Her reasoning is deductive, since the premises guarantee the conclusion.
explanation: Deduction aims at conclusions the premises guarantee; induction aims at conclusions they make probable and goes beyond its evidence. Five good past cases can't rule out a weak sixth.
