id: ct-000020
area: formal-logic
kind: mechanism
topic: Deductive reasoning
topic_type: ReasoningMode
true_statement: Adding premises can never weaken a valid deduction, whereas new evidence can strengthen or undermine an inductive argument.
false_statement: Adding premises can turn a valid deduction invalid, whereas an inductive argument stays fixed once its evidence is in.
explanation: A valid deduction's conclusion is already contained in its premises, so more premises can't break the guarantee. Inductive conclusions outrun their evidence, so new evidence can move them either way.
