true_statement: Evans, Barston and Pollard (1983) found that belief bias in judging syllogisms was stronger for invalid arguments than for valid ones.
false_statement: Evans, Barston and Pollard (1983) found that belief bias in judging syllogisms was stronger for valid arguments than for invalid ones.
explanation: People judged syllogisms partly by whether the conclusion was believable, and believable conclusions most often slipped through when the logic was invalid. That's why validity needs testing separately from whether you like the conclusion.
