id: ct-000050
area: formal-logic
kind: counter
topic: Method of counterexample
topic_type: Technique
true_statement: If you try hard and can't think of a case where an argument's premises hold and its conclusion fails, that still doesn't prove the argument valid.
false_statement: If you try hard and can't think of a case where an argument's premises hold and its conclusion fails, that proves the argument valid.
explanation: 'One counterexample proves invalidity, but the method is asymmetric: not finding one may just mean you missed it. Proving validity needs an exhaustive check, such as every row of a truth table.'
