true_statement: De Neys and colleagues (2003) found people accepted affirming-the-consequent inferences less often the more alternative causes they could recall.
false_statement: De Neys and colleagues (2003) found people accepted affirming-the-consequent inferences more often the more alternative causes they could recall.
explanation: Each retrieved alternative cause is a counterexample to reading the conditional backwards, so acceptance of the fallacy fell as their number rose. The finding concerns everyday causal content, not formal training in the method.
