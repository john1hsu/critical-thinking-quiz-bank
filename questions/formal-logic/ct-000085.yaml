area: formal-logic
kind: scenario
topic: Modus ponens
topic_type: ReasoningForm
true_statement: '"If a contract is over $10,000, it needs legal review. This contract is $14,000. So it needs legal review." The argument uses modus ponens and is valid.'
false_statement: '"If a contract is over $10,000, it needs legal review. This contract is $14,000. So it needs legal review." The argument affirms the consequent and is invalid.'
explanation: 'The second premise affirms the antecedent (over $10,000) and concludes the consequent, which is modus ponens. Affirming the consequent would run the other way: "it got legal review, so it must be over $10,000."'
