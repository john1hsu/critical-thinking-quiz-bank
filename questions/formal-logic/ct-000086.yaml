id: ct-000086
area: formal-logic
kind: counter
topic: Modus ponens
topic_type: ReasoningForm
true_statement: If you accept both premises of a modus ponens argument but still doubt its conclusion, the thing to question is the conditional premise, since the form itself can't lead from true premises to a false conclusion.
false_statement: If you accept both premises of a modus ponens argument but still doubt its conclusion, the thing to question is the inference, since the form can lead from true premises to a false conclusion.
explanation: Modus ponens is valid, so doubt about the conclusion has to land on a premise. Everyday conditionals often hide unstated requirements, which is where the rule is most likely incomplete or out of date.
