true_statement: In a 1999 study, people endorsed modus ponens about 93% of the time, but only about 64% once a second conditional named an extra requirement.
false_statement: In a 1999 study, people endorsed modus ponens about 64% of the time, rising to about 93% once a second conditional named an extra requirement.
explanation: 'Neth and Beller''s results show the suppression effect: reminding people of another necessary condition makes them reluctant to draw a valid conclusion. People treat everyday conditionals as defeasible rules, not strict ones.'
