id: ct-000137
area: formal-logic
kind: mechanism
topic: Modus tollens
topic_type: ReasoningForm
true_statement: Every modus tollens argument can be rewritten as a modus ponens on the contrapositive, "if not Q then not P", which is why both forms are valid.
false_statement: Every modus tollens argument can be rewritten as a modus ponens on the converse, "if Q then P", which is why both forms are valid.
explanation: A conditional is equivalent to its contrapositive, so denying Q and applying "if not Q then not P" gives not-P by modus ponens. The converse is not equivalent, and reasoning from it is how affirming the consequent goes wrong.
