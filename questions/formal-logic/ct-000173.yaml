true_statement: '"No contractors attend the board meeting. No board-meeting attendees are interns. So no contractors are interns." Because both premises are negative, nothing follows and the syllogism is invalid.'
false_statement: '"No contractors attend the board meeting. No board-meeting attendees are interns. So no contractors are interns." Because both premises are universal, the syllogism validly yields a universal conclusion.'
explanation: 'One of Aristotle''s rules is that nothing follows from two negative premises: knowing two groups both avoid a third says nothing about how they relate to each other. Two universal premises are needed for a universal conclusion, but that is not enough on its own.'
