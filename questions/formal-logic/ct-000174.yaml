true_statement: For Aristotle, sullogismos meant any valid deduction, so the modern phrase "invalid syllogism" would have been a contradiction in terms.
false_statement: For Aristotle, sullogismos meant any argument with two premises, valid or not, so the modern phrase "invalid syllogism" fits his usage exactly.
explanation: His definition required that something different from the premises follow of necessity, so validity was built in. Later textbooks narrowed the word to two-premise forms that can be valid or invalid.
