id: ct-000221
area: formal-logic
kind: scenario
topic: Venn diagram test
topic_type: Technique
true_statement: '"All approved vendors passed the security review. Some cloud providers passed the security review. So some cloud providers are approved vendors." On a Venn diagram the second premise''s X must sit on a line, so the test shows the argument is invalid.'
false_statement: '"All approved vendors passed the security review. Some cloud providers passed the security review. So some cloud providers are approved vendors." On a Venn diagram the second premise''s X falls inside the approved-vendor circle, so the test shows the argument is valid.'
explanation: 'The premises don''t say whether the cloud providers that passed are inside or outside the approved-vendor circle, and neither part is shaded, so the X goes on the line. An undetermined X means the conclusion isn''t shown: an undistributed middle.'
