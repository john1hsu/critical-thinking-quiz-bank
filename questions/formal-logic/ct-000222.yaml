topic: Venn diagram test
topic_type: Technique
true_statement: When running a Venn diagram test, draw the universal premises before the particular ones, since shading added later may cover a region where an X was already placed.
false_statement: When running a Venn diagram test, draw the particular premises before the universal ones, since an X placed first tells you which regions are safe to shade.
explanation: Shading first narrows down where an X can legitimately go, so it either lands in a single region or clearly on a line. Placing the X first risks putting it in a region a universal premise says is empty.
