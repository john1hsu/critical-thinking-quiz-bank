topic: Venn diagram test
topic_type: Technique
true_statement: John Venn's own diagrams marked empty regions by shading; the X for "at least one" was a later addition by Charles S. Peirce.
false_statement: John Venn's own diagrams marked occupied regions with an X; shading for empty regions was a later addition by Charles S. Peirce.
explanation: Venn's primary diagram drew every combination of classes and recorded emptiness by shading. Peirce supplied the mark for existence that textbooks now use for "some" statements.
