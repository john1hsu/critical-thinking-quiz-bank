id: ct-000262
area: formal-logic
kind: counter
topic: Truth table
topic_type: Technique
true_statement: To show an argument invalid with a partial truth table, set the conclusion false and then try to make every premise true; finding one such row is enough.
false_statement: To show an argument invalid with a partial truth table, set every premise true and then try to make the conclusion true; finding one such row is enough.
explanation: Invalidity means some row has all premises true and the conclusion false, so you work backwards from a false conclusion. A row where everything is true proves nothing, and showing validity would mean ruling out every row, not finding one.
