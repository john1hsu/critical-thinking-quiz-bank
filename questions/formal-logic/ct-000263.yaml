true_statement: Irving Anellis argues that an unpublished 1893 manuscript by Charles Sanders Peirce holds the earliest truth table by an identifiable author, though credit is still debated.
false_statement: Irving Anellis argues that Ludwig Wittgenstein's Tractatus holds the earliest truth table by an identifiable author, though credit is still debated.
explanation: Anellis dates Peirce's matrix for the conditional to 1893. Wittgenstein's Tractatus (1921-22) made truth tables widely known, and even his own handwritten implication table dates only from 1912.
