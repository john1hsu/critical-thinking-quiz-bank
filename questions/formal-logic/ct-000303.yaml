area: formal-logic
kind: scenario
topic: Rules of the categorical syllogism
topic_type: Technique
true_statement: '"No remote staff use the old VPN. Some engineers are remote staff. So some engineers use the old VPN." This syllogism breaks the rule that a negative premise requires a negative conclusion, so it is invalid.'
false_statement: '"No remote staff use the old VPN. Some engineers are remote staff. So some engineers use the old VPN." This syllogism commits the undistributed middle, so it is invalid.'
explanation: One premise is negative but the conclusion is affirmative, which the negation rule forbids. The middle term, remote staff, is the subject of a universal premise and so is distributed, which rules out the undistributed middle.
