topic: Rules of the categorical syllogism
topic_type: Technique
true_statement: If you need to tell a colleague what is wrong with a syllogism, not just that it fails, the rule checklist suits better than a Venn diagram, since each broken rule names a specific fallacy.
false_statement: If you need to tell a colleague what is wrong with a syllogism, not just that it fails, a Venn diagram suits better than the rule checklist, since each unmarked region names a specific fallacy.
explanation: Both methods decide validity, but a diagram shows class relations while the rules are a verbal checklist in which each failure, such as an illicit major, is a named error. Regions of a diagram carry no fallacy names.
