topic: Rules of the categorical syllogism
topic_type: Technique
true_statement: The Port-Royal Logic gave a compact list of six syllogism rules and held that a mood is valid if and only if it breaks none of them.
false_statement: John Buridan gave a compact list of six syllogism rules and held that a mood is valid if and only if it breaks none of them.
explanation: The best-known six-rule list, with the claim that passing every rule is both necessary and sufficient, comes from the seventeenth-century Port-Royal Logic. Buridan, in the fourteenth century, used distribution to test moods but is not the source of that list.
