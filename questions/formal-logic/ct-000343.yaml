id: ct-000343
area: formal-logic
kind: scenario
topic: Distribution of terms
topic_type: Concept
true_statement: An IT audit notes "Some laptops are not encrypted." In this statement the predicate term, "encrypted devices", is distributed and the subject term, "laptops", is not.
false_statement: An IT audit notes "Some laptops are not encrypted." In this statement the subject term, "laptops", is distributed and the predicate term, "encrypted devices", is not.
explanation: 'This is an O statement (particular negative), which distributes only its predicate: it puts some laptops wholly outside the class of encrypted devices, so it says something about every encrypted device, but only about some laptops.'
