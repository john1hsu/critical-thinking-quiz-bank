true_statement: Terence Parsons argued in 2006 that the doctrine of distribution dates back at least to the twelfth century, against Peter Geach's claim that it was a sixteenth-century misreading.
false_statement: Peter Geach argued that the doctrine of distribution dates back at least to the twelfth century, against Terence Parsons' claim that it was a sixteenth-century misreading.
explanation: Geach was the critic who called distribution a late misreading of medieval distributive supposition; Parsons answered him by tracing it to the twelfth century and to Aristotle's idea of a term taken universally. The false version swaps the two sides.
