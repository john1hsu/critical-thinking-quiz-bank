area: formal-logic
kind: scenario
topic: Square of opposition
topic_type: Concept
true_statement: Told only that some tests in the suite passed, a release manager concludes that some tests must have failed. By the square of opposition, that inference is invalid.
false_statement: Told only that some tests in the suite passed, a release manager concludes that some tests must have failed. By the square of opposition, that inference is valid.
explanation: 'In logic "some" means at least one, so "some passed" (I) is compatible with all of them passing. I and O are subcontraries: they can''t both be false, but the truth of one leaves the other open.'
