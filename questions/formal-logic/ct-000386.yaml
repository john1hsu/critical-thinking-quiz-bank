area: formal-logic
kind: counter
topic: Square of opposition
topic_type: Concept
true_statement: When one colleague claims every launch this year hit its date and another claims none did, both may be wrong, because the two claims are contraries rather than contradictories.
false_statement: When one colleague claims every launch this year hit its date and another claims none did, one of them must be right, because the two claims are contradictories rather than contraries.
explanation: '"All" versus "none" sits on the top side of the square, where both can be false; the truth may be that some launches were on time and some were not. Contradictories, such as "all" versus "some did not", are the pairs where exactly one is true.'
