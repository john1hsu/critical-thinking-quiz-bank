true_statement: Boethius's Latin translations and commentaries, written shortly after 500 CE, made the square of opposition a fixture of medieval logic teaching.
false_statement: John Buridan's Latin translations and commentaries, written shortly after 500 CE, made the square of opposition a fixture of medieval logic teaching.
explanation: Boethius carried the diagram into the Latin West in the early sixth century. Buridan worked much later, in the fourteenth century, and is known for testing the square's rules against empty terms rather than spreading it.
