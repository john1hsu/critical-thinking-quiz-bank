kind: scenario
topic: Antilogism
topic_type: Technique
true_statement: '"No contractors have badge access. Some visitors are contractors. So some visitors lack badge access." The premises plus the denied conclusion, "all visitors have badge access", form an inconsistent triad, so the syllogism is valid.'
false_statement: '"No contractors have badge access. Some visitors are contractors. So some visitors lack badge access." The premises plus the denied conclusion, "all visitors have badge access", can all be true together, so the syllogism is invalid.'
explanation: If all visitors had access, the visitors who are contractors would have access, contradicting "no contractors have access". The trio can't all be true, which is exactly what makes the original argument valid on Ladd's test.
