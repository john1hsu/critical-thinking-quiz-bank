true_statement: If your context assumes the classes involved have members, add that as an explicit premise before using the antilogism test, since the test reads universals as making no such claim.
false_statement: If your context assumes the classes involved have members, there's no need to add it as a premise before using the antilogism test, since the test already reads universals as claiming their classes have members.
explanation: The test treats "all S are P" only as saying a combination is empty, so moods that rely on existential import come out invalid. Stating the existence assumption openly lets those arguments be judged fairly.
