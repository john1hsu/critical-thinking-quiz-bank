true_statement: Christine Ladd introduced the antilogism in 1883 as a graduate student of Charles S. Peirce at Johns Hopkins, which withheld her doctorate until 1926.
false_statement: Christine Ladd introduced the antilogism in 1883 as a graduate student of George Boole at Johns Hopkins, which withheld her doctorate until 1926.
explanation: Ladd published the method in "On the Algebra of Logic" while studying under Peirce, who shaped her algebraic approach. Boole was an earlier founder of the algebra of logic, not her teacher.
