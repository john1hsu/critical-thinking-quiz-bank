area: formal-logic
kind: scenario
topic: Disjunctive syllogism
topic_type: ReasoningForm
true_statement: An office manager reasons that the shared printer fails because of either the network or the print driver; diagnostics clear the network, so the driver is to blame. The inference is a valid disjunctive syllogism.
false_statement: An office manager reasons that the shared printer fails because of either the network or the print driver; diagnostics clear the network, so the driver is to blame. The inference affirms a disjunct.
explanation: The manager denies one option and accepts the other, the valid elimination pattern. Affirming a disjunct runs the other way, confirming one option to rule the other out; any weakness here lies in whether the two-option list is complete.
