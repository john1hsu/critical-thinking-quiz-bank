topic: Disjunctive syllogism
topic_type: ReasoningForm
true_statement: Paraconsistent logics deny that disjunctive syllogism is valid in general, because it is a step in deriving the classical result that a contradiction implies every statement.
false_statement: Paraconsistent logics deny that modus ponens is valid in general, because it is a step in deriving the classical result that a contradiction implies every statement.
explanation: From A you infer "A or B", and from "not A" disjunctive syllogism yields any B, so blocking explosion means giving up that step. Relevance logics in fact add a separate conditional precisely so that modus ponens survives.
