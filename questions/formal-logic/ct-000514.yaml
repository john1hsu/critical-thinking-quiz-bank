topic: Formal logic
topic_type: Field
true_statement: When formalising a colleague's argument, propositional logic suffices if only "and", "or", "not" and "if" do the work; reach for predicate logic when it turns on "all", "some" or relations.
false_statement: When formalising a colleague's argument, predicate logic suffices if only "and", "or", "not" and "if" do the work; reach for propositional logic when it turns on "all", "some" or relations.
explanation: The advice is to pick the weakest system that captures what matters. Propositional logic treats whole sentences as units, so quantifiers and relations need the extra machinery of predicate logic.
