true_statement: Symbolising an argument in propositional logic loses the force of a word like "because", since whether "A because B" is true depends on more than the truth of A and B.
false_statement: Symbolising an argument in propositional logic loses the force of a word like "and", since whether "A and B" is true depends on more than the truth of A and B.
explanation: '"And" is truth-functional: "A and B" is true exactly when both parts are. "Because" also claims a connection between them, which a truth table cannot record, one of the limits of formalisation.'
