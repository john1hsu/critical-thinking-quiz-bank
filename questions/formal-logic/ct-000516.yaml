true_statement: George Boole recast logic as an algebra of classes in 1847 and 1854, replacing the catalogue of valid syllogisms with general procedures for arguments of any complexity.
false_statement: Gottlob Frege recast logic as an algebra of classes in 1847 and 1854, replacing the catalogue of valid syllogisms with general procedures for arguments of any complexity.
explanation: Boole founded the algebraic tradition with his Mathematical Analysis of Logic and Laws of Thought. Frege's break came later, in 1879, with a function-argument analysis using quantifiers rather than an algebra of classes.
