area: foundations
kind: counter
topic: Soundness
topic_type: Concept
true_statement: Showing that an argument is unsound doesn't show its conclusion is false; it shows only that this argument fails to establish it.
false_statement: Showing that an argument is unsound shows its conclusion is false, because a bad argument can't lead to a true conclusion.
explanation: An unsound argument can still have a true conclusion, reached by luck or supported by other reasons. Rebutting one argument leaves the claim open, so say 'this argument fails' rather than 'this claim is wrong'.
