true_statement: A cogent argument can have a false conclusion, but a sound argument cannot.
false_statement: A sound argument can have a false conclusion, but a cogent argument cannot.
explanation: 'Cogency is the non-deductive counterpart: strong support plus true premises, which makes a conclusion likely. Soundness combines validity with true premises, which guarantees a true conclusion.'
