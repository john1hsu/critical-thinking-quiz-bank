id: ct-000052
area: foundations
kind: scenario
topic: Validity
topic_type: Concept
true_statement: '"Every expense over $500 needs a director''s approval. This expense has a director''s approval. So it was over $500." Even if both premises are true, this argument is invalid.'
false_statement: '"Every expense over $500 needs a director''s approval. This expense has a director''s approval. So it was over $500." If both premises are true, this argument is valid.'
explanation: 'The rule runs from ''over $500'' to ''needs approval'', not back: a director might also approve a $200 expense. Validity is about whether true premises could coexist with a false conclusion, and here they can, so true premises don''t rescue it.'
