id: ct-000053
area: foundations
kind: mechanism
topic: Validity
topic_type: Concept
true_statement: An argument whose premises contradict each other counts as valid, because there is no case in which all its premises are true.
false_statement: An argument whose premises contradict each other counts as invalid, because there is no case in which all its premises are true.
explanation: Validity only rules out true premises with a false conclusion. If the premises can never all be true together, that situation can't arise, so the argument passes the test, though it can never be sound.
