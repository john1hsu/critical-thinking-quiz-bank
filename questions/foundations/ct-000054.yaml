true_statement: A 2018 meta-analysis of belief bias found that, at the group level, a conclusion's believability mainly shifted people's willingness to say "valid" rather than their ability to tell valid from invalid.
false_statement: A 2018 meta-analysis of belief bias found that, at the group level, a conclusion's believability mainly impaired people's ability to tell valid from invalid rather than their willingness to say "valid".
explanation: 'Trippas and colleagues argued the classic belief-by-validity interaction is partly an analysis artifact: belief acts more like a response bias than a loss of discrimination. Either way, believable conclusions make people likelier to accept arguments.'
