true_statement: In an incident review where everyone already agrees the site went down, an engineer writes, "The site went down because the security certificate expired." The sentence is an explanation rather than an argument.
false_statement: In an incident review where everyone already agrees the site went down, an engineer writes, "The site went down because the security certificate expired." The sentence is an argument rather than an explanation.
explanation: The outage is already accepted, so "because" is telling why it happened, not trying to show that it happened. Indicator words are clues, not proof; ask whether the claim after them is in dispute.
