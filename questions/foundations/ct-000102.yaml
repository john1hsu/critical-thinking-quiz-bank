id: ct-000102
area: foundations
kind: counter
topic: Argument
topic_type: Concept
true_statement: When evaluating an inductive argument, ask how strongly its premises support the conclusion, rather than faulting it for not being deductively valid.
false_statement: When evaluating an inductive argument, fault it for not being deductively valid, since only valid arguments give premises any support for a conclusion.
explanation: An inductive argument only claims to make its conclusion probable, so judging it by the deductive standard is a category mistake. The right question is how much the premises raise the conclusion's likelihood.
