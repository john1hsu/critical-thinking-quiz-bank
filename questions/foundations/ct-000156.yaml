area: foundations
kind: counter
topic: Burden of proof
topic_type: Concept
true_statement: When the backer of a proposal fails to carry the burden of proof, the right response is to withhold acceptance, not to treat the opposite claim as proven.
false_statement: When the backer of a proposal fails to carry the burden of proof, the right response is to treat the opposite claim as proven.
explanation: An unmet burden leaves a claim unpersuasive; it does not establish its negation. Moving from "you haven't proven P" to "so not-P" is the step that marks a fallacious argument from ignorance.
