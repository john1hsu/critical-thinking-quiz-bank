area: foundations
kind: definition
topic: Burden of proof
topic_type: Concept
true_statement: In law, the burden of production is the duty to bring enough evidence to put an issue in play, while the burden of persuasion is the duty to convince the fact-finder to the required standard.
false_statement: In law, the burden of persuasion is the duty to bring enough evidence to put an issue in play, while the burden of production is the duty to convince the fact-finder to the required standard.
explanation: Production gets an issue onto the table; persuasion wins it at a set standard such as a preponderance of evidence or beyond reasonable doubt. The false version swaps the two labels.
