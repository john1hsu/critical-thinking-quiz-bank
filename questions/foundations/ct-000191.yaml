topic: Inductive reasoning
topic_type: ReasoningMode
true_statement: Twelve app releases in a row brought a first-week spike in support tickets, and the next release follows the same process, so a spike is probable. If those premises are in fact true, the argument is cogent.
false_statement: Twelve app releases in a row brought a first-week spike in support tickets, and the next release follows the same process, so a spike is probable. If those premises are in fact true, the argument is sound.
explanation: An inductive argument that is strong and has true premises is called cogent. Sound is the deductive term, for a valid argument with true premises, and this argument makes its conclusion likely rather than guaranteed.
