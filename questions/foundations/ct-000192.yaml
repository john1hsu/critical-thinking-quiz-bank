topic: Inductive reasoning
topic_type: ReasoningMode
true_statement: Before projecting a pattern from past cases to a new one, ask why the feature occurred in the cases you observed, since causally grounded features carry over better than incidental ones.
false_statement: Before projecting a pattern from past cases to a new one, ask why the feature occurred in the cases you observed, since incidental features carry over better than causally grounded ones.
explanation: 'Whether a property projects depends on why it showed up: a stable cause is likely to be present again, a coincidence is not. The false version reverses which kind of feature generalises well.'
