topic: Inductive reasoning
topic_type: ReasoningMode
true_statement: David Hume argued that no non-circular reason shows the future will resemble the past, and concluded that habit rather than reason drives our inductive inferences.
false_statement: Francis Bacon argued that no non-circular reason shows the future will resemble the past, and concluded that habit rather than reason drives our inductive inferences.
explanation: This is Hume's problem of induction, set out in his Treatise and Enquiry. Bacon, a century earlier, championed induction as the centrepiece of a reformed science rather than questioning its justification.
