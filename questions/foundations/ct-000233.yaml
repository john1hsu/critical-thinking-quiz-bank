topic: Inference to the best explanation
topic_type: ReasoningForm
true_statement: After a deploy, checkout times out only on the discount-code path. A team concludes a new database index is the cause, since it explains that narrow pattern while a network fault or traffic spike would slow every path. That is inference to the best explanation.
false_statement: After a deploy, checkout times out only on the discount-code path. A team concludes a new database index is the cause, since it explains that narrow pattern while a network fault or traffic spike would slow every path. That is simple enumerative induction.
explanation: The team compares rival hypotheses by how well each would explain the evidence, which is the mark of IBE. Enumerative induction instead projects from observed cases, such as "every past deploy did X, so this one will".
