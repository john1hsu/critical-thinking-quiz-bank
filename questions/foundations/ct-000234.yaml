id: ct-000234
area: foundations
kind: counter
topic: Inference to the best explanation
topic_type: ReasoningForm
true_statement: Before settling on the explanation that fits the evidence best, deliberately generate several rivals, since the best of a poor set of candidates can still be wrong.
false_statement: Before settling on an explanation, judge each idea as it comes and accept the first one that fits the evidence, since any explanation that fits is the best one available.
explanation: 'This answers van Fraassen''s bad-lot objection in practice: an inference from "best we considered" to "true" is only as good as the list of rivals. Then treat the winner as the next hypothesis to test.'
