topic: Inference to the best explanation
topic_type: ReasoningForm
true_statement: Peirce's abduction was about generating hypotheses worth testing; the modern inference to the best explanation, named by Gilbert Harman in 1965, is about justifying them.
false_statement: Peirce's abduction was about justifying hypotheses as the best explanation; the modern inference named by Gilbert Harman in 1965 is about merely generating them.
explanation: Peirce placed abduction at the discovery stage and never spoke of the best explanation. The modern notion moved it to the justification stage, where hypotheses are assessed rather than merely proposed.
