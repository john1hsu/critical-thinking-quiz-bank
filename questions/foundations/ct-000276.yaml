true_statement: A buyer argues a courier will probably meet next week's deadline because it has met every deadline for two years, but records show it missed three this spring. The argument is uncogent, because one of its premises is false.
false_statement: A buyer argues a courier will probably meet next week's deadline because it has met every deadline for two years, but records show it missed three this spring. The argument is still cogent, because its inference from the record is strong.
explanation: 'Cogency needs two things: a strong inference and premises that are actually true. The pattern of reasoning here is strong, but the claimed spotless record is false, and one false premise is enough to make the argument uncogent.'
