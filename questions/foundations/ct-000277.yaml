area: foundations
kind: counter
topic: Cogency
topic_type: Concept
true_statement: Even after judging an argument cogent, look for outside evidence against its conclusion before acting, because strong support from true premises still leaves the conclusion only probable.
false_statement: Even after judging an argument cogent, check whether it is deductively valid before acting, because strong support from true premises leaves the conclusion unproven until it is.
explanation: A cogent argument makes its conclusion likely, not certain, so the sensible last step is to check for independent reasons to doubt the conclusion. Demanding deductive validity misjudges a non-deductive argument by the wrong standard.
