true_statement: Godden and Zenker's 2018 Bayesian analysis of cogency argued that the acceptability, relevance and sufficiency criteria are not fully independent of one another.
false_statement: Godden and Zenker's 2018 Bayesian analysis of cogency argued that the acceptability, relevance and sufficiency criteria are fully independent, confirming how they are usually taught.
explanation: Restating the RSA criteria in probabilistic terms, Godden and Zenker found that they overlap, which challenges the textbook practice of checking them as three separate tests. Their analysis questioned that teaching rather than confirming it.
