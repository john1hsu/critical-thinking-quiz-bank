topic: Ambiguity
topic_type: Concept
true_statement: A travel policy grants an allowance to staff with "long commutes", and colleagues argue over whether 50 minutes each way qualifies. The trouble is vagueness rather than ambiguity.
false_statement: A travel policy grants an allowance to staff with "long commutes", and colleagues argue over whether 50 minutes each way qualifies. The trouble is ambiguity rather than vagueness.
explanation: Nobody disputes what "long" means here; the dispute is about a borderline case of a single meaning, which is the mark of vagueness. Ambiguity would need the phrase to carry two distinct, legitimate meanings, as "bank" does.
