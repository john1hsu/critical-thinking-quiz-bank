topic: Ambiguity
topic_type: Concept
true_statement: To check an argument for equivocation, replace each load-bearing term in the premises with a precise paraphrase and see whether the same paraphrase still fits the conclusion.
false_statement: To check an argument for equivocation, confirm that each load-bearing term in the premises appears in the conclusion in exactly the same words.
explanation: 'Equivocation hides behind identical wording: the same word carries one meaning in a premise and another in the conclusion. Only substituting a precise paraphrase reveals whether the meaning, not just the spelling, stayed fixed.'
