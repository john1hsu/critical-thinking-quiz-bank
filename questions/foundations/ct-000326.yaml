area: foundations
kind: evidence
topic: Ambiguity
topic_type: Concept
true_statement: Piantadosi, Tily and Gibson (2012) found that in English, German and Dutch corpora, shorter and more frequent words tended to have more meanings, as an efficient code that lets context do the work would predict.
false_statement: Piantadosi, Tily and Gibson (2012) found that in English, German and Dutch corpora, longer and rarer words tended to have more meanings, as an efficient code that lets context do the work would predict.
explanation: Their argument is that when context resolves meaning, it is efficient to reuse the short, easy forms, so those carry the most senses. Longer, rarer words having more meanings would cut against the efficiency account.
