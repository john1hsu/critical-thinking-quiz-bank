id: ct-000361
area: foundations
kind: scenario
topic: Necessary and sufficient conditions
topic_type: Concept
true_statement: An HR policy says staff are eligible for a bonus only if they have passed probation. An employee who has just passed probation tells friends her bonus is now guaranteed. She has treated a necessary condition as if it were sufficient.
false_statement: An HR policy says staff are eligible for a bonus only if they have passed probation. An employee who has just passed probation tells friends her bonus is now guaranteed. She has treated a sufficient condition as if it were necessary.
explanation: '"Only if" marks a necessary condition: no bonus without passing probation, but passing alone guarantees nothing. Her mistake is reading a prerequisite as a guarantee, which is mistaking necessity for sufficiency, not the reverse.'
