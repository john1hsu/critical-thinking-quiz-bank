id: ct-000362
area: foundations
kind: counter
topic: Necessary and sufficient conditions
topic_type: Concept
true_statement: To test whether a large market share is sufficient for profit, look for a firm that has a large market share but still loses money.
false_statement: To test whether a large market share is sufficient for profit, look for a profitable firm that has only a small market share.
explanation: 'A sufficiency claim fails if the condition can be present while the outcome is absent. A profitable firm with a small share instead tests necessity: it shows profit is possible without a large share.'
