topic: Necessary and sufficient conditions
topic_type: Concept
true_statement: 'In 1965 J. L. Mackie proposed that a cause is typically an INUS condition: an insufficient but necessary part of a condition that is itself unnecessary but sufficient for the effect.'
false_statement: 'In 1965 J. L. Mackie proposed that a cause is typically an INUS condition: a sufficient but unnecessary part of a condition that is itself necessary but insufficient for the effect.'
explanation: 'The acronym spells it out: Insufficient but Necessary part of an Unnecessary but Sufficient condition. A short circuit, say, needs other factors to start a fire, and other routes to the fire exist. The false version swaps each pair.'
