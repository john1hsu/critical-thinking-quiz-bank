topic: Defeasible reasoning
topic_type: ReasoningMode
true_statement: The idea of defeasibility entered modern philosophy from law, through H. L. A. Hart's 1949 argument that a claim like "there is a valid contract" can be defeated by a recognised exception.
false_statement: The idea of defeasibility entered modern philosophy from law, through John Pollock's 1949 argument that a claim like "there is a valid contract" can be defeated by a recognised exception.
explanation: Hart, a legal philosopher, introduced the notion by noting that legal claims hold unless an exception applies. Pollock came decades later, building the theory of prima facie reasons and defeaters in 1987.
