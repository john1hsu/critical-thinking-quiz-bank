id: ct-000436
area: foundations
kind: scenario
topic: Reasoning
topic_type: Concept
true_statement: An analyst believes orders over $500 need a manager's sign-off, then spots a routine $620 order without one. Rather than report a breach, she checks whether the threshold changed. Doubting the rule here can be reasonable.
false_statement: An analyst believes orders over $500 need a manager's sign-off, then spots a routine $620 order without one. Rather than report a breach, she checks whether the threshold changed. Doubting the rule here is unreasonable, since her beliefs imply a breach.
explanation: On Harman's view, logic says what her beliefs imply but not whether to accept the conclusion or drop a premise. Which move is right depends on how confident she is in each belief, and a routine unsigned order is a fair reason to doubt the rule.
