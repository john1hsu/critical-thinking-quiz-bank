true_statement: When a team argues over whether to ship on Friday, settle the factual questions apart from the decision itself, since deciding what to do also needs goals and values the facts don't supply.
false_statement: When a team argues over whether to ship on Friday, there's no need to keep the factual questions apart from the decision, since once the facts are settled the right action follows from them alone.
explanation: Theoretical reasoning settles what to believe; practical reasoning settles what to do and draws on goals as well as facts. Keeping the two apart shows whether a disagreement is about the evidence or about priorities.
