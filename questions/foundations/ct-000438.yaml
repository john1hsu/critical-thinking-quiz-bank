true_statement: In a 2014 study by Trouche, Sander and Mercier, 22% of adults solved a disjunctive logic problem alone, but 63% did after group discussion.
false_statement: In a 2014 study by Trouche, Sander and Mercier, 63% of adults solved a disjunctive logic problem alone, but only 22% did after group discussion.
explanation: Groups did far better, mostly because good arguments rather than confidence changed minds, as the argumentative theory of reasoning predicts. The authors also found a problem where confident wrong members prevailed, so discussion helps but guarantees nothing.
