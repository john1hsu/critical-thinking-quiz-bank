true_statement: A manager can list every question to ask about a vendor's claim that its programme cut turnover by a third, yet skips them all because it's the result she hoped for. What she lacks is the disposition of critical thinking, not the ability.
false_statement: A manager can list every question to ask about a vendor's claim that its programme cut turnover by a third, yet skips them all because it's the result she hoped for. What she lacks is the ability of critical thinking, not the disposition.
explanation: She has the skills, since she knows the checks; what fails is the habit of applying them, especially to a welcome result. Accounts of critical thinking treat abilities and dispositions as separate ingredients that can come apart.
