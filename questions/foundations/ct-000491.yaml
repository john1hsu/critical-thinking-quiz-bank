true_statement: Because critical thinking leans heavily on domain knowledge and trained skills transfer weakly, Willingham advises planning critical-thinking instruction subject by subject over several years.
false_statement: Because critical thinking leans heavily on domain knowledge and trained skills transfer weakly, Willingham advises teaching it once as a general course that students then apply in every subject.
explanation: If skills don't carry over well to new contexts, a single general course is exactly what would underdeliver. Building the skills inside each subject, where the needed knowledge lives, follows from his premises.
