true_statement: Edward Glaser showed experimentally in 1941 that high-school students' critical thinking could be improved, after progressive schools of the 1930s had adopted it as a goal.
false_statement: John Dewey showed experimentally in 1941 that high-school students' critical thinking could be improved, after progressive schools of the 1930s had adopted it as a goal.
explanation: 'Glaser''s experiment was the early evidence that the skill can be taught. Dewey''s contribution came earlier and was conceptual: his 1910 account of reflective thinking put the idea on the educational agenda.'
