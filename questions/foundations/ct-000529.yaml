id: ct-000529
area: foundations
kind: scenario
topic: Logical consequence
topic_type: Concept
true_statement: '"Every invoice over the threshold needs two sign-offs. This invoice has one. So it isn''t over the threshold." The conclusion is a logical consequence of the premises, whether or not the system really enforces the rule.'
false_statement: '"Every invoice over the threshold needs two sign-offs. This invoice has one. So it isn''t over the threshold." The conclusion is not a logical consequence of the premises, because the system might not really enforce the rule.'
explanation: No situation makes both premises true and the conclusion false, so the conclusion follows. Whether the rule is enforced bears on the truth of the first premise, a separate question from the consequence relation.
