topic: Logical consequence
topic_type: Concept
true_statement: '"A entails B" is a claim made about sentences, in the metalanguage, whereas "if A then B" uses a connective that builds a longer sentence within the object language.'
false_statement: '"If A then B" is a claim made about sentences, in the metalanguage, whereas "A entails B" uses a connective that builds a longer sentence within the object language.'
explanation: Entailment is a relation between sentences; the conditional is a piece of one sentence. Because everyday "implies" blurs the two, careful logic textbooks avoid the word.
