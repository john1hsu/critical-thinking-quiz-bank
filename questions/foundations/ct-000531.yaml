topic: Logical consequence
topic_type: Concept
true_statement: 'Tarski''s 1936 paper on logical consequence picked out three marks of the ordinary notion: it is modal, it depends only on form, and it can be known a priori.'
false_statement: 'Tarski''s 1936 paper on logical consequence picked out three marks of the ordinary notion: it is modal, it depends only on form, and it can be known only through experience.'
explanation: Consequence holds necessarily, turns on logical form rather than subject matter, and needs no sensory evidence to be known. Being knowable without experience is part of what separates it from inductive support.
