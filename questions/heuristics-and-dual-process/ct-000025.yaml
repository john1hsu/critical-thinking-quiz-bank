true_statement: Asked how probable it is that a new product will succeed, a director quietly answers how similar it looks to a past hit. Kahneman and Frederick call this attribute substitution.
false_statement: Asked how probable it is that a new product will succeed, a director quietly answers how similar it looks to a past hit. Kahneman and Frederick call this belief perseverance.
explanation: Attribute substitution is answering an easier, related question (how similar?) in place of the hard target question (how probable?). The fix is to ask which easier question you actually answered.
