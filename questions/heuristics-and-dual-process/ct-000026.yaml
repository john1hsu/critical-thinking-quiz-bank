true_statement: The program traces to a 1969 survey in which mathematical psychologists, including statistics textbook authors, put too much faith in results from small samples.
false_statement: The program traces to a 1969 survey in which first-year students, unlike the statistics textbook authors also surveyed, put too much faith in results from small samples.
explanation: The striking finding was that experts who could have worked out the right answer still erred intuitively. That gap between what experts knew and what they guessed became the program's signature.
