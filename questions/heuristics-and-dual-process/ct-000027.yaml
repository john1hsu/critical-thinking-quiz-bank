true_statement: The heuristics and biases program uses systematic errors as clues to how judgment works, much as visual illusions reveal how perception works.
false_statement: The heuristics and biases program treats judgment errors as random noise to be averaged out, unlike visual illusions, which reveal how perception works.
explanation: Because the errors are predictable rather than random, they point to the shortcut that produced them. The program proposes a heuristic, predicts where it departs from a normative standard, then shows that departure experimentally.
