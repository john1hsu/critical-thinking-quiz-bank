area: heuristics-and-dual-process
kind: scenario
topic: Availability heuristic
topic_type: Heuristic
true_statement: After two memorable late shipments last month, a planner estimates that late deliveries are far more common than the carrier's logs show. Her estimate reflects the availability heuristic.
false_statement: After two memorable late shipments last month, a planner estimates that late deliveries are far more common than the carrier's logs show. Her estimate reflects the representativeness heuristic.
explanation: She judges frequency by how easily recent, vivid cases come to mind, which is availability. Representativeness judges by resemblance to a prototype, such as deciding a shipment fits the profile of a typical late one.
