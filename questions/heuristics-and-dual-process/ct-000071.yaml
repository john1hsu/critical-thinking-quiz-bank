id: ct-000071
area: heuristics-and-dual-process
kind: counter
topic: Availability heuristic
topic_type: Heuristic
true_statement: To check a team's risk ranking that may rest on availability, compare it with incident logs or base rates, because people don't correct availability errors just by being warned.
false_statement: To check a team's risk ranking that may rest on availability, ask each member to recall as many past cases of each risk as they can, because more recall corrects availability errors.
explanation: Replacing recall with counts removes the faulty cue. More recall keeps the judgment running on memory, and asking for many examples can even backfire when they are hard to retrieve.
