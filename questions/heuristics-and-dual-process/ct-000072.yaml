true_statement: In a 2019 national probability sample, the classic ease-of-retrieval reversal in self-ratings did not replicate, though listing 12 examples still felt harder than listing 6.
false_statement: In a 2019 national probability sample, the classic ease-of-retrieval reversal in self-ratings replicated, though listing 12 examples no longer felt harder than listing 6.
explanation: The difficulty manipulation worked, but the predicted shift in judgments did not appear, making it the only canonical effect in that project to fail. Availability as a source of frequency errors is well supported; this particular paradigm is more fragile.
