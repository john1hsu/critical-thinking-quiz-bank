id: ct-000112
area: heuristics-and-dual-process
kind: scenario
topic: Representativeness heuristic
topic_type: Heuristic
true_statement: Head office notices that its smallest stores fill both the best and the worst spots in the monthly returns ranking, and decides small stores are run erratically. Chance alone predicts this pattern, because small samples vary more.
false_statement: Head office notices that its smallest stores fill both the best and the worst spots in the monthly returns ranking, and decides small stores are run erratically. Chance alone can't produce this pattern, because sample size doesn't affect how much rates vary.
explanation: Like the small hospital with more lopsided days, small stores swing further from the average by chance. Treating that spread as a management signal is insensitivity to sample size, an error the heuristic produces.
