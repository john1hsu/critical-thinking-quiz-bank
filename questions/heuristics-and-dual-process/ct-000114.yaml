topic: Representativeness heuristic
topic_type: Heuristic
true_statement: A 2021 preregistered replication reproduced the Linda conjunction effect and found no support for semantic ambiguity as its cause, yet a parallel profile produced no effect at all.
false_statement: A 2021 preregistered replication failed to reproduce the Linda conjunction effect and traced earlier results to semantic ambiguity, yet a parallel profile produced a strong effect.
explanation: Chandrashekar and colleagues concluded that conjunction errors are real but context-sensitive. That cuts against Hertwig and Gigerenzer's reading-of-"probability" account while showing the effect depends on the scenario used.
