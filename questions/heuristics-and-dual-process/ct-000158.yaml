true_statement: Before reading lab errors on syllogism tasks as proof that people are irrational, ask whether the standard instructions made ordinary pragmatic influences look like biases.
false_statement: Before reading lab errors on syllogism tasks as proof that people are irrational, check them against the rules of logic, which reasoning researchers still widely treat as the right standard for everyday reasoning.
explanation: Evans's review of the deduction paradigm warns that task instructions can make pragmatic processing look like error, and notes that few researchers still treat logic as the right yardstick for everyday reasoning. The false version restores the logicist outlook he says has faded.
