kind: definition
topic: Cognitive psychology
topic_type: Field
true_statement: Cognitive psychology explains thinking through mental representations and the procedures that operate on them, the kind of inner process behaviorism had set aside.
false_statement: Cognitive psychology explains thinking through observable stimuli and responses alone, an approach it carried over from behaviorism.
explanation: Behaviorism limited psychology to what could be observed and set mental representations aside; cognitive psychology was a counter-revolution that made inner processes respectable again. The false version describes the programme it displaced.
