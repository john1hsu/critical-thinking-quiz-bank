true_statement: An analyst approves a support plan that "adds only 10% per year" at a glance, missing that the uplift compounds. On a dual-process reading, the slip was a fast default nobody paused to test, not ignorance of compounding.
false_statement: An analyst approves a support plan that "adds only 10% per year" at a glance, missing that the uplift compounds. On a dual-process reading, the slip was ignorance of compounding, not a fast default nobody paused to test.
explanation: The analyst could do the maths; the quick Type 1 answer simply went unchecked, and a colleague who wrote out the five-year total caught it. The tell is an instant judgment that a deliberate check overturns.
