topic: Dual-process theory
topic_type: Framework
true_statement: Pausing to deliberate is a useful check, but a slow, effortful answer isn't guaranteed to be right, and a fast intuitive one isn't guaranteed to be wrong.
false_statement: Pausing to deliberate is a useful check, because a slow, effortful answer can be trusted as right, while errors come from fast intuitive processing.
explanation: Even leading dual-process theorists stress that Type 1 answers are not always non-normative and Type 2 answers are not always correct. Treat deliberation as a test of the first answer, not a guarantee.
