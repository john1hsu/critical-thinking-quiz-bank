true_statement: De Neys's 2023 review found that people who end with the correct answer often gave it already under time pressure, which challenges the view that only slow deliberation produces it.
false_statement: De Neys's 2023 review found that people who end with the correct answer rarely give it under time pressure, which supports the view that only slow deliberation produces it.
explanation: Two-response studies showed correct intuitions arriving fast and biased responders still sensing conflict. De Neys proposed that competing intuitions and uncertainty monitoring decide when deliberation starts.
