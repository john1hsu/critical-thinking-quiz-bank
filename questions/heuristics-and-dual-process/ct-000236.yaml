kind: scenario
topic: Bounded rationality
topic_type: Concept
true_statement: Needing a contractor this week, a manager sets minimum requirements, reviews bids as they arrive and signs the first that clears the bar. Judged by procedural rationality, the question is whether her thresholds and search fit the job's size.
false_statement: Needing a contractor this week, a manager sets minimum requirements, reviews bids as they arrive and signs the first that clears the bar. Judged by procedural rationality, the question is whether a cheaper qualifying contractor existed somewhere.
explanation: Procedural rationality asks whether the deliberation was sound and proportionate to the stakes. Asking whether a better option existed is the outcome-based test of substantive rationality, which a satisficer is not trying to meet.
