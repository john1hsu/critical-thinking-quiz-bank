true_statement: Todd and Gigerenzer argue that adding search costs to a standard model and letting the agent optimise anyway keeps the very ideal Simon's bounded rationality rejected.
false_statement: Todd and Gigerenzer argue that adding search costs to a standard model and letting the agent optimise anyway is the most faithful version of Simon's bounded rationality.
explanation: Optimising under constraints still assumes an agent who can compute the best option, and demands even more computation. Simon's idea replaced optimisation with search and stopping rules that a limited mind can actually use.
