topic: Affect heuristic
topic_type: Heuristic
true_statement: After reading a glowing case study about a scheduling app's time savings, a team lowers its rating of the app's data-privacy risk, which the case study never mentioned. That is the affect heuristic.
false_statement: After reading a glowing case study about a scheduling app's time savings, a team lowers its rating of the app's data-privacy risk, which the case study never mentioned. That is the availability heuristic.
explanation: 'The tell is that news about benefits shifted a risk judgment it said nothing about: one good feeling is answering both questions. The availability heuristic would instead judge risk by how easily examples of privacy failures come to mind.'
