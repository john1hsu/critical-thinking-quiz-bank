topic: Affect heuristic
topic_type: Heuristic
true_statement: After a team rates several options, plot risk against benefit; if liked options score low risk and high benefit and disliked ones the reverse, in a tight inverse pattern, revisit the ratings.
false_statement: After a team rates several options, plot risk against benefit; if high-benefit options also score high risk, in a tight positive pattern, revisit the ratings.
explanation: A shared feeling pushes perceived risk and benefit in opposite directions, so a tight inverse pattern suggests one impression did the work of two assessments. In reality high-payoff options often carry more risk, so a positive pattern is not itself a warning sign.
