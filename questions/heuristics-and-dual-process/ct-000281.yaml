true_statement: Efendić and colleagues' 2022 replications reproduced the inverse risk-benefit link, except that information lowering a technology's benefits did not raise its judged risk.
false_statement: Efendić and colleagues' 2022 replications reproduced the inverse risk-benefit link, except that information raising a technology's benefits did not lower its judged risk.
explanation: 'The coupling replicated strongly, but only some directions of the manipulation did: lowering benefits left risk judgments unmoved. The replication also could not show that affect is the mediator, which is why the status is mixed.'
