id: ct-000327
area: heuristics-and-dual-process
kind: scenario
topic: Fast-and-frugal heuristics
topic_type: Framework
true_statement: Choosing between two job applicants, a recruiter checks cues in order of how well each has predicted success in the past and picks whoever is ahead on the first cue where they differ, ignoring the rest. That is a one-reason rule like Take The Best.
false_statement: Choosing between two job applicants, a recruiter checks cues in order of how well each has predicted success in the past and picks whoever is ahead on the first cue where they differ, ignoring the rest. That is a weighted-additive rule like multiple regression.
explanation: Ordered search, a stop at the first discriminating cue and a choice on that cue alone are the search, stopping and decision rules of Take The Best. A weighted-additive model would look up every cue, weight each and add them up before deciding.
