id: ct-000328
area: heuristics-and-dual-process
kind: counter
topic: Fast-and-frugal heuristics
topic_type: Framework
true_statement: When many weak cues jointly carry the signal, prefer a weighted model to a one-reason rule, since a rule that stops at the first cue can miss what they add up to.
false_statement: When many weak cues jointly carry the signal, prefer a one-reason rule to a weighted model, since ignoring the weak cues is what protects a rule from overfitting.
explanation: Simple rules shine when data are scarce and a few strong cues dominate; they lose when the information is spread thinly across many cues. Overfitting is a reason to test any model on new cases, not a licence to discard a signal that only shows up in combination.
