true_statement: Pohl's 2011 review of the recognition-heuristic debate found that less-is-more effects, where knowing less yields better inferences, are scarce and small in real people.
false_statement: Pohl's 2011 review of the recognition-heuristic debate found that less-is-more effects, where knowing less yields better inferences, are common and large in real people.
explanation: Less-is-more is well supported in simulations, but the review found it rare and weak in human data. That gap between the normative result and the descriptive claim is why the program's status is contested.
