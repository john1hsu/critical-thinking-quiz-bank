kind: scenario
topic: Satisficing
topic_type: Heuristic
true_statement: A hiring manager interviews applicants as they come in and offers the role to the first one who meets all four of her written must-haves, without waiting to compare the whole pool. She is satisficing.
false_statement: A hiring manager interviews applicants as they come in and offers the role to the first one who meets all four of her written must-haves, without waiting to compare the whole pool. She is maximizing.
explanation: 'The tell is the stop rule: search ends at the first option that clears a preset bar. Maximizing would mean comparing all the options and choosing the best, which is exactly what she skips.'
