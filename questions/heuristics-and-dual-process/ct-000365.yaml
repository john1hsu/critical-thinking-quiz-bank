area: heuristics-and-dual-process
kind: counter
topic: Satisficing
topic_type: Heuristic
true_statement: To satisfice deliberately, write the must-haves down before searching and decide in advance what would justify raising or lowering the bar.
false_statement: To satisfice deliberately, let the first few options you see set the must-haves, and adjust the bar to whatever they happen to offer.
explanation: Because the outcome depends on the aspiration level, a bar fixed by whichever options turn up first means "good enough" is decided by chance. Setting criteria and adjustment rules beforehand keeps the stop rule honest.
