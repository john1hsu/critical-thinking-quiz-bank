true_statement: A buyer's habit of choosing the best-known supplier served well for years, then starts failing after a wave of heavily advertised newcomers. Ecological rationality says to check first whether the environment changed.
false_statement: A buyer's habit of choosing the best-known supplier served well for years, then starts failing after a wave of heavily advertised newcomers. Ecological rationality says the failure shows the habit was irrational all along.
explanation: A heuristic is smart only where its cue tracks the outcome; recognition worked while fame went with quality. Heavy advertising breaks that link, so the right diagnosis is a changed environment, and the remedy is to re-check the fit rather than condemn rules of thumb wholesale.
