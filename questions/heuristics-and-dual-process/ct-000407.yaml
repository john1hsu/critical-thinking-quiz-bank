id: ct-000407
area: heuristics-and-dual-process
kind: counter
topic: Ecological rationality
topic_type: Concept
true_statement: Before trusting a rule of thumb for forecasts, test it on new cases rather than judging it by how well it fits the past cases it was built from.
false_statement: Before trusting a rule of thumb for forecasts, judge it by how well it fits the past cases it was built from rather than spending effort testing it on new cases.
explanation: Flexible models can fit past data closely yet predict new cases badly, which is overfitting; simple rules often win on prediction precisely because they don't chase noise. Only out-of-sample performance shows whether a rule fits its environment.
