true_statement: Hilbig and Richter's reanalysis of recognition data found that most individual participants did not behave like consistent one-reason heuristic users.
false_statement: Hilbig and Richter's reanalysis of recognition data found that nearly every individual participant relied on recognition alone, as consistent one-reason heuristic users would.
explanation: Separating recognition use from use of other knowledge lowered estimated reliance on recognition, and few people looked like pure one-reason users. That is why the descriptive side of ecological rationality is contested even though the fit argument is well supported.
