topic: Attribute substitution
topic_type: Framework
true_statement: A hiring panel asked how well a candidate will perform over three years ends up scoring how impressive the interview presentation was, and feels it answered the question. That is attribute substitution.
false_statement: A hiring panel asked how well a candidate will perform over three years ends up scoring how impressive the interview presentation was, and feels it answered the question. That is the availability heuristic.
explanation: A hard target (future performance) was quietly replaced by an easier, accessible attribute (presentation polish). Availability is the narrower case where ease of recall stands in for frequency, and nobody here is recalling examples.
