topic: Attribute substitution
topic_type: Framework
true_statement: To help a team catch an attribute substitution, make the neglected factor, such as the base rate, explicit and salient; time pressure and a good mood make an unchecked swap more likely.
false_statement: To help a team catch an attribute substitution, make the neglected factor, such as the base rate, explicit and salient; time pressure and a good mood make an unchecked swap less likely.
explanation: Deliberate checking of intuitive answers is light, so it helps to put the ignored quantity in plain view. Time pressure, concurrent load and good mood weaken that checking rather than strengthen it.
