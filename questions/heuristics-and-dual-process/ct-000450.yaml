true_statement: Shah and Oppenheimer's 2008 review called attribute substitution a partial account of heuristics, since it misses other effort savings such as examining fewer alternatives.
false_statement: Shah and Oppenheimer's 2008 review called attribute substitution a partial account of heuristics, since it misses other effort savings such as relying on easy-to-access cues.
explanation: Reliance on accessible cues is exactly what substitution does explain; the gap the review pointed to was other shortcuts, like considering fewer options or simplifying cue weights. That critique is why the model's status is mixed.
