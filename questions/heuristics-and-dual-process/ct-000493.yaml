kind: scenario
topic: Recognition heuristic
topic_type: Heuristic
true_statement: Choosing between two cloud vendors for a pilot, an officer has heard of only one, and only because of its widely reported outage. Picking it by name recognition is a poor bet here, since that familiarity isn't linked to reliability.
false_statement: Choosing between two cloud vendors for a pilot, an officer has heard of only one, and only because of its widely reported outage. Picking it by name recognition is a sound bet here, since any familiarity tracks reliability.
explanation: The recognition heuristic works only when recognition correlates with the criterion. Familiarity that comes from a bad event is unrelated or even opposed to reliability, so the key question is why the name is familiar.
