area: heuristics-and-dual-process
kind: counter
topic: Recognition heuristic
topic_type: Heuristic
true_statement: If you already hold conclusive knowledge about the criterion, such as both vendors' audited uptime, use it rather than which name you recognise, since the recognition heuristic was never meant for that case.
false_statement: If you already hold conclusive knowledge about the criterion, such as both vendors' audited uptime, still go by which name you recognise, since the recognition heuristic was meant to override that knowledge.
explanation: Recognition is a stand-in for missing knowledge, a cue for inference from memory when better information is absent. With conclusive facts in hand, the heuristic's own authors say it does not apply.
