true_statement: In 2016 experiments with fictitious city names, 74% of choices followed recognition against 50% by chance, yet people still weighed other information they had.
false_statement: In 2016 experiments with fictitious city names, 74% of choices followed recognition against 50% by chance, and people ignored all other information once recognition discriminated.
explanation: Basehore and Anderson found recognition a real basis for choice but not a strictly one-reason rule, arguing raw adherence rates overstate its sole influence. That is why the noncompensatory claim remains contested.
