true_statement: 'Don''t judge how reflective one job applicant is from their three-item CRT score: floor effects and limited reliability make the test better suited to comparing groups.'
false_statement: 'Judge how reflective one job applicant is from their three-item CRT score: its free-response format makes the test reliable enough for individual decisions.'
explanation: With only three items and scores bunched at zero in naive samples, one person's score is noisy. Its research value lies in group comparisons, and prior exposure to the well-known items can raise scores further.
