true_statement: Attali and Bar-Hillel (2020) found that ordinary maths items without tempting lures predicted reasoning tasks about as well as CRT items, suggesting the CRT is first of all a maths test.
false_statement: Attali and Bar-Hillel (2020) found that CRT items predicted reasoning tasks far better than ordinary maths items, confirming that the CRT measures reflection apart from maths ability.
explanation: A single maths-ability factor fitted as well as a separate reflection factor, and the two correlated at about .90 or more. The CRT predicts well, but whether it measures reflection rather than numeracy is contested.
