true_statement: A board approves a project described as having "a 70% chance of success" more readily than one with "a 30% chance of failure", though the odds are identical. Tversky's work calls this a framing effect.
false_statement: A board approves a project described as having "a 70% chance of success" more readily than one with "a 30% chance of failure", though the odds are identical. Tversky's work calls this the conjunction fallacy.
explanation: Framing is when logically equivalent descriptions lead to different choices. The conjunction fallacy is judging 'A and B' more probable than A alone, as in the Linda studies.
