true_statement: In Tversky and Kahneman's prospect theory, people tend to be risk-averse for sure gains and risk-seeking for sure losses.
false_statement: In Tversky and Kahneman's prospect theory, people tend to be risk-seeking for sure gains and risk-averse for sure losses.
explanation: Prospect theory evaluates outcomes as gains and losses from a reference point, with losses weighing more than equal gains. People lock in a sure gain but gamble to avoid a sure loss.
