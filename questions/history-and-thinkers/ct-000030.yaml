true_statement: In one version of the 1983 Linda studies, 85% of 142 undergraduates ranked "bank teller and feminist" as more probable than "bank teller".
false_statement: In one version of the 1983 Linda studies, 35% of 142 undergraduates ranked "bank teller and feminist" as more probable than "bank teller".
explanation: A large majority broke the rule that a conjunction can't be more probable than either part, because the description resembled a feminist. That 1983 result is the classic demonstration of the conjunction fallacy.
