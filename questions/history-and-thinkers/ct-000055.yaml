true_statement: Aristotle never called his work "logic"; ancient commentators later gathered six of his treatises into the Organon, Greek for "tool".
false_statement: Aristotle himself gathered six of his treatises into a single book and titled it Logic, meaning a branch of philosophy in its own right.
explanation: The Organon was a later compilation, and its name reflects the view that logic is an instrument for inquiry rather than a part of it. Aristotle neither assembled it nor used the word "logic" for his work.
