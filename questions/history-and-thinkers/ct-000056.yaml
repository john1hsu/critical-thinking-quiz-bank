true_statement: In Sophistical Refutations, Aristotle put equivocation among the fallacies that depend on language and begging the question among those that do not.
false_statement: In Sophistical Refutations, Aristotle put begging the question among the fallacies that depend on language and equivocation among those that do not.
explanation: Equivocation trades on a word's double meaning, so it is a fallacy of language; begging the question, false cause and affirming the consequent fail regardless of wording. The split is six language-dependent fallacies and seven others.
