true_statement: For Aristotle, dialectical argument in the Topics differs from scientific demonstration in its premises, which are widely accepted opinions, not in its logical form.
false_statement: For Aristotle, dialectical argument in the Topics differs from scientific demonstration in its logical form, not in its premises, which are the same in both.
explanation: Both can be deductions of the same shape; what changes is the starting point. Dialectic argues from what is commonly accepted, whereas demonstration needs premises that are known to be true.
