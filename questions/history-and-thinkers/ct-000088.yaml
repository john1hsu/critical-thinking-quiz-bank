topic: Chrysippus
topic_type: Person
true_statement: A memo says, "Either the audit is on site or it is remote." Learning it is on site, a planner concludes it is not remote. That step is safe only if the "or" is exclusive, as Chrysippus required of disjunctions.
false_statement: A memo says, "Either the audit is on site or it is remote." Learning it is on site, a planner concludes it is not remote. That step is safe whether the "or" is exclusive or inclusive, as Chrysippus held of disjunctions.
explanation: 'This is the fourth indemonstrable: from "either p or q" and p, infer not-q. If the "or" allowed both (a hybrid audit), learning one disjunct says nothing about the other, so check what kind of "or" the premise means.'
