true_statement: Chrysippus built a logic of whole statements joined by "if", "or", "and" and "not", whereas Aristotle's was a logic of terms such as "all" and "some".
false_statement: Aristotle built a logic of whole statements joined by "if", "or", "and" and "not", whereas Chrysippus's was a logic of terms such as "all" and "some".
explanation: That contrast is why Chrysippus counts among the first to organise propositional logic. Aristotle's syllogistic works with the relations between classes inside statements.
