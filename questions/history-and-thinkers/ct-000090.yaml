true_statement: Chrysippus counted a conditional true only if the denial of its consequent conflicts with its antecedent, a stricter, connection-based test than Philo's.
false_statement: Philo counted a conditional true only if the denial of its consequent conflicts with its antecedent, a stricter, connection-based test than Chrysippus's.
explanation: Philo's conditional was false only when the antecedent was true and the consequent false, much like today's material conditional. Chrysippus demanded a real link between the parts, which scholars compare to relevance logic.
