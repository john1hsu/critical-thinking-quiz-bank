true_statement: A purchasing director feels certain a new supplier will still be reliable in five years. By Kahneman and Klein's conditions, that gut feeling needs an explicit check, because long-range calls give little quick, regular feedback.
false_statement: A purchasing director feels certain a new supplier will still be reliable in five years. By Kahneman and Klein's conditions, that gut feeling can be trusted, because her strong confidence is good evidence she is right.
explanation: Intuition earns trust only in a regular, predictable environment where the expert has practised with feedback, like a nurse spotting deterioration. Kahneman and Klein stress that feeling confident is no evidence of being right.
