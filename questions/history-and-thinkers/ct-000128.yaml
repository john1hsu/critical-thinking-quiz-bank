true_statement: In a 1993 cold-water experiment, 22 of 32 students chose to repeat the longer trial, which ended with slightly warmer water but contained strictly more discomfort.
false_statement: In a 1993 cold-water experiment, only 10 of 32 students chose to repeat the longer trial, preferring the shorter one that contained strictly less discomfort.
explanation: Most preferred the longer trial because memory tracked the worst moment and the ending, not the total. That peak-end pattern, with neglect of duration, became the basis of Kahneman's work on well-being.
