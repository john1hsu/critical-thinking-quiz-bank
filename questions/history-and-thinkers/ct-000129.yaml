true_statement: After a 2012 failed replication of an old-age priming study, Kahneman urged priming researchers to run chains of cross-lab replications with shared data.
false_statement: After a 2012 failed replication of an old-age priming study, Kahneman defended the priming research and argued that cross-lab replications were unnecessary.
explanation: His open letter warned of a coming "train wreck" and called for advance commitment to publish results. Readers of Thinking, Fast and Slow should treat its priming chapter with caution, while his core work on heuristics and framing stands.
