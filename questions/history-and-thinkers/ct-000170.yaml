topic: Posterior Analytics
topic_type: Work
true_statement: A manager says the vendor's tool is reliable because its documentation says so, and the documentation can be trusted because the tool is reliable. The Posterior Analytics would reject this as a circular proof that establishes nothing.
false_statement: A manager says the vendor's tool is reliable because its documentation says so, and the documentation can be trusted because the tool is reliable. The Posterior Analytics would accept this, since a proof may run in a circle if each step is valid.
explanation: Aristotle requires each premise to be prior to and better known than what it proves; in a circle the conclusion secretly supports itself. He explicitly rejected the view that everything can be proved by circular demonstration.
