true_statement: In Book II of the Posterior Analytics, asking why something is so amounts to asking for the middle term of a deduction, because the middle term names the cause.
false_statement: In Book II of the Posterior Analytics, asking why something is so amounts to asking for the conclusion of a deduction, because the conclusion names the cause.
explanation: In a syllogism the middle term links the other two terms, and Aristotle identifies that link with the cause, as in asking what makes the moon eclipsed. The conclusion states the fact to be explained, not its cause.
