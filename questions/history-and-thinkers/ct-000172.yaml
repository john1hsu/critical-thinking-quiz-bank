true_statement: The Prior Analytics asks when a conclusion follows from premises, while the Posterior Analytics asks when such a deduction amounts to knowing the conclusion.
false_statement: The Posterior Analytics asks when a conclusion follows from premises, while the Prior Analytics asks when such a deduction amounts to knowing the conclusion.
explanation: 'The Posterior Analytics adds conditions on top of correct form: premises that are true, primary and explanatory. That split between following and knowing is the ancestor of the valid-versus-sound distinction.'
