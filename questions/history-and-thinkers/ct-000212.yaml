topic: Stephen Toulmin
topic_type: Person
true_statement: A facilities manager argues against renewing an office lease because sensors show desks in use 30% of the time. A Toulmin-style review asks what warrant and property-management backing link low use to non-renewal, rather than faulting it for not being a valid deduction.
false_statement: A facilities manager argues against renewing an office lease because sensors show desks in use 30% of the time. A Toulmin-style review rejects the argument because the conclusion doesn't follow necessarily from the occupancy data.
explanation: Toulmin attacked the idea that serious arguments must be recast as formal deductions. He judged practical arguments by their warrants, backing and possible rebuttals, using the standards of the field they belong to.
