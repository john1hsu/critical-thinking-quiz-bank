true_statement: Toulmin held that the layout of an argument is the same in every field, while the standards for appraising it vary from field to field.
false_statement: Toulmin held that the standards for appraising an argument are the same in every field, while its layout varies from field to field.
explanation: Data, warrant, backing, qualifier, rebuttal and claim appear everywhere, but what counts as good backing differs in law, medicine or science. That field-dependence is also the source of the charge that his view slides into relativism.
