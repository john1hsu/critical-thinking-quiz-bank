true_statement: To test an argument's validity in Tarski's sense, keep logical words like "all" and "so" fixed and reinterpret the content words; if some reading makes the premises true and the conclusion false, it is invalid.
false_statement: To test an argument's validity in Tarski's sense, keep the content words fixed and reinterpret logical words like "all" and "so"; if some reading makes the premises true and the conclusion false, it is invalid.
explanation: Tarski's model-based test varies the interpretation of the non-logical vocabulary while the logical words stay put, so validity turns on form alone. Reinterpreting "all" or "so" would change the argument's form rather than test it.
