topic: Alfred Tarski
topic_type: Person
true_statement: To avoid the liar paradox, Tarski defined truth for an object language inside a separate, richer metalanguage.
false_statement: To avoid the liar paradox, Tarski defined truth for a language inside that same language, provided it was strong enough to express arithmetic.
explanation: Tarski split the language being described from the richer metalanguage that defines its truth, and proved that a language strong enough for arithmetic cannot define its own truth. Self-reference of that kind is what the liar paradox exploits.
