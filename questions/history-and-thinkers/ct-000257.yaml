true_statement: Etchemendy argues that Tarski's account of logical consequence misses its necessity, since whether an argument counts as valid can depend on how many objects exist.
false_statement: Etchemendy argues that Tarski's account of logical consequence misses its necessity, since whether an argument counts as valid can depend on whether its premises are actually true.
explanation: Etchemendy's worry is that validity defined over models can hinge on the size of the universe, a fact about the world rather than about logic. Whether the premises are actually true never bears on validity in Tarski's account, so that is not his complaint.
