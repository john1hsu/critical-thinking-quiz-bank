true_statement: Francis Bacon named his 1620 Novum Organum after Aristotle's collection to replace it, complaining that the syllogism leaps from a few particulars to the most general axioms.
false_statement: Francis Bacon named his 1620 Novum Organum after Aristotle's collection to replace it, complaining that the syllogism creeps too slowly from particulars before reaching general axioms.
explanation: 'Bacon''s objection was hastiness: the syllogism jumps to sweeping axioms from little evidence. His remedy was a gradual, eliminative induction using tables of presence, absence and degrees, the opposite of a call for bolder leaps.'
