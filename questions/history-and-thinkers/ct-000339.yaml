true_statement: 'A manager argues: "No temp staff can sign purchase orders. Every department head can sign purchase orders. So no department head is temp staff." Aristotle would class this as a second-figure, imperfect deduction, because the middle term is the predicate of both premises.'
false_statement: 'A manager argues: "No temp staff can sign purchase orders. Every department head can sign purchase orders. So no department head is temp staff." Aristotle would class this as a first-figure, perfect deduction, because it needs nothing beyond its premises.'
explanation: Figures are sorted by where the middle term sits, and with "can sign purchase orders" as both predicates this is the second figure, so it is imperfect. Converting the first premise to "nothing that can sign is temp staff" turns it into the perfect first-figure Celarent.
