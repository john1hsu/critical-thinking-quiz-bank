topic: Prior Analytics
topic_type: Work
true_statement: When a colleague tries to refute your assumption by deriving something absurd from it, check that the absurd result really depends on that assumption; if not, the refutation fails, as the Prior Analytics warns.
false_statement: When a colleague tries to refute your assumption by deriving something absurd from it, check only that the result is truly absurd, since an absurdity counts against every assumption used in reaching it.
explanation: Book II's original "false cause" objection says a reduction to the impossible only discredits the assumption that actually produces the absurdity. If the absurd result would follow from the other premises anyway, your assumption hasn't been shown false.
