true_statement: In the early 1970s John Corcoran and Timothy Smiley independently read the Prior Analytics as a natural-deduction system, against Jan Łukasiewicz's 1951 axiomatic reading.
false_statement: In the early 1970s John Corcoran and Timothy Smiley independently read the Prior Analytics as an axiomatic system, against Jan Łukasiewicz's 1951 natural-deduction reading.
explanation: Łukasiewicz treated the perfect moods as axioms; Corcoran and Smiley saw instead a system of direct and indirect proofs, and Corcoran noted that Aristotle never calls a perfect deduction an axiom.
