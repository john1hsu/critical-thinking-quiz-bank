true_statement: Pitching a four-day week to all staff, a manager says "fairness means rewarding results, not hours", splitting real productivity from mere busyness. In The New Rhetoric's typology, that move is a dissociation.
false_statement: Pitching a four-day week to all staff, a manager says "fairness means rewarding results, not hours", splitting real productivity from mere busyness. In The New Rhetoric's typology, that move is a quasi-logical argument.
explanation: Dissociation breaks one concept into two, typically appearance versus reality, as with apparent versus real productivity. A quasi-logical argument instead borrows the look of formal or mathematical proof, which this slogan does not.
