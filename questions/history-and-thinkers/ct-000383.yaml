true_statement: To check whether a pitch only persuades the people in the room, test it against what Perelman and Olbrechts-Tyteca call the universal audience, an imagined gathering of reasonable people.
false_statement: To check whether a pitch only persuades the people in the room, test it against what Perelman and Olbrechts-Tyteca call a particular audience, the actual group being addressed.
explanation: Winning over the actual listeners is persuading a particular audience, so testing against them can't reveal mere persuasion. Asking whether every reasonable listener would accept the case is the book's yardstick for convincing.
