true_statement: In writing The New Rhetoric, Chaïm Perelman supplied most of the theoretical framework and Lucie Olbrechts-Tyteca most of the examples, gathered from real arguments.
false_statement: In writing The New Rhetoric, Lucie Olbrechts-Tyteca supplied most of the theoretical framework and Chaïm Perelman most of the examples, gathered from real arguments.
explanation: The usual account of their collaboration gives Perelman the framework and Olbrechts-Tyteca the large stock of examples from law, politics and literature, though they wrote the book together. The false version swaps the roles.
