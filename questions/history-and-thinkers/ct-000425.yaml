kind: counter
topic: Topics
topic_type: Work
true_statement: Refuting a colleague's thesis from premises she herself conceded shows her position is inconsistent, but on the Topics' account it does not by itself prove the opposite thesis true.
false_statement: Refuting a colleague's thesis from premises she herself conceded shows her position is inconsistent, and on the Topics' account it thereby proves the opposite thesis true.
explanation: Dialectic works from what the other side grants, so it shows what follows from their concessions, not what is true. Before treating a won debate as a settled fact, check whether the conceded premises are themselves true.
