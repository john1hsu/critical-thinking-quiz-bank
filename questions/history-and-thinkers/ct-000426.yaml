true_statement: 'Book I of the Topics sorts every predication into four predicables: definition, property, genus and accident.'
false_statement: 'Book I of the Topics sorts every predication into five predicables: definition, property, genus, species and accident.'
explanation: Aristotle's own list has four. Porphyry and later commentators expanded it to five, which is why the five-item version is familiar but not what the Topics says.
