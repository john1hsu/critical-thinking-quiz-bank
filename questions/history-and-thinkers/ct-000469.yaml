true_statement: In the preface to his Treatise on Light, Huygens held that a theory is best supported when it foresees new phenomena that are later confirmed, more than when it merely fits facts already known.
false_statement: In the preface to his Treatise on Light, Huygens held that a theory is best supported when it fits many facts already known, more than when it foresees new phenomena that are later confirmed.
explanation: Huygens gave novel predictions extra weight, alongside the idea that many matching consequences raise a theory's probability. Fitting known facts is easier, since a theory can be shaped around them.
