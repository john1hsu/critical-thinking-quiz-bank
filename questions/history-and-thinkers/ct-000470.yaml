topic: Christiaan Huygens
topic_type: Person
true_statement: Testing a hypothesis Huygens's way, if a predicted consequence fails you still have to ask which of the theory's assumptions is at fault, a question his account leaves open.
false_statement: Testing a hypothesis Huygens's way, if a predicted consequence fails you can blame the main hypothesis itself, a question his account settles.
explanation: Jeffrey noted that Huygens showed how agreement raises probability but not how much, nor what to blame when a prediction fails. That gap is the holism problem the Duhem-Quine thesis presses.
