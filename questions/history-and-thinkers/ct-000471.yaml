topic: Christiaan Huygens
topic_type: Person
true_statement: Huygens introduced mathematical expectation in his 1657 tract on games of chance, often called the first book on mathematical probability.
false_statement: Huygens introduced mathematical expectation in his 1690 Treatise on Light, often called the first book on mathematical probability.
explanation: Expectation came from the short 1657 tract De ratiociniis in ludo aleae, later reprinted by Jakob Bernoulli. The Treatise on Light is the optics work whose preface states his method of testing hypotheses.
