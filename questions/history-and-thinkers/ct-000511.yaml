true_statement: The Scottish philosopher James Frederick Ferrier introduced the word "epistemology" into English in his Institutes of Metaphysic of 1854.
false_statement: The Scottish philosopher William Hamilton introduced the word "epistemology" into English in his Institutes of Metaphysic of 1854.
explanation: Ferrier coined the English term as the first part of his Institutes, the theory of knowing. Hamilton was his friend and mentor, whose blend of Reid and Kant Ferrier later rejected.
