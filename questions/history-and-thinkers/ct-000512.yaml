topic: James Frederick Ferrier
topic_type: Person
true_statement: Applying Ferrier's theory of ignorance to a project's list of unknowns, treat gaps that evidence could close as real ignorance, and reframe questions posed so that no answer could ever count.
false_statement: Applying Ferrier's theory of ignorance to a project's list of unknowns, treat questions posed so that no answer could ever count as the deepest ignorance, and research them first.
explanation: For Ferrier we can be ignorant only of what could in principle be known. A gap like never having asked churned customers why they left is real ignorance; a question no evidence could settle needs rewording, not research.
