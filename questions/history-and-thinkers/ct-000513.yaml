topic: James Frederick Ferrier
topic_type: Person
true_statement: Ferrier held that whatever we know, we also know ourselves as knowing it, so the smallest unit of knowledge is the object together with the knowing subject.
false_statement: Ferrier held that whatever we know, we know independently of ourselves as knowers, so the smallest unit of knowledge is the object alone, apart from any subject.
explanation: Ferrier's first principle is that knowing includes self-knowing, so subject and object always come together. Splitting them apart is the move he blamed for Thomas Reid's errors.
