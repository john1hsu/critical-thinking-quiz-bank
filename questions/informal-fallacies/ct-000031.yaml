id: ct-000031
area: informal-fallacies
kind: scenario
topic: Straw man fallacy
topic_type: InformalFallacy
true_statement: A teammate suggests cutting the weekly status meeting to 30 minutes. A manager replies that abolishing meetings would leave everyone uninformed. The reply is a straw man.
false_statement: A teammate suggests cutting the weekly status meeting to 30 minutes. A manager replies that abolishing meetings would leave everyone uninformed. The reply is a red herring.
explanation: 'The manager attacks a stronger claim than the one made: a shorter meeting has become no meetings. Misstating the opponent''s position is the mark of a straw man; a red herring changes the subject rather than distorting the claim.'
