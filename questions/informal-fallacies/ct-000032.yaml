topic: Straw man fallacy
topic_type: InformalFallacy
true_statement: A good test for a straw man is asking whether the other side would recognise the description as their own position, stated in their own terms.
false_statement: A good test for a straw man is asking whether the critic's conclusion seems believable, since a straw man always ends in an implausible conclusion.
explanation: The fallacy lies in the mismatch between what is refuted and what was claimed, so the check is a comparison with what the other side actually said. A straw man's conclusion can be quite plausible.
