id: ct-000033
area: informal-fallacies
kind: definition
topic: Straw man fallacy
topic_type: InformalFallacy
true_statement: A weak man picks an opponent's weakest actual argument, refutes it, and implies the whole case has fallen.
false_statement: A weak man invents a position, attributes it to a vague "some people", and refutes that instead of anything argued.
explanation: 'Aikin and Casey separate three forms: the representational straw man restates a view in weaker form, the weak man targets the weakest real argument, and the hollow man is the invented position attributed to unnamed people.'
