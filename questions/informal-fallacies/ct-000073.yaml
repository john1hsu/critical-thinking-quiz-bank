id: ct-000073
area: informal-fallacies
kind: scenario
topic: Tu quoque
topic_type: InformalFallacy
true_statement: The office manager asks staff to stop printing drafts to cut paper costs. A staffer replies that she prints all her own emails, so the request can be ignored. The reply is a tu quoque.
false_statement: The office manager asks staff to stop printing drafts to cut paper costs. A staffer replies that she prints all her own emails, so the request can be ignored. The reply is a straw man.
explanation: The staffer accurately states the request but rejects it because the manager doesn't follow it, the mark of a tu quoque. A straw man would misdescribe the request, say as a ban on all printing; whether drafts waste paper doesn't depend on the manager's habits.
