topic: Tu quoque
topic_type: InformalFallacy
true_statement: In 2017 experiments, people judged hypocrites more harshly than people who lied directly about their own behaviour, yet hypocrites who openly admitted the lapse weren't judged negatively.
false_statement: In 2017 experiments, people judged direct liars more harshly than hypocrites, and hypocrites who openly admitted the lapse were judged even more negatively.
explanation: 'Jordan and colleagues explain this with false signalling: condemning a wrong implies you avoid it, so the hypocrite misleads. Admitting the lapse removes the false signal, which is why owning up blunts a tu quoque.'
