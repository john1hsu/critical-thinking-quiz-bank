topic: False dilemma
topic_type: InformalFallacy
true_statement: '"Either we move every client to the new CRM this month or we''re stuck on spreadsheets for good. We can''t move everyone this month, so we''re stuck." The flaw lies in the either-or premise, not in the inference.'
false_statement: '"Either we move every client to the new CRM this month or we''re stuck on spreadsheets for good. We can''t move everyone this month, so we''re stuck." The flaw lies in the inference, not in the either-or premise.'
explanation: 'Ruling out one of two alternatives to accept the other is the valid disjunctive-syllogism form. What fails is the premise: a phased migration or a pilot group are left off the menu, which is what makes it a false dilemma.'
