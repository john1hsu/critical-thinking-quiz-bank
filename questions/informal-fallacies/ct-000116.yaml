id: ct-000116
area: informal-fallacies
kind: counter
topic: False dilemma
topic_type: InformalFallacy
true_statement: Faced with "we must either cut costs or invest in growth," a good first question is whether the two options really exclude each other or could be pursued together.
false_statement: Faced with "we must either cut costs or invest in growth," a good first question is whether rejecting one option validly leads to the other, since that is where false dilemmas go wrong.
explanation: Checking whether options are exhaustive and mutually exclusive targets the premise, where the fault lies. The inference from an either-or premise is valid, so testing it won't expose anything.
