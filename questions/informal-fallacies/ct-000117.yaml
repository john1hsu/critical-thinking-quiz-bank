false_statement: In 2022 experiments, a roughly 90-second prebunking video on false dichotomies improved recognition of the technique with an effect of d = 0.13, the smallest of five videos tested.
explanation: Roozenbeek and colleagues found the false-dichotomy video had the biggest recognition effect in the lab. The small 0.13 figure belongs to the later YouTube field test, measured as h, not to the lab experiment.
