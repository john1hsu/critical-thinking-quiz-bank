area: informal-fallacies
kind: scenario
topic: Informal fallacy
topic_type: Concept
true_statement: In a design review, a lead says a database will scale because the principal architect says so, though the architect is a networking specialist and other database experts disagree. In this context the appeal to expertise is fallacious.
false_statement: In a design review, a lead says a database will scale because the principal architect says so, though the architect is a networking specialist and other database experts disagree. In this context the appeal to expertise is a reasonable one.
explanation: 'An appeal to expert opinion can be sound, so the verdict turns on context: here the cited expert lacks expertise in the field and other experts disagree. Those are exactly the conditions that turn a reasonable appeal into a fallacious one.'
