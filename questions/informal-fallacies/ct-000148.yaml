true_statement: C. L. Hamblin's 1970 book Fallacies attacked the textbook "standard treatment" of fallacies and is usually taken as the start of modern fallacy theory.
false_statement: Irving Copi's 1961 textbook attacked the "standard treatment" of fallacies and is usually taken as the start of modern fallacy theory.
explanation: Copi's 1961 textbook supplied the standard list that Hamblin later criticised as dogmatic. Hamblin's critique pushed the field toward the rules of dialogue, which is why it marks the modern turn.
