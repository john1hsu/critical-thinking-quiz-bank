id: ct-000197
area: informal-fallacies
kind: scenario
topic: Ad hominem
topic_type: InformalFallacy
true_statement: A product manager proposes a simpler checkout flow, backed by usability test results. A colleague replies, "She's only been here three months, so we can ignore this." The reply is an ad hominem.
false_statement: A product manager proposes a simpler checkout flow, backed by usability test results. A colleague replies, "She's only been here three months, so we can ignore this." The reply is a red herring.
explanation: The reply rejects the proposal because of a feature of the person, while leaving the test results untouched. A red herring changes the subject to a different issue; here the attack is aimed squarely at the arguer.
