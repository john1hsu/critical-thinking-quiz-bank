id: ct-000198
area: informal-fallacies
kind: counter
topic: Ad hominem
topic_type: InformalFallacy
true_statement: When a claim rests on someone's testimony, a documented conflict of interest is a fair reason for caution, and the remedy is to look for independent confirmation.
false_statement: When a claim rests on someone's testimony, a documented conflict of interest is enough on its own to conclude that the claim is false.
explanation: Bias can reasonably lower how much weight we give a speaker's say-so, but it doesn't show the claim is wrong. The fallacy lies in the leap from "may be biased" to "is false".
