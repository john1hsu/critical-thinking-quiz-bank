true_statement: In 2018 experiments, alleging that a scientist had a financial conflict of interest lowered acceptance of their claim about as much as criticising the study's methods did.
false_statement: In 2018 experiments, alleging that a scientist had a financial conflict of interest had no reliable effect on acceptance of their claim, unlike criticising the study's methods.
explanation: Conflict-of-interest and fraud allegations swayed people roughly as much as a methods critique. It was attacks on education or a reputation for sloppiness that showed no reliable effect.
