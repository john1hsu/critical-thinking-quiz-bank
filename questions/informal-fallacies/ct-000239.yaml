kind: scenario
topic: Begging the question
topic_type: InformalFallacy
true_statement: A director says a colleague's expansion plan should be rejected because it is "a reckless gamble", and offers no other reason. The loaded label begs the question.
false_statement: A director says a colleague's expansion plan should be rejected because it is "a reckless gamble", and offers no other reason. The loaded label is a straw man.
explanation: 'Calling the plan reckless already assumes it should be rejected, so the premise smuggles in the conclusion: a question-begging epithet. A straw man would restate the colleague''s plan in a distorted form and attack that instead.'
