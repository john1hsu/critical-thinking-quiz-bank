topic: Begging the question
topic_type: InformalFallacy
true_statement: Hahn and Oaksford's Bayesian account treats a bare restatement of the conclusion as maximally weak, while allowing that some self-dependent arguments can still raise a hypothesis's probability.
false_statement: Hahn and Oaksford's Bayesian account treats every self-dependent argument as maximally weak, since none can raise a hypothesis's probability any more than a bare restatement does.
explanation: They note that accepted scientific inferences, such as reading electron tracks through the theory of electrons, share the self-dependent structure. A restatement changes no one's degree of belief, but other circular-looking arguments can.
