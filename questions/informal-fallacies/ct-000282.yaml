id: ct-000282
area: informal-fallacies
kind: scenario
topic: Post hoc ergo propter hoc
topic_type: InformalFallacy
true_statement: A homeowner starts a herbal supplement on the first day of a cold. Five days later the cold is gone, and she tells friends the supplement cured it, citing only that she got better after taking it. That is post hoc ergo propter hoc.
false_statement: A homeowner starts a herbal supplement on the first day of a cold. Five days later the cold is gone, and she tells friends the supplement cured it, citing only that she got better after taking it. That is cum hoc ergo propter hoc.
explanation: Her only evidence is the order of events, remedy first and recovery after, which is the mark of post hoc; colds clear up anyway, so improvement after treatment proves little. Cum hoc infers cause from things merely occurring together, not from one following the other.
