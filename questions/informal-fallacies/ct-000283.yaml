id: ct-000283
area: informal-fallacies
kind: counter
topic: Post hoc ergo propter hoc
topic_type: InformalFallacy
true_statement: To test a claim that a remedy works because people improved after taking it, ask how often people improve when they don't take it.
false_statement: To test a claim that a remedy works because people improved after taking it, ask how quickly people improved once they had taken it.
explanation: Only a comparison with cases where the supposed cause was absent shows whether it made any difference. How fast people recovered after the remedy is still before-and-after evidence, the very thing that cannot settle a post hoc claim.
