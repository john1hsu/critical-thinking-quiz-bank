id: ct-000330
area: informal-fallacies
kind: scenario
topic: Ignoratio elenchi
topic_type: InformalFallacy
true_statement: The decision is whether to open a second warehouse next year. A manager shows with sound figures that opening the first warehouse was a good call, and concludes the second should open. The argument is an ignoratio elenchi.
false_statement: The decision is whether to open a second warehouse next year. A manager shows with sound figures that opening the first warehouse was a good call, and concludes the second should open. The argument is a red herring.
explanation: The figures do establish a definite conclusion, that the first warehouse paid off, but not the one at issue, which is the tell of a wrong-conclusion fallacy. Walton reserves red herring for a diversion that reaches no definite alternative conclusion.
