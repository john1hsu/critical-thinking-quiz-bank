topic: Ignoratio elenchi
topic_type: InformalFallacy
true_statement: In On Sophistical Refutations, Aristotle suggests that every kind of apparent refutation can be traced to some failure to meet his definition of what a refutation is.
false_statement: In On Sophistical Refutations, Aristotle suggests that every kind of apparent refutation can be traced to some shift in the meaning of a word between premises and conclusion.
explanation: In Part 6 Aristotle reduces all apparent refutations to failures of his definition of refutation, which makes ignorance of refutation both one fallacy and a diagnosis of the rest. Shifts in word meaning cover only the fallacies that depend on language, not those outside it.
