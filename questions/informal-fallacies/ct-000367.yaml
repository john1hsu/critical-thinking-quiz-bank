id: ct-000367
area: informal-fallacies
kind: scenario
topic: Slippery slope
topic_type: InformalFallacy
true_statement: A manager refuses one team's request to work from home on Fridays, warning that other teams will want the same, then Mondays, until nobody comes in at all. With no support for each step, that is a fallacious slippery slope.
false_statement: A manager refuses one team's request to work from home on Fridays, warning that other teams will want the same, then Mondays, until nobody comes in at all. With no support for each step, that is a false dilemma.
explanation: The tell is a chain of asserted steps from a small move to a disaster, while management could plainly stop at any point. A false dilemma would instead squeeze the choice into two options; here the problem is the unsupported cascade.
