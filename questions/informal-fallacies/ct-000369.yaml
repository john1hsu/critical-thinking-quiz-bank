id: ct-000369
area: informal-fallacies
kind: evidence
topic: Slippery slope
topic_type: InformalFallacy
true_statement: Corner, Hahn and Oaksford found that the probability of the feared outcome strongly shaped how strong people judged a slippery slope argument, and saw much of its force as rational.
false_statement: Corner, Hahn and Oaksford found that the probability of the feared outcome barely affected how strong people judged a slippery slope argument, and saw much of its force as simple error.
explanation: Their Bayesian account predicts that a slope is more persuasive when its endpoint is more likely, and the experiments bore that out. That is why the useful question is how likely each step is, rather than dismissing every such argument as a fallacy.
