id: ct-000409
area: informal-fallacies
kind: scenario
topic: Hasty generalization
topic_type: InformalFallacy
true_statement: Three trade-show visitors and two support tickets ask for a dark mode, and a product manager concludes most customers want it and makes it next quarter's top priority. That is a hasty generalization.
false_statement: Three trade-show visitors and two support tickets ask for a dark mode, and a product manager concludes most customers want it and makes it next quarter's top priority. That is the fallacy of accident.
explanation: The manager leaps from five self-selected requests to a claim about the whole customer base, which is hasty generalization. The fallacy of accident runs the other way, misapplying a general rule to an unusual case.
