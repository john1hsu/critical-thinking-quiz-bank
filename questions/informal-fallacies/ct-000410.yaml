topic: Hasty generalization
topic_type: InformalFallacy
true_statement: 'Whether a quick generalization from a few cases is fallacious depends partly on the stakes: a hunch that''s fine for choosing a lunch spot can be reckless for a safety decision.'
false_statement: Whether a quick generalization from a few cases is fallacious depends only on the sample, so a hunch from a few cases is just as faulty for choosing a lunch spot as for a safety decision.
explanation: Walton and Gordon tie the fallacy to the standard of proof the setting demands. Low-stakes choices can run on thin evidence; when being wrong is costly, the same thin evidence is not enough, so raise the bar before acting.
