topic: Hasty generalization
topic_type: InformalFallacy
true_statement: A 2020 meta-analysis found that anecdotes outpersuade statistics when people are emotionally engaged, as with severe threats, while statistics win when engagement is low.
false_statement: A 2020 meta-analysis found that statistics outpersuade anecdotes when people are emotionally engaged, as with severe threats, while anecdotes win when engagement is low.
explanation: High emotional engagement tilts people toward vivid single stories, which helps explain how one memorable case turns into a general rule. That makes high-stakes, emotional topics exactly where to check for a proper sample.
