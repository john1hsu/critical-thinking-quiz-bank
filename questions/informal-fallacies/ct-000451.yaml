id: ct-000451
area: informal-fallacies
kind: scenario
topic: Amphiboly
topic_type: InformalFallacy
true_statement: A policy requires receipts "for meals and taxi fares over $25", and an employee concludes an $18 client lunch needs none, though finance meant every meal. Relying on the other way of grouping the phrase is amphiboly.
false_statement: A policy requires receipts "for meals and taxi fares over $25", and an employee concludes an $18 client lunch needs none, though finance meant every meal. Relying on the other way of grouping the phrase is equivocation.
explanation: Every word keeps its meaning; what shifts is whether "over $25" attaches to meals as well as taxis, a structural ambiguity. Equivocation needs a single word that changes meaning between premise and conclusion.
