id: ct-000452
area: informal-fallacies
kind: counter
topic: Amphiboly
topic_type: InformalFallacy
true_statement: To keep a rule from being read two ways, repeat the qualifier for each item, as in "meals of any amount; taxi fares over $25", and split long lists so only one grammatical structure is possible.
false_statement: To keep a rule from being read two ways, state the qualifier once at the end, as in "meals and taxi fares over $25", and merge items into one list so only one grammatical structure is possible.
explanation: Amphiboly feeds on lists and modifiers that can attach in more than one place. Repeating the qualifier and splitting the list removes the second parse, whereas one trailing qualifier over a merged list is exactly what creates it.
