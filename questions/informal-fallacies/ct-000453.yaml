topic: Amphiboly
topic_type: InformalFallacy
true_statement: William of Ockham's Summa Logicae defined amphiboly as a whole sentence with several senses although none of its individual terms is ambiguous.
false_statement: William of Ockham's Summa Logicae defined amphiboly as a single term with several senses although the sentence's grammatical structure is unambiguous.
explanation: Ockham located amphiboly in the structure of the whole sentence, giving rules for constructions that produce it. A single term with several senses is the mark of equivocation, the contrasting fallacy.
