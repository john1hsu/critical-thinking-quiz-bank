kind: scenario
topic: Equivocation
topic_type: InformalFallacy
true_statement: An analyst role requires "experience" with the reporting database, and a recruiter marks a candidate as qualified because they once did a one-hour vendor tutorial on it. The recruiter's reasoning is an equivocation.
false_statement: An analyst role requires "experience" with the reporting database, and a recruiter marks a candidate as qualified because they once did a one-hour vendor tutorial on it. The recruiter's reasoning is an amphiboly.
explanation: The single word "experience" shifts from sustained hands-on work in the requirement to any exposure at all in the note. Amphiboly would need a sentence whose grammar allows two parses, not one word with two senses.
