topic: Equivocation
topic_type: InformalFallacy
true_statement: Van Laar argued that equivocation on related senses of one word misleads more than on unrelated senses like "bank", since a broad reading seems to cover both senses.
false_statement: Van Laar argued that equivocation on unrelated senses like "bank" misleads more than on related senses of one word, since a broad reading seems to cover both senses.
explanation: Unrelated senses (homonymy) are easy to notice and rarely fool anyone. Related senses (polysemy) admit a vague umbrella reading, so the shift slips past even an attentive listener.
