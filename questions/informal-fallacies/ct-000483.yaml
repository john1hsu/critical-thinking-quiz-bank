kind: counter
topic: Equivocation
topic_type: InformalFallacy
true_statement: Facing a suspected equivocation, a listener can answer with distinguo, simply stating which sense of the term they accept in each premise; the full charge of equivocation is the stronger move that must show how the argument misleads.
false_statement: Facing a suspected equivocation, a listener can answer with the full charge of equivocation, simply stating which sense of the term they accept in each premise; distinguo is the stronger move that must show how the argument misleads.
explanation: 'Distinguo is the lighter reply: it separates the senses and lets the arguer pick one and defend the doubted premise. Alleging equivocation outright carries the burden of showing how the shift misleads.'
