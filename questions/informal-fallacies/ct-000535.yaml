id: ct-000535
area: informal-fallacies
kind: scenario
topic: Argument from ignorance
topic_type: InformalFallacy
true_statement: A security team tests a new file-storage tool thoroughly, finds no serious flaw and concludes it is probably safe for client files. This argument from missing evidence is reasonable, since a serious flaw would very likely have shown up.
false_statement: A security team tests a new file-storage tool thoroughly, finds no serious flaw and concludes it is probably safe for client files. This argument from missing evidence is fallacious, since a lack of evidence can never count against a claim.
explanation: 'What decides it is the search: a sensitive test that would probably have caught a flaw makes its silence informative. The same conclusion drawn when nobody had looked would be the fallacy.'
