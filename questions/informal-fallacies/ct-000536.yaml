id: ct-000536
area: informal-fallacies
kind: counter
topic: Argument from ignorance
topic_type: InformalFallacy
true_statement: Told a new tool is safe because "nobody has shown it causes problems", ask what investigation was actually done and how likely it was to find a problem if one existed.
false_statement: Told a new tool is safe because "nobody has shown it causes problems", ask the sceptics to prove it unsafe, since the claim stands until someone disproves it.
explanation: Naming the missing search exposes whether the silence means anything. Demanding that sceptics disprove the claim is the burden shift that drives the fallacy; the person proposing the change owes the evidence.
