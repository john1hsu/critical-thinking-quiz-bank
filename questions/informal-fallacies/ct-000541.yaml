topic: Argument from ignorance
topic_type: InformalFallacy
true_statement: In Locke's dialectical version of the ad ignorantiam, a speaker demands that the opponent accept his proof or produce a better one, and Locke held that having no better one does not oblige anyone to accept it.
false_statement: In Locke's dialectical version of the ad ignorantiam, a speaker demands that the opponent accept his proof or produce a better one, and Locke held that having no better one does oblige the opponent to accept it.
explanation: For Locke, an opponent's failure to offer a stronger proof leaves the first one exactly as strong as it was. That is the root of the modern point that not disproving a claim doesn't establish it.
