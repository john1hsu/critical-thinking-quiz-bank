id: ct-000034
area: philosophy-of-reasoning
kind: scenario
topic: Gettier problem
topic_type: Concept
true_statement: A manager trusts a sales report whose filter silently broke last week; by coincidence its total matches the real figure. Her true, reasonable belief about the total is not knowledge.
false_statement: A manager trusts a sales report whose filter silently broke last week; by coincidence its total matches the real figure. Her belief about the total is knowledge, since it is justified and true.
explanation: 'This is a Gettier case: good but fallible evidence, a broken step, and a lucky match with the truth. Had the total been wrong she''d have believed the same thing, so justified true belief alone isn''t knowledge.'
