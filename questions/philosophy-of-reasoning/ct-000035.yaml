area: philosophy-of-reasoning
kind: counter
topic: Gettier problem
topic_type: Concept
true_statement: To check whether you were right for the right reasons, ask whether your reasons would still have led you to the same conclusion if it had been false.
false_statement: To check whether you were right for the right reasons, ask whether your conclusion turned out true, since a correct outcome confirms the reasoning.
explanation: Outcomes can be right by luck, as Gettier cases show. If you'd believe the same thing either way, being right says little about your reasoning, which matters for forecasts, audits and post-project reviews.
