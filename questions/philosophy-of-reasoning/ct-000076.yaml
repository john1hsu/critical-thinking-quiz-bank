true_statement: A finance team trusts a fraud-scoring tool because it has flagged cases accurately for years, though no one can explain how it decides. A reliabilist would count their belief in its flags as justified.
false_statement: A finance team trusts a fraud-scoring tool because it has flagged cases accurately for years, though no one can explain how it decides. An internalist would count their belief in its flags as justified.
explanation: Reliabilism, an externalist view, needs only that a reliable process produced the belief, whether or not the believer can see why. Internalism requires the justifying reasons to be accessible to the believer, which is exactly what is missing here.
