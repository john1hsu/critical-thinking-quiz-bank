topic: Epistemology
topic_type: Field
true_statement: Coherentists hold that beliefs are justified by how well they fit together as a system, rather than by resting on basic beliefs that need no further support.
false_statement: Foundationalists hold that beliefs are justified by how well they fit together as a system, rather than by resting on basic beliefs that need no further support.
explanation: The two views answer the question of where chains of reasons end. Foundationalism says they stop at basic beliefs; coherentism says no belief is basic and support comes from mutual fit.
