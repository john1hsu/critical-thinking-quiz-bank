true_statement: After recommending a new tool, a team lead goes back over her analysis to check whether her liking for the vendor coloured how she read the pilot data. In the Delphi Report's terms, she is exercising self-regulation.
false_statement: After recommending a new tool, a team lead goes back over her analysis to check whether her liking for the vendor coloured how she read the pilot data. In the Delphi Report's terms, she is exercising interpretation.
explanation: Self-regulation is the skill of examining and correcting your own reasoning. Interpretation is about clarifying what something means, such as what the vendor's "40% faster" figure actually measures.
