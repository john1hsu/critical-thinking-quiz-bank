true_statement: Rather than write a definition himself, Peter Facione had a panel of experts revise their views over successive rounds of anonymised questionnaires, producing the APA's 1990 Delphi Report.
false_statement: Rather than poll a panel of experts, Peter Facione wrote the definition himself and had the APA endorse it in a single vote, producing the 1990 Delphi Report.
explanation: The Delphi method has panellists see anonymised summaries of each other's answers and revise over several rounds. That process gave the report its claim to be an expert consensus, though agreement was not unanimous.
