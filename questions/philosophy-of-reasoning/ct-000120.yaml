true_statement: A 2015 meta-analysis using the Delphi definition found a small positive effect of critical-thinking instruction, g = 0.30 across 341 high-quality studies.
false_statement: A 2015 meta-analysis using the Delphi definition found a large positive effect of critical-thinking instruction, g = 0.80 across 341 high-quality studies.
explanation: Abrami and colleagues found instruction helps, but modestly. The biggest gains came from combining dialogue, authentic problems and mentoring, which is a useful guide when designing training.
