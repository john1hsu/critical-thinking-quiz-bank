topic: Justified true belief
topic_type: Concept
true_statement: The JTB analysis tries to define propositional knowledge, knowing that something is so, rather than knowing a person or knowing how to do something.
false_statement: The JTB analysis tries to define practical know-how, knowing how to do something, rather than knowing that something is so.
explanation: 'Its three conditions apply to a proposition p: p is true, S believes p, and S is justified in believing p. Skills and acquaintance with people fall outside what it sets out to define.'
