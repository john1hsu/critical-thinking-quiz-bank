topic: Justified true belief
topic_type: Concept
true_statement: Julien Dutant argued in 2015 that the view most philosophers held before Gettier was classical infallibilism, not the justified true belief analysis.
false_statement: Julien Dutant argued in 2015 that the justified true belief analysis was the near-universal received view before Gettier, just as Gettier's paper implied.
explanation: Dutant challenges the story that JTB was the traditional analysis, calling it partly a twentieth-century reconstruction made famous by Gettier's cases. On his reading, knowing earlier required a belief with a mark only true beliefs can have.
