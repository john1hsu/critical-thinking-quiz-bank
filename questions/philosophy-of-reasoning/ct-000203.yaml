topic: Bloom's taxonomy
topic_type: Framework
true_statement: A training goal says staff will "understand the expense policy", but the final quiz only asks them to recall spending limits. On Bloom's revised taxonomy the quiz sits at Remember, so it can't show whether the goal was met.
false_statement: A training goal says staff will "understand the expense policy", but the final quiz only asks them to recall spending limits. On Bloom's revised taxonomy the quiz sits at Understand, so it lines up with the goal.
explanation: Recalling limits is retrieval of factual knowledge, the Remember level, while the goal names Understand. Placing both in the taxonomy table exposes the mismatch between what is taught and what is tested.
