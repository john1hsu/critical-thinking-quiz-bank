topic: Bloom's taxonomy
topic_type: Framework
true_statement: To place a learning objective in Bloom's taxonomy, check what the task actually demands rather than looking its verb up in a list, since the same verb can call for very different thinking.
false_statement: To place a learning objective in Bloom's taxonomy, look its verb up in a standard Bloom's verb list, since each verb maps reliably onto a single level.
explanation: Verbs such as "explain" or "select" can mean simple recall or real analysis depending on the task. Published verb lists disagree widely, so the assessment itself is the better guide.
