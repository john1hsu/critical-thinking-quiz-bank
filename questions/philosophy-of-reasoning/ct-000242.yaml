id: ct-000242
area: philosophy-of-reasoning
kind: counter
topic: Socratic method
topic_type: Method
true_statement: When Socratic questioning shows that a colleague's claim clashes with other things she accepts, ask which of those commitments is weakest, since the clash shows only that something must give.
false_statement: When Socratic questioning shows that a colleague's claim clashes with other things she accepts, drop her opening claim, since the clash proves that it is the false one.
explanation: An elenchus exposes inconsistency among beliefs, not which belief is false; she could reasonably give up one of the other premises instead. Scholars call this the problem of the elenchus.
