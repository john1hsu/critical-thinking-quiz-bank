true_statement: A planner expects a ferry service to keep running on time because it has for years. Asked why the past is any guide, she says relying on the past has always worked before. That defence is circular in the way Hume described.
false_statement: A planner expects a ferry service to keep running on time because it has for years. Asked why the past is any guide, she says relying on the past has always worked before. That defence answers Hume, since it rests on experience rather than on a demonstration.
explanation: Her answer uses the past record to vouch for trusting past records, so it assumes the uniformity it was meant to support. Hume's point is that appeals to experience are exactly the arguments that already presuppose uniformity, so resting on experience is the problem, not the escape.
