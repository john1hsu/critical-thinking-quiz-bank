id: ct-000253
area: philosophy-of-reasoning
kind: counter
topic: Problem of induction
topic_type: Concept
true_statement: Before trusting a clean track record, look for a rival generalisation that fits the same record but predicts a different future, especially around a known change point such as a contract renewal.
false_statement: Before trusting a clean track record, gather more cases that fit it, since enough agreeing cases rule out any rival generalisation that predicts a different future.
explanation: Goodman's grue example shows that every past observation can support two generalisations that diverge later, so piling up agreeing cases cannot decide between them. The useful check is to name the rival pattern, such as 'reliable until the renewal', and ask what would tell them apart.
