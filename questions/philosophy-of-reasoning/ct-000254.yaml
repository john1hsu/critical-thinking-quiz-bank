true_statement: In Hume's fork, a demonstrative proof that the future will resemble the past is ruled out because a change in the course of nature can be imagined without contradiction.
false_statement: In Hume's fork, a demonstrative proof that the future will resemble the past is ruled out because every demonstration already relies on past experience of nature's uniformity.
explanation: The demonstrative horn fails because denying uniformity involves no contradiction, so no proof from relations of ideas can establish it. Presupposing uniformity is what sinks the other horn, the probable argument from experience.
