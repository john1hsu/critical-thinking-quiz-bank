true_statement: A hospital trains its billing auditors through in-depth casework on real claims, and instructors explicitly name and teach the reasoning principles involved as they go. In Ennis's typology this is the infusion approach.
false_statement: A hospital trains its billing auditors through in-depth casework on real claims, and instructors explicitly name and teach the reasoning principles involved as they go. In Ennis's typology this is the immersion approach.
explanation: Both infusion and immersion teach a subject in depth; what separates them is whether the reasoning principles are made explicit. Because the instructors name them, this is infusion; immersion invites critical thinking but never names its principles.
