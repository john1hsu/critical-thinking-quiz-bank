true_statement: To help trainees carry a reasoning skill to new problems, have them compare two worked problems that share a deep structure but differ on the surface.
false_statement: To help trainees carry a reasoning skill to new problems, have them compare two worked problems that look alike on the surface but differ in their deep structure.
explanation: Willingham recommends problem comparison because seeing the same underlying structure in different-looking cases helps learners recognise it next time. Since transfer must be taught rather than assumed, the variation should be on the surface, with the structure held constant.
