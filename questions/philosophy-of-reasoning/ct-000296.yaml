true_statement: Huber and Kuncel's 2016 meta-analysis found that critical thinking grows substantially over an ordinary college education, but curriculum-wide efforts to boost it did not clearly add long-term gains.
false_statement: Huber and Kuncel's 2016 meta-analysis found that critical thinking grows little over an ordinary college education, and only curriculum-wide efforts to boost it clearly added long-term gains.
explanation: The study is a caution for the field because ordinary college already produced large gains, while dedicated curricula did not clearly beat it in the long run. The false version reverses both halves of that finding.
