true_statement: To show that a staffing conclusion follows from three policy rules, an analyst derives it from them line by line using accepted inference rules. She is relying on the proof-theoretic account of logical consequence.
false_statement: To show that a staffing conclusion follows from three policy rules, an analyst derives it from them line by line using accepted inference rules. She is relying on the model-theoretic account of logical consequence.
explanation: Deriving a conclusion step by step in a deductive system is the proof-theoretic test of 'follows from'. The model-theoretic test instead asks whether any interpretation could make the premises true and the conclusion false; no derivation is involved.
