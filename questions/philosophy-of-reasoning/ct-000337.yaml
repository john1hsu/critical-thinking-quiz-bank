id: ct-000337
area: philosophy-of-reasoning
kind: counter
topic: Logic
topic_type: Field
true_statement: To show an inference is invalid, describe a possible case in which all its premises are true and its conclusion is false; one such case is enough, whatever the subject matter.
false_statement: To show an inference is invalid, show that one of its premises is in fact false; one false premise is enough, whatever the subject matter.
explanation: 'Validity is about whether the conclusion would follow, so a counterexample that keeps the premises true and makes the conclusion false is what refutes it. A false premise is a separate, factual problem: it makes an argument unsound, not invalid.'
