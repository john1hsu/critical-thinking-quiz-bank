true_statement: Gottlob Frege's Begriffsschrift of 1879 replaced the old subject-predicate analysis of sentences with a function-argument analysis, and is often credited with inventing modern quantificational logic.
false_statement: Gottlob Frege's Begriffsschrift of 1879 kept the old subject-predicate analysis of sentences and gave it an algebraic notation, and is often credited with inventing modern quantificational logic.
explanation: 'Frege''s break was analytical, not just notational: treating sentences as functions applied to arguments let his system handle general claims that syllogistic and Boolean methods could not. Merely re-notating subject and predicate would not have achieved that.'
