topic: Philosophical skepticism
topic_type: Concept
true_statement: To stress-test a confident belief, name the alternative that would look exactly the same given your evidence, and ask whether anything you have rules it out.
false_statement: To stress-test a confident belief, list the alternatives your evidence clearly rules out, since the longer that list is, the more secure the belief must be.
explanation: The skeptical closure argument targets exactly the scenario your evidence can't tell apart from the good case, such as a stalled data feed producing normal-looking numbers. Ruling out easy alternatives says nothing about that one.
