true_statement: Around 273 BCE Arcesilaus turned Plato's Academy toward skepticism, arguing both sides of questions and attacking Stoic claims to certainty.
false_statement: Around 273 BCE Pyrrho of Elis turned Plato's Academy toward skepticism, arguing both sides of questions and attacking Stoic claims to certainty.
explanation: Arcesilaus founded Academic skepticism inside Plato's school, drawing on Socrates' avowed ignorance. Pyrrho was a separate figure who wrote nothing and whose followers formed the rival Pyrrhonian line.
