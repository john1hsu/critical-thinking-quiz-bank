id: ct-000421
area: philosophy-of-reasoning
kind: scenario
topic: Vagueness
topic_type: Concept
true_statement: Since nobody can say exactly how many late deliveries make a supplier "unreliable", a buyer concludes there's no real difference between a supplier late twice a year and one late every week. That is the line-drawing fallacy.
false_statement: Since nobody can say exactly how many late deliveries make a supplier "unreliable", a buyer concludes there's no real difference between a supplier late twice a year and one late every week. That is a slippery slope.
explanation: The buyer treats the lack of a sharp boundary as proof that the clear cases don't differ, which is the line-drawing fallacy; borderline cases don't erase clear ones. A slippery slope would instead warn that a first step leads to a feared outcome.
