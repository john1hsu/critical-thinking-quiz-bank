topic: Vagueness
topic_type: Concept
true_statement: To stop readers misreading "likely" in a risk report, put the numeric range in brackets right after the word, since tables or tooltips that readers must open help little.
false_statement: To stop readers misreading "likely" in a risk report, put the numeric ranges in a separate table or tooltip, which works better than brackets in the text.
explanation: In a 2019 experiment, in-text brackets roughly doubled agreement with the official ranges, while tables and tooltips helped little because many readers never looked at them. A convention only cuts vagueness if readers actually see it.
