topic: Vagueness
topic_type: Concept
true_statement: '"Prime number" is general but not vague: it covers many different numbers, yet there are no borderline cases where it is unclear whether it applies.'
false_statement: '"Prime number" is vague but not general: it covers only a narrow set of numbers, yet there are borderline cases where it is unclear whether it applies.'
explanation: Vagueness means having borderline cases, not covering a wide range. Words like "bald" or "urgent" are vague; "prime number" applies to infinitely many numbers but always with a definite yes or no.
