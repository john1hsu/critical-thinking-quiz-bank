topic: Sorites paradox
topic_type: Concept
true_statement: A project lead approves each change request because one extra day can't turn an on-schedule project into a late one, until thirty requests later it is plainly late. Each step leans on tolerance, the engine of a sorites.
false_statement: A project lead approves each change request because one extra day can't turn an on-schedule project into a late one, until thirty requests later it is plainly late. Each step leans on a predicted chain of consequences, the engine of a slippery slope.
explanation: The lead's premise is that a vague predicate like "on schedule" survives any change too small to matter, which is tolerance; repeated, those harmless steps accumulate. A slippery slope instead warns that one step will cause the next, which nobody claims here.
