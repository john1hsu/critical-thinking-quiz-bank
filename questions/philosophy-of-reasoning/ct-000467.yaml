topic: Sorites paradox
topic_type: Concept
true_statement: 'The line-drawing version of the sorites runs in reverse: since one grain is not a heap and a million grains are, there must be an exact number of grains at which heaps begin.'
false_statement: 'The mathematical-induction version of the sorites runs in reverse: since one grain is not a heap and a million grains are, there must be an exact number of grains at which heaps begin.'
explanation: 'The line-drawing version uses the least-number principle to force a sharp boundary, which seems just as incredible. The induction version instead packs all the small steps into one premise: for every n, if n grains aren''t a heap, n+1 aren''t either.'
