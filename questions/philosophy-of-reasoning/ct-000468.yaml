area: philosophy-of-reasoning
kind: evidence
topic: Sorites paradox
topic_type: Concept
true_statement: In forced-march colour-categorisation tasks, Egré, de Gardelle and Ripley found people switched labels earlier than expected, the opposite of the hysteresis contextualist accounts predicted.
false_statement: In forced-march colour-categorisation tasks, Egré, de Gardelle and Ripley found people kept the starting label longer than expected, the hysteresis contextualist accounts predicted.
explanation: Contextualists expected people to cling to the first label during a forced march, but participants switched early, an effect the authors called enhanced contrast. Such small, task-specific results inform the debate without settling it.
