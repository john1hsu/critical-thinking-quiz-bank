id: ct-000509
area: philosophy-of-reasoning
kind: counter
topic: Operational definition
topic_type: Method
true_statement: Decide and justify how a staff survey will be scored before analysing the responses, since even a short questionnaire can be summed in hundreds of ways, each a potential forking path.
false_statement: Decide how a staff survey will be scored after analysing the responses, once you see which scoring fits best, since even a short questionnaire can be summed in hundreds of ways.
explanation: Fixing the measurement rule in advance stops the choice of scoring from bending toward a wanted result. Picking the scoring that fits best after looking is the flexible, after-the-fact practice Flake and Fried warn against.
