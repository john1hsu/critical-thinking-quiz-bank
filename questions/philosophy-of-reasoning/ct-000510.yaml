topic: Operational definition
topic_type: Method
true_statement: 'Operationalising a concept makes claims about it checkable but doesn''t make the measure right: finger length would be a perfectly reliable yet invalid measure of self-esteem.'
false_statement: 'Operationalising a concept makes claims about it checkable but doesn''t make the measure right: finger length would be a perfectly valid yet unreliable measure of self-esteem.'
explanation: Finger length gives the same reading every time, so it is reliable, but it has nothing to do with self-esteem, so it is invalid. Consistency of a measure is a different question from whether it captures the intended concept.
