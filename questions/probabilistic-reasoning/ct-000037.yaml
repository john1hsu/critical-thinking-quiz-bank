id: ct-000037
area: probabilistic-reasoning
kind: scenario
topic: Base-rate neglect
topic_type: ProbabilisticFallacy
true_statement: A filter flags 99% of fraudulent invoices and 2% of legitimate ones, and 1 in 1,000 invoices is fraudulent. A flagged invoice is still more likely legitimate than fraudulent.
false_statement: A filter flags 99% of fraudulent invoices and 2% of legitimate ones, and 1 in 1,000 invoices is fraudulent. A flagged invoice is about 98% likely to be fraudulent.
explanation: Out of 100,000 invoices, about 99 fraudulent ones are flagged alongside about 1,998 legitimate ones, so under 5% of flags are fraud. Reading the 98% off the test's accuracy ignores how rare fraud is.
