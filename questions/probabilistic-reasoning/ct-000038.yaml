id: ct-000038
area: probabilistic-reasoning
kind: counter
topic: Base-rate neglect
topic_type: ProbabilisticFallacy
true_statement: Restating a probability problem as natural frequencies, counting cases out of a concrete number such as 1,000, makes Bayesian answers far more common.
false_statement: Restating a probability problem as single-event percentages, rather than counts out of a concrete number such as 1,000, makes Bayesian answers far more common.
explanation: Counts carry the base rate inside them and need fewer steps. Gigerenzer and Hoffrage saw Bayesian answers rise from 16-28% with probabilities to 46-50% with frequencies, without any instruction.
