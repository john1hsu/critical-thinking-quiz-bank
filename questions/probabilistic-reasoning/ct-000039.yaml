id: ct-000039
area: probabilistic-reasoning
kind: evidence
topic: Base-rate neglect
topic_type: ProbabilisticFallacy
true_statement: Koehler's 1996 review argued that people rarely ignore base rates entirely, and weight them more when they are learned from experience or framed as frequencies.
false_statement: Koehler's 1996 review argued that people ignore base rates entirely unless they are given as precise percentages in a textbook-style problem.
explanation: Koehler held that the fallacy had been overstated and that real decisions rarely match the tidy Bayesian problem. The safer conclusion is that base rates are often underweighted, not always ignored.
