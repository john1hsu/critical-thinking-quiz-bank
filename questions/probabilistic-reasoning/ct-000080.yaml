id: ct-000080
area: probabilistic-reasoning
kind: counter
topic: Natural frequency format
topic_type: Technique
true_statement: When recasting a test result as counts, keep one reference group throughout, because rescaling each subgroup to 100 strips out the base rate and loses the benefit.
false_statement: When recasting a test result as counts, rescale each subgroup to 100, because normalising every branch keeps the base rate visible and preserves the benefit.
explanation: Natural frequencies work because each count sits inside the one before it, so the prior is built in. Normalised frequencies make every branch look the same size, which hides how rare the condition is.
