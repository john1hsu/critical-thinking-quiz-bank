topic: Simpson's paradox
topic_type: Phenomenon
true_statement: Rep A converts more leads than Rep B in both the city and the rural territory, yet has the lower overall rate because most of A's leads are rural, where conversions are rare. That is Simpson's paradox.
false_statement: Rep A converts more leads than Rep B in both the city and the rural territory, yet has the lower overall rate because most of A's leads are rural, where conversions are rare. That is Berkson's paradox.
explanation: The overall rate is a weighted average, and A's weight sits in the hard subgroup, so the pooled comparison reverses the within-group one. Berkson's paradox is a different trap, arising from selecting cases on a common effect.
