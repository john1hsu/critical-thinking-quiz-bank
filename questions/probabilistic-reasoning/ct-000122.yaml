id: ct-000122
area: probabilistic-reasoning
kind: counter
topic: Simpson's paradox
topic_type: Phenomenon
true_statement: If the third variable splitting your data is itself caused by the treatment, Pearl's analysis says to trust the pooled comparison rather than the split one.
false_statement: If the third variable splitting your data is itself caused by the treatment, Pearl's analysis says to trust the split comparison rather than the pooled one.
explanation: Splitting on a mediator removes part of the treatment's own effect, so the pooled figure is right there. Splitting is the fix when the third variable is a prior common cause; only a causal model of how the data arose tells you which case you are in.
