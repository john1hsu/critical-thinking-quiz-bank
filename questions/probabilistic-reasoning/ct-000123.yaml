true_statement: In fall 1973, Berkeley admitted about 44% of male and 35% of female graduate applicants, yet department-level data showed no bias against women.
false_statement: In fall 1973, Berkeley admitted about 35% of male and 44% of female graduate applicants, yet department-level data showed bias against women.
explanation: Women applied more often to departments that rejected most applicants, which dragged down their pooled rate. Bickel and colleagues found that, analysed by department, there was a small bias in women's favour.
