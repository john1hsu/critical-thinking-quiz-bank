id: ct-000161
area: probabilistic-reasoning
kind: scenario
topic: Regression to the mean
topic_type: Phenomenon
true_statement: A manager praises an analyst after an unusually brilliant report. His next report is merely average, and she concludes praise makes him complacent. Regression to the mean alone would predict that dip.
false_statement: A manager praises an analyst after an unusually brilliant report. His next report is merely average, and she concludes praise makes him complacent. The dip shows that her praise backfired.
explanation: 'An exceptional performance is likely to be followed by a more typical one whatever anyone says, so the drop needs no causal story about praise. This is the flight-instructor pattern: regression can make rewards seem to backfire.'
