id: ct-000162
area: probabilistic-reasoning
kind: counter
topic: Regression to the mean
topic_type: Phenomenon
true_statement: To test a fix for the worst-performing branches, randomly split those branches into a group that gets the fix and one that doesn't, then credit only the difference between them.
false_statement: To test a fix for the worst-performing branches, apply it to all of them and credit the whole before-and-after improvement to the fix.
explanation: Branches picked for an extreme bad spell would tend to improve anyway. Randomising them to fix and control means both groups regress equally, so only the gap between groups reflects the fix.
