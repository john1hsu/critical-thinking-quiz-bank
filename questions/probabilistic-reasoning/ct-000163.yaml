area: probabilistic-reasoning
kind: mechanism
topic: Regression to the mean
topic_type: Phenomenon
true_statement: Regression to the mean gets larger as the correlation between the first and second measurement gets weaker.
false_statement: Regression to the mean gets larger as the correlation between the first and second measurement gets stronger.
explanation: Extreme scores partly reflect a chance component that doesn't repeat; the less the two measurements share, the bigger that chance share and the further results fall back. With perfect correlation there would be no regression at all.
