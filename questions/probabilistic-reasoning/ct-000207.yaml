id: ct-000207
area: probabilistic-reasoning
kind: counter
topic: Conjunction fallacy
topic_type: ProbabilisticFallacy
true_statement: When a detailed scenario in a plan feels likely, price each step on its own and multiply them, since every added step can only keep the overall probability the same or lower it.
false_statement: When a detailed scenario in a plan feels likely, price each step on its own and multiply them, since adding plausible steps can raise the overall probability.
explanation: A vivid cause makes a story more convincing but never more probable than its outcome alone. Pricing steps separately exposes how quickly the chance of the whole chain shrinks.
