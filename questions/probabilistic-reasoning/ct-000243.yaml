topic: Gambler's fallacy
topic_type: ProbabilisticFallacy
true_statement: After approving four loan applications in a row, a loan officer turns down a fifth that is just as strong, feeling that another approval would be one too many. That is the gambler's fallacy at work in sequential decisions.
false_statement: After approving four loan applications in a row, a loan officer turns down a fifth that is just as strong, feeling that another approval would be one too many. That is the hot-hand fallacy at work in sequential decisions.
explanation: 'The officer expects the run of approvals to reverse, which is negative autocorrelation: the gambler''s fallacy, judging the case by the streak rather than its merits. The hot-hand fallacy is the opposite belief, that a streak will continue, which would have pushed her to approve again.'
