topic: Bayesian reasoning
topic_type: ReasoningMode
true_statement: A hiring manager treats a candidate saying "I'm a team player" as strong evidence of a good fit, though strong and weak candidates say it about equally often. In Bayesian terms it is weak evidence, since its likelihood ratio is close to one.
false_statement: A hiring manager treats a candidate saying "I'm a team player" as strong evidence of a good fit, though strong and weak candidates say it about equally often. In Bayesian terms it is strong evidence, since a good-fit candidate would very likely say it.
explanation: How diagnostic evidence is depends on the ratio of its probability if the hypothesis is true to its probability if false. Evidence that is likely either way barely moves the needle; asking only how likely it is under the hypothesis ignores the rival.
