true_statement: When two colleagues disagree about how alarming a warning sign is, check whether they differ on the prior or on the likelihoods; people who disagree on priors can often still agree on likelihoods, which pins down the dispute.
false_statement: When two colleagues disagree about how alarming a warning sign is, checking whether they differ on the prior or on the likelihoods won't help, since people who disagree on priors almost always disagree on likelihoods too.
explanation: Splitting a Bayesian judgment into its inputs shows where the disagreement sits. Often both agree how diagnostic the sign is and differ only on how common the problem was to begin with, which can then be settled with base-rate data.
