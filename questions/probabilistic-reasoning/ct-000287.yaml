true_statement: Thomas Bayes's essay on inverse probability was found among his papers after his death by Richard Price, who sent it to the Royal Society, where it was read in 1763.
false_statement: Thomas Bayes's essay on inverse probability was found among his papers after his death by Abraham de Moivre, who sent it to the Royal Society, where it was read in 1763.
explanation: Price, Bayes's friend, communicated the essay and noted that de Moivre had not solved this inverse question. De Moivre is named in the story only as someone who had left the problem open.
