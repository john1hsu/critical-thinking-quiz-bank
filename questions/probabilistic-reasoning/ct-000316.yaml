topic: Calibration
topic_type: Concept
true_statement: To check a forecaster's calibration, group many resolved forecasts by stated probability and compare each group's hit rate, rather than reacting to one confident miss.
false_statement: To check a forecaster's calibration, look at the most confident forecast that missed, since one high-confidence miss is enough to show overconfidence.
explanation: 'Calibration is a property of a set of judgments: an 80% call is supposed to miss one time in five. Only a record of many forecasts at the same level, reviewed in batches, can show whether stated confidence matches how often they come true.'
