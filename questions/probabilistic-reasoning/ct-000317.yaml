true_statement: In 1950 Brier proposed scoring weather probability forecasts by the average squared gap between each stated probability and the outcome, coded 1 if it happened and 0 if not.
false_statement: In 1950 Murphy proposed scoring weather probability forecasts by the average squared gap between each stated probability and the outcome, coded 1 if it happened and 0 if not.
explanation: The score bears Brier's name and came out of weather forecasting; lower is better. Murphy's contribution came in 1973, when he split the Brier score into reliability, resolution and uncertainty.
