id: ct-000372
area: probabilistic-reasoning
kind: definition
topic: Conditional probability
topic_type: Concept
true_statement: Two mutually exclusive events that each have a positive probability are strongly dependent, because learning that one happened rules the other out.
false_statement: Two mutually exclusive events that each have a positive probability are independent, because the two of them never happen together.
explanation: Independence means learning B leaves the probability of A unchanged. If A and B exclude each other, learning B drops A's probability to zero, the opposite of independence, so the two ideas should not be confused.
