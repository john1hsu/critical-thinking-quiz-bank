area: probabilistic-reasoning
kind: counter
topic: Law of small numbers
topic_type: CognitiveBias
true_statement: Before ranking fund managers on two strong years, ask how much spread pure chance would produce across all of them, since short records exaggerate differences in skill.
false_statement: Before ranking fund managers on two strong years, there's little need to ask how much spread chance would produce, since even short records mostly reflect real differences in skill.
explanation: Rabin's model shows that believers in small samples see far more real variation in ability than exists, which he called fictitious variation. Comparing the observed spread with what luck alone would give is the check.
