true_statement: Benjamin's 2018 review judged the gambler's fallacy well supported but the evidence for over-inference from small samples weak, noting that people more often under-infer in experiments.
false_statement: Benjamin's 2018 review judged over-inference from small samples well supported but the evidence for the gambler's fallacy weak, noting that people more often over-infer in experiments.
explanation: The expectation that short runs balance out holds up across surveys, experiments and field data, but the broader claim that people jump to conclusions from small samples does not. That split is why the bias is rated contested.
