kind: scenario
topic: Likelihood ratio framework
topic_type: Framework
true_statement: A device match is 200 times more probable if a given employee filed a disputed claim than if someone else did, and an analyst concludes the employee very likely filed it, though thousands of staff could have. The reasoning skips the prior odds.
false_statement: A device match is 200 times more probable if a given employee filed a disputed claim than if someone else did, and an analyst concludes the employee very likely filed it, though thousands of staff could have. The reasoning is sound.
explanation: A likelihood ratio measures only how strongly the finding favours one proposition; it must be multiplied by the prior odds. With thousands of possible submitters and nothing else pointing to this person, the posterior can still favour innocence.
