topic: Likelihood ratio framework
topic_type: Framework
true_statement: 'Before multiplying the likelihood ratios of two pieces of evidence, check they are independent: two cameras recording the same person are not, and multiplying their ratios overstates the joint strength.'
false_statement: 'Before multiplying the likelihood ratios of two pieces of evidence, check they are independent: two cameras recording the same person are not, and multiplying their ratios understates the joint strength.'
explanation: Multiplying assumes each item adds fresh information. Two dependent items largely repeat each other, so treating them as independent counts the same support twice and inflates it.
