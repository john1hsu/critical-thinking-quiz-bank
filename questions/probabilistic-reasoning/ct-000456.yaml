true_statement: In Thompson and Newman's 2015 experiment, 86% of those given a likelihood ratio misread it as the chance the defendant was the source, against 26% of those given a verbal statement.
false_statement: In Thompson and Newman's 2015 experiment, 26% of those given a likelihood ratio misread it as the chance the defendant was the source, against 86% of those given a verbal statement.
explanation: The numeric likelihood ratio drew the most transposed readings, more even than random match probabilities at 78%, while verbal statements drew far fewer. The framework disciplines experts but does not by itself fix how listeners hear it.
