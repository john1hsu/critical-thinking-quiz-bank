id: ct-000496
area: probabilistic-reasoning
kind: scenario
topic: Prosecutor's fallacy
topic_type: ProbabilisticFallacy
true_statement: A badge log shows a partial card ID that only 1 in 1,000 cards would share by chance, and security concludes there is a 99.9% chance the matching employee entered the server room. That is the prosecutor's fallacy.
false_statement: A badge log shows a partial card ID that only 1 in 1,000 cards would share by chance, and security concludes there is a 99.9% chance the matching employee entered the server room. That is the defense attorney's fallacy.
explanation: The 1-in-1,000 figure is the chance of a match if the employee didn't enter, not the chance they didn't enter given the match; with 5,000 cards, about five others would match. The defense attorney's fallacy errs the other way, writing a match off as worthless.
