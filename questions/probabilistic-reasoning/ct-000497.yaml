area: probabilistic-reasoning
kind: counter
topic: Prosecutor's fallacy
topic_type: ProbabilisticFallacy
true_statement: 'When correcting a prosecutor''s fallacy, don''t swing to treating a match as worthless because many people share the trait: narrowing a million possible sources to a few thousand is still strong evidence.'
false_statement: 'When correcting a prosecutor''s fallacy, it''s right to treat a match as worthless because many people share the trait: narrowing a million possible sources to a few thousand leaves it weak evidence.'
explanation: Overcorrecting is the defense attorney's fallacy. A trait shared by thousands still cuts the field dramatically, so it should be combined with the rest of the case rather than discarded.
