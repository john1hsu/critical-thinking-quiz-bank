true_statement: In Thompson and Schumann's 1987 experiment, 22.2% committed the prosecutor's fallacy when a 2% hair-match rate was given as a conditional probability, against 4.2% when it also came as a count of people in a city.
false_statement: In Thompson and Schumann's 1987 experiment, 4.2% committed the prosecutor's fallacy when a 2% hair-match rate was given as a conditional probability, against 22.2% when it also came as a count of people in a city.
explanation: Stating how many people in a city of a million would share the trait made the transposition far rarer. Restating rates as counts of people is a practical guard against the error.
