true_statement: Bid A costs 20,000 with a 60% chance of 200,000 profit; Bid B costs 40,000 with a 20% chance of 800,000, and the firm can make only one. On expected value alone B is better, though it loses money four times in five.
false_statement: Bid A costs 20,000 with a 60% chance of 200,000 profit; Bid B costs 40,000 with a 20% chance of 800,000, and the firm can make only one. On expected value alone A is better, since it wins far more often.
explanation: A is worth 0.6 x 200,000 - 20,000 = 100,000 and B is worth 0.2 x 800,000 - 40,000 = 120,000. Expected value weighs payoffs by probability, so neither the likeliest outcome nor the biggest number should decide on its own.
