area: probabilistic-reasoning
kind: counter
topic: Expected value
topic_type: Concept
true_statement: When a cost model is nonlinear, don't feed it the average input and call the result the average output, since the expectation of a function is generally not the function of the expectation.
false_statement: When a cost model is nonlinear, it's safe to feed it the average input and call the result the average output, since by linearity the expectation of a function equals the function of the expectation.
explanation: Linearity holds for sums and for scaling or shifting a quantity, not for arbitrary functions of it. A model with thresholds or curves can give an average output far from its output at the average input.
