true_statement: 'In Huygens''s treatment of games of chance, expectation came first: his tract never uses the concept of probability, which was only later read back into it.'
false_statement: 'In Huygens''s treatment of games of chance, probability came first: his tract defined expectation from probabilities, using methods he had learned from Pascal and Fermat.'
explanation: Huygens built his method on the value of a player's expectation, a fair share of the stakes, and worked it out without learning Pascal and Fermat's methods. Probability as a concept was read into his rules afterwards.
