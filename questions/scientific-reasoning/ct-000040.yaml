id: ct-000040
area: scientific-reasoning
kind: scenario
topic: Falsifiability criterion
topic_type: Principle
true_statement: A team claims "the redesign improves engagement" but names no metric or threshold, so any later dashboard can be read as support. As stated, the claim isn't falsifiable.
false_statement: A team claims "the redesign improves engagement" but names no metric or threshold, so any later dashboard can be read as support. The claim is falsifiable because engagement can be measured.
explanation: A claim is falsifiable only if some possible result would count against it. Measurability isn't enough; committing in advance to an outcome that would show the redesign failed is what lets the data refute it.
