id: ct-000041
area: scientific-reasoning
kind: counter
topic: Falsifiability criterion
topic_type: Principle
true_statement: After a failed prediction, a rescue assumption is legitimate if it yields a new, checkable prediction, as the unseen planet posited for Uranus's orbit did.
false_statement: After a failed prediction, any rescue assumption is legitimate as long as it restores agreement with the data, even if it predicts nothing new.
explanation: Rescues that only patch the mismatch are ad hoc and shield a theory from refutation. The planet posited to explain Uranus's orbit was then found, so that rescue earned its place by passing a new test.
