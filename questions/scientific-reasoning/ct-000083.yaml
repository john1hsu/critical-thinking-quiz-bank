kind: counter
topic: Hypothesis testing
topic_type: Method
true_statement: Testing cases where you expect your hypothesis to hold is often a sound strategy; it mainly misleads when your hypothesis is narrower than the truth.
false_statement: Testing cases where you expect your hypothesis to hold is often a sound strategy; it mainly misleads when your hypothesis is broader than the truth.
explanation: Klayman and Ha showed that positive tests can't reveal cases that fit the real rule but fall outside a too-narrow guess, as in Wason's 2-4-6 task. The useful question isn't positive versus negative, but which test could show you are wrong.
