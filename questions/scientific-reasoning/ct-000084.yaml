true_statement: In Wason's 1960 2-4-6 task, only 6 of 29 participants announced the correct rule, any increasing sequence, on their first attempt.
false_statement: In Wason's 1960 2-4-6 task, 23 of 29 participants announced the correct rule, any increasing sequence, on their first attempt.
explanation: Most people proposed triples that fit their own guess, such as numbers rising by two, so they never saw evidence against it. Those who succeeded generated more instances their hypothesis said should fail.
