id: ct-000124
area: scientific-reasoning
kind: scenario
topic: Randomized controlled trial
topic_type: Method
true_statement: An app team finds that customers who opened its onboarding email kept their subscriptions longer than those who didn't. That alone doesn't show the email works, since more engaged customers may both open emails and stay.
false_statement: An app team finds that customers who opened its onboarding email kept their subscriptions longer than those who didn't. That alone shows the email works, since the two groups differ only in whether they read it.
explanation: Openers chose themselves, so engagement is a likely confounder. Letting a random number decide who receives the email is what makes the groups differ, on average, only in the email.
