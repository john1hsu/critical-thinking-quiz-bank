id: ct-000125
area: scientific-reasoning
kind: counter
topic: Randomized controlled trial
topic_type: Method
true_statement: In a trial, whoever enrols participants shouldn't know the next assignment in advance, or they can steer people toward one arm and recreate selection bias.
false_statement: In a trial, whoever enrols participants should know the next assignment in advance, so they can steer people toward the arm that keeps the groups balanced.
explanation: Allocation concealment protects randomisation from human judgement; foreseeing assignments lets enrollers sort patients by hunches. Balance on known factors is achieved with stratified or block randomisation, not by choice.
