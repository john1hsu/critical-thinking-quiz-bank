true_statement: Deaton and Cartwright argue that randomisation doesn't make trial groups equal in everything but the treatment; at best it gives an unbiased estimate, of limited use from a single trial.
false_statement: Deaton and Cartwright argue that randomisation makes trial groups equal in everything but the treatment, so a single trial gives a precise estimate that needs no further thought about covariates.
explanation: 'Their 2018 critique targets the "gold standard" claim: chance imbalances remain, and results apply to the trial sample. They see RCTs as most informative inside a wider research programme with theory and other methods.'
