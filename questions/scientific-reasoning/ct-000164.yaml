topic: Occam's razor
topic_type: Principle
true_statement: Support tickets spike. One bug would explain the spike but not why only mobile users are affected; a two-cause account explains both facts. Occam's razor gives no reason to prefer the one-bug story here.
false_statement: Support tickets spike. One bug would explain the spike but not why only mobile users are affected; a two-cause account explains both facts. Occam's razor favours the one-bug story here, since it posits fewer causes.
explanation: The razor only ranks hypotheses that explain the evidence equally well. A simpler story that leaves a fact unexplained isn't the parsimonious winner but the weaker account, so check the tie before counting causes.
