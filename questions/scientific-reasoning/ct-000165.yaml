true_statement: In debates about simplicity, parsimony counts the kinds of thing a theory says exist, while elegance counts its basic principles and how compactly they are stated.
false_statement: In debates about simplicity, elegance counts the kinds of thing a theory says exist, while parsimony counts its basic principles and how compactly they are stated.
explanation: 'Parsimony is ontological simplicity and elegance is syntactic simplicity. They can pull apart: positing Neptune added an entity but left celestial mechanics'' laws unchanged. The false version swaps the two labels.'
