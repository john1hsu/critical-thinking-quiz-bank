area: scientific-reasoning
kind: evidence
topic: Occam's razor
topic_type: Principle
true_statement: In Lombrozo's 2007 experiments, people gave simpler causal explanations a higher prior, but that preference could be overridden when probability information clearly favoured a more complex one.
false_statement: In Lombrozo's 2007 experiments, people gave simpler causal explanations a higher prior, and that preference held firm even when probability information clearly favoured a more complex one.
explanation: Simplicity weighed heavily, so complex explanations needed disproportionately strong evidence, but clear probability information could still win. That is why the razor should be treated as a provisional starting point.
