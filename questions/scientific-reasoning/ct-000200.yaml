true_statement: An A/B test finds a redesigned checkout page lifted conversions, and a manager declares the redesign "proven". On the hypothetico-deductive view, the passed test lends the redesign support but not proof.
false_statement: An A/B test finds a redesigned checkout page lifted conversions, and a manager declares the redesign "proven". On the hypothetico-deductive view, the passed test proves the redesign works, since its prediction came true.
explanation: A confirmed prediction is consistent with the hypothesis but can't rule out rivals or a fluke, so it adds support rather than proof. A follow-up failure could still implicate the hypothesis or its auxiliaries.
