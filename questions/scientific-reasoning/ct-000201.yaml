true_statement: The Vienna Circle, led by Moritz Schlick and meeting from 1924, supplied the blueprint for analytic philosophy of science.
false_statement: The Vienna Circle, led by Thomas Kuhn and meeting from 1924, supplied the blueprint for analytic philosophy of science.
explanation: 'Schlick led the Circle, with members such as Carnap, Neurath and Hahn, and its emigrés carried the programme abroad in the 1930s. Kuhn came later: his 1962 Structure turned the field toward history and away from that rule-governed picture.'
