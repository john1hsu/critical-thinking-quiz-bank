true_statement: Kuhn argued that shared values such as accuracy, consistency, simplicity and fruitfulness guide scientists' choice between theories without dictating it.
false_statement: Kuhn argued that shared values such as accuracy, consistency, simplicity and fruitfulness act as rules that dictate which theory scientists must choose.
explanation: Because the values can pull in different directions and be weighed differently, Kuhn denied that rules fix theory choice. That denial is what drew charges of relativism, which he rejected.
