area: scientific-reasoning
kind: scenario
topic: Researcher degrees of freedom
topic_type: Concept
true_statement: An analyst runs one sincere test of a pilot scheme, deciding to drop part-time staff only after seeing they responded differently, and gets a significant result. Though she tested just once, this is the garden of forking paths.
false_statement: An analyst runs one sincere test of a pilot scheme, deciding to drop part-time staff only after seeing they responded differently, and gets a significant result. Because she tested just once, this is p-hacking.
explanation: Gelman and Loken's point is that a data-dependent choice inflates false positives even in a single honest analysis, since different data would have led to a different, equally reasonable path. P-hacking implies consciously running test after test, which did not happen here.
