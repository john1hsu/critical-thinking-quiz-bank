topic: Researcher degrees of freedom
topic_type: Concept
true_statement: A preregistration that names the main outcome but leaves exclusions and the stopping rule open still leaves room for analytic flexibility, so check how specific the plan was.
false_statement: A preregistration that names the main outcome but leaves exclusions and the stopping rule open closes off analytic flexibility, so checking how specific the plan was is unnecessary.
explanation: Preregistration protects only as far as it is specific, precise and exhaustive; every choice it leaves unfixed is still a fork that can be taken after seeing the data. Ask which decisions were locked in advance, not merely whether a plan exists.
