false_statement: In a 2018 many-analysts study, 29 teams given the same data on referees and players' skin tone all found a significant positive effect on red cards, differing only in its size.
explanation: The same dataset and question yielded estimates from no effect to a strong one, and only 20 of 29 teams reached significance. No one was fishing, which shows that reasonable analytic choices alone can change a conclusion.
