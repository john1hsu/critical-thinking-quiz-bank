topic: Confounding
topic_type: Phenomenon
true_statement: Staff who use the office gym take fewer sick days, and HR credits the gym. But younger employees are both likelier to use the gym and less often ill. Age here is a confounder.
false_statement: Staff who use the office gym take fewer sick days, and HR credits the gym. But younger employees are both likelier to use the gym and less often ill. Age here is a collider.
explanation: 'Age comes before gym use and independently affects both gym use and illness, so it is a common cause, the defining shape of a confounder. A collider is the reverse: a common effect of the two variables, which age cannot be.'
