true_statement: Ronald Fisher first used "confounding" in research design for a deliberate device in agricultural field trials; the sense of an unwanted extraneous variable came later, from Leslie Kish in 1959.
false_statement: Ronald Fisher first used "confounding" in research design for an unwanted extraneous variable in field trials; Leslie Kish later turned it into a deliberate design device in 1959.
explanation: In The Design of Experiments, Fisher's confounding meant intentionally mixing some higher-order interactions with other effects to save plots. Kish, writing on social-science design, gave the word its modern meaning of an uncontrolled variable tangled with the factor of interest, so the false version runs the history backwards.
