id: ct-000318
area: scientific-reasoning
kind: scenario
topic: Correlation versus causation
topic_type: Principle
true_statement: A retail chain finds that stores with more security guards report more shoplifting, and a manager suggests guards attract thieves. But head office posts extra guards at stores where theft is already high. The likeliest explanation is reverse causation.
false_statement: A retail chain finds that stores with more security guards report more shoplifting, and a manager suggests guards attract thieves. But head office posts extra guards at stores where theft is already high. The likeliest explanation is a common cause.
explanation: The deciding detail is that high theft is what brings the guards, so the arrow runs from outcome to supposed cause. A common-cause story would need a third factor driving both guard numbers and theft, and none is described.
