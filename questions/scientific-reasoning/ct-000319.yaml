id: ct-000319
area: scientific-reasoning
kind: counter
topic: Correlation versus causation
topic_type: Principle
true_statement: When a news story says a habit "boosts" or "prevents" something, check whether the study behind it set the habit by intervention or only observed who had it.
false_statement: When a news story says a habit "boosts" or "prevents" something, check whether the study behind it found a statistically significant link.
explanation: Causal verbs are only earned by a design that can rule out common causes and reverse causation, which is why an intervention outweighs passive observation. A significant result speaks only partly to chance and says nothing about which way the causation runs.
