true_statement: A 2014 study of UK university press releases found that when a release overstated correlational research as causal, 81% of related news stories repeated the exaggeration, against 18% when the release was accurate.
false_statement: A 2014 study of UK university press releases found that when a release overstated correlational research as causal, only 18% of related news stories repeated the exaggeration, as most journalists corrected it.
explanation: 'The study traced much causal overstatement in health news back to the universities'' own press releases: news coverage largely passed the exaggeration on. Journalists mostly did not catch it, so it pays to check the study design rather than trust the headline verb.'
