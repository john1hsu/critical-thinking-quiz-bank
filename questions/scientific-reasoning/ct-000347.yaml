area: scientific-reasoning
kind: counter
topic: Mill's methods
topic_type: Method
true_statement: Mill's methods only eliminate suspects from a list you supply, so before trusting their verdict ask whether the real cause could be missing from that list.
false_statement: Mill's methods generate candidate causes from the cases themselves, so you need not worry whether your initial list of suspects is complete.
explanation: Every method works by striking factors off a list; none can surface a factor nobody thought to record. A clean result therefore only shows which listed suspect survived, so the first check is whether the list was complete.
