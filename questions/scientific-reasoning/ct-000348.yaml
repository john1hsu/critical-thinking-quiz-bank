topic: Mill's methods
topic_type: Method
true_statement: Critics point out that the plurality of causes, where one effect can arise from different causes, undermines Mill's method of agreement.
false_statement: Critics point out that the plurality of causes, where one effect can arise from different causes, undermines Mill's method of residues.
explanation: Agreement looks for the single circumstance shared by every case of the effect, so if different cases have different causes there may be no shared factor, or a misleading one. Residues instead subtracts known causes from one effect, a different weakness.
