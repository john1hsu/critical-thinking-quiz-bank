true_statement: A trial of a shorter mobile checkout form looks like a win, but a colleague notes that a payment outage overlapped the test, so the team reruns it. That critical scrutiny is part of the scientific process itself.
false_statement: A trial of a shorter mobile checkout form looks like a win, but a colleague notes that a payment outage overlapped the test, so the team reruns it. That critical scrutiny comes after the scientific process, which ends once the data are analysed.
explanation: On the realistic picture of science, ideas are kept only if they survive testing and the community's probing, and results are exposed to criticism and replication before anyone relies on them. A step list that stops at analysis leaves out the check that caught the confound here.
