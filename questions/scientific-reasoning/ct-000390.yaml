true_statement: The step-by-step school recipe for the scientific method (observe, hypothesise, experiment, conclude) is a later teaching device, traced partly to Pearson's 1892 Grammar of Science and Dewey's 1910 How We Think.
false_statement: The step-by-step school recipe for the scientific method (observe, hypothesise, experiment, conclude) comes straight from Francis Bacon's 1620 Novum Organum, which set out those steps.
explanation: Bacon proposed eliminative induction with tables of presence, absence and degrees, not the classroom step list. The tidy recipe arrived around the turn of the twentieth century, and critics argue it has no canonical source in the history of science.
