id: ct-000440
area: scientific-reasoning
kind: counter
topic: Power analysis
topic_type: Method
true_statement: When planning a study's sample size, base the effect size on the smallest effect worth detecting rather than on one estimated from a small pilot, since a pilot's estimate is too imprecise.
false_statement: When planning a study's sample size, base the effect size on the one estimated from a small pilot rather than on the smallest effect worth detecting, since the pilot measured it directly.
explanation: Small pilots give noisy effect estimates, and published effects are inflated by publication bias, so plans built on them overstate power. Anchoring on the smallest effect that would matter in practice is the strongest justification.
