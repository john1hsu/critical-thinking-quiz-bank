true_statement: Sedlmeier and Gigerenzer found that by 1984, median power to detect a medium effect in the journal Cohen had reviewed had fallen from .46 to .37.
false_statement: Sedlmeier and Gigerenzer found that by 1984, median power to detect a medium effect in the journal Cohen had reviewed had risen from .37 to .46.
explanation: Decades after Cohen warned that studies were underpowered, power had got worse, and almost no experiments even mentioned it. Advice alone did not change practice, which is why sample-size planning is now pushed through journals and preregistration.
