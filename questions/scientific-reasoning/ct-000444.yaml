id: ct-000444
area: scientific-reasoning
kind: scenario
topic: Power analysis
topic_type: Method
true_statement: An HR team pilots a new onboarding programme on one quarter's 15 hires, though a power calculation said it needed about four quarters per group. A non-significant pilot result would be uninformative about whether the programme works.
false_statement: An HR team pilots a new onboarding programme on one quarter's 15 hires, though a power calculation said it needed about four quarters per group. A non-significant pilot result would be good evidence that the programme fails.
explanation: An underpowered study has a high chance of missing a real effect, so a null result from it says little, and a positive one would be fragile. The honest options are to gather more data, narrow the question, or label the pilot exploratory.
