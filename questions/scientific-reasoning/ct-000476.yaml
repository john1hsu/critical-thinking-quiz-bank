id: ct-000476
area: scientific-reasoning
kind: counter
topic: Random sampling
topic_type: Method
true_statement: To learn whether a training course causes better performance, randomly assign who takes it; randomly sampling whom you study supports generalising to a population, not causal conclusions.
false_statement: To learn whether a training course causes better performance, randomly sample whom you study; randomly assigning who takes it supports generalising to a population, not causal conclusions.
explanation: Random assignment spreads lurking variables evenly across treatment groups, which is what licenses a causal claim. Random sampling decides who is studied and lets you generalise from the sample to the population.
