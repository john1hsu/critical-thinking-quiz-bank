topic: Random sampling
topic_type: Method
true_statement: A 2012 reanalysis of the failed 1936 Literary Digest poll traced its error mainly to non-response bias, finding that car and telephone owners actually favoured Roosevelt.
false_statement: A 2012 reanalysis of the failed 1936 Literary Digest poll traced its error mainly to its frame of car and telephone owners, finding that those owners heavily favoured Landon.
explanation: The textbook story blames a frame of car and phone owners, but Gallup data showed those owners leaned to Roosevelt, so who chose to reply mattered more. Either way, millions of returns could not rescue a sample not selected, or answered, by chance.
