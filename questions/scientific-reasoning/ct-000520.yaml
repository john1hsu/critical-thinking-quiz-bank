true_statement: HR studies whether a voluntary leadership course raises promotion rates, using only staff with a manager nomination, though nominations depend on both course attendance and ambition. That restriction conditions on a collider and can create a spurious link.
false_statement: HR studies whether a voluntary leadership course raises promotion rates, using only staff with a manager nomination, though nominations depend on both course attendance and ambition. That restriction blocks a confounding path and removes bias.
explanation: The nomination is a common effect of attendance and ambition, so selecting on it opens a path between them that wasn't there. Ambition, a common cause of enrolment and promotion, is the fork that should be adjusted for instead.
