topic: Causal diagrams
topic_type: Method
true_statement: When drawing a causal diagram, justify every missing arrow, since each omitted arrow claims there is no direct effect and these are the strongest assumptions in the graph.
false_statement: When drawing a causal diagram, justify every arrow you add, since only drawn arrows make claims and a missing arrow simply leaves the question open.
explanation: An absent arrow asserts that one variable has no direct effect on another, and those assertions decide which adjustment sets work. Drawing from subject knowledge, rather than from the variables you happen to have, keeps them honest.
