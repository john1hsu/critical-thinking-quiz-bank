true_statement: A 2021 review of 234 health studies that used causal diagrams found that only 48% reported the adjustment sets their diagrams implied, and only 21% stated their target estimand.
false_statement: A 2021 review of 234 health studies that used causal diagrams found that only 21% reported the adjustment sets their diagrams implied, and only 48% stated their target estimand.
explanation: 'About half reported the adjustment set and about a fifth named the estimand, so practice lags the method''s promise. When reading such a study, look for both: the question being estimated and the variables the diagram says to control.'
